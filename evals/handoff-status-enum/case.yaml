# Format exemplar for the eval suite. Every case in section 2 follows the
# conventions established here: schema_version pinned, provenance cited, a
# smoke tag implying non-judged graders only, and the prompt is the real
# implementer briefing — never a paraphrase.
#
# Provenance: openspec/changes/archive/2026-08-25-tick-tasks-from-recorded-outcomes/proposal.md
# A live ship run returned status "done" — a value outside the handoff enum —
# and five tasks that record-batch had failed were ticked anyway. The enum this
# case pins is {ok, blocked, partial}; "done" is not in it.
schema_version: "1.0"
name: handoff-status-enum
tags: [smoke]
provenance: "openspec/changes/archive/2026-08-25-tick-tasks-from-recorded-outcomes/proposal.md"
runs: 1
execution:
  # The verbatim single-task briefing that workflows/ship.js:97-201 assembles
  # (assembleImplementerPrompt, single-task branch). Rendered, not paraphrased,
  # so the case tracks the real prompt as it is edited.
  prompt: |
    Implement exactly one task from OpenSpec change "tick-tasks-from-recorded-outcomes".

    TASK 2.1: Add a `--dry-run` flag to `bin/interlock record-batch` that prints the tasks it would tick and exits 0 without writing tasks.md. Unit-test it in `test/spine/`.

    CONTEXT — read only what your tier needs:
      tier 1: the task description alone
      tier 2+: the relevant section of openspec/changes/tick-tasks-from-recorded-outcomes/design.md
      tier 3+: the relevant file under openspec/changes/tick-tasks-from-recorded-outcomes/specs/
      tier 4+: design.md and the specs in full
    Your tier is 1.

    RULES:
    - Implement ONLY this task. Do not modify files outside its scope.
    - Do not fix unrelated problems you notice; report them instead.
    - Run typecheck and lint on what you changed.
    - Do not commit, and do not edit tasks.md — the orchestrator owns both.
    - If .claude/graph/graph.json exists, interlock-graph query / consumers before grep.
    - Locate (graph or grep) then Read spans. Do not re-read a file unless it changed.
    - Return the schema only. No narrative.
    - If your tier is 1 or 2: after typecheck/lint pass, stop. Do not refactor or polish.

    HANDOFF — the next wave reads your packet instead of reconstructing your work from git, so every result MUST carry one:
      { "schema": "interlock.wave-handoff/1", "taskId": "2.1", "status": "ok" | "blocked" | "partial",
        "summary": "...", "evidence": ["path:12-40"], "next": "...", "blocker": null }
    - status "ok" means blocker is null; "blocked" and "partial" need a non-empty blocker.
    - evidence is at most 8 locators (path, path:line, path:start-end) — never file bodies.
    - Keep it terse. A packet over the character cap `interlock limits` publishes fails the task, and it is never truncated for you.

    Report ok:false if you could not complete the task, with what blocked you.
  max_turns: 8
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep]
