# Review Range: preflight-closer, fixed by cb6313a.
#
# One of the six cases that measure the review-code findings consult (design
# D10, D12, D15, D16). The fixture is hooks/preflight.mjs as fea376c shipped it, a
# short proposal written from that commit's intent, and a planted review in
# which both skeptics dismiss the real bug on a citation that resolves to the
# changed file but does not read the code that decides the defect. label.md
# names the dismissed finding a human would want doubted.
#
# The fixture is placed by fixture.sh, which runs only under --scaffold. A run
# without it starts in an empty workspace: the review line finds no findings
# file, no brief is written, the check records a consult that did not run, and
# check-drafted fails, which is how the report shows the run was unseeded
# rather than the advisor wrong.
#
# Graders: check-drafted and check-ran are the deterministic floor; a run that
# drafts flags in its own prose never runs the check line and fails check-ran.
# consult-spawned is an arm: with-only indicator. matches-label and
# repeats-survivor are judged, and their human labels are what
# `interlock review-advisor --verdict` tallies; each is named in
# evals/CALIBRATION-DEFERRALS.md until a transcript exists to label.
#
# No Write in allowed_tools: the check reads the reply from standard input and
# persists it itself.
#
# SMOKE TAG: deliberately absent. The case carries judged graders and spends an
# opus consult, so it runs in the scheduled full job only.
schema_version: "1.0"
name: review-range-preflight-closer
provenance: "cb6313a fix(skills): narrow the preflight closer and tell a broken openspec from a missing one (session-start closer); bug at hooks/preflight.mjs:148 as of fea376c; agents/review-advisor.md; skills/review-code/SKILL.md"
exercises: ["agents/review-advisor.md", "skills/review-code/SKILL.md"]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    The OpenSpec change "preflight-closer" in this workspace has been code-reviewed.
    The diff under review changed hooks/preflight.mjs. The review dimensions' findings
    are in review/findings.json and the skeptics' verdicts in review/verdicts.json.
    Run the findings consult for it as the interlock review-code skill's step 4a
    is written.

    1. Resolve the review and write the consult's brief in one line:

         interlock review --findings review/findings.json --verdicts review/verdicts.json --changed hooks/preflight.mjs --advisor-brief preflight-closer --json

       Read `path` from the `advisorBrief` object in its output.
    2. Make one Agent tool call with subagent_type "interlock:review-advisor"
       whose prompt names that path and nothing else.
    3. Pipe the agent's reply, verbatim, to the check on standard input:

         interlock review-advisor "preflight-closer" --check - --json

       If the brief was not written, the spawn errored or no reply came back,
       run this instead:

         interlock review-advisor "preflight-closer" --check --failed "<reason>" --json

       When that line exits non-zero, report its first output line as the
       reason.
    4. Report the JSON the check printed: its `status`, the flag ids and kinds,
       and the `dropped` count.

    The consult is never retried. Do not change the review's verdict, and do
    not edit review-advisor.md by hand.
  max_turns: 20
  timeout_seconds: 1200
  allowed_tools: [Agent, Bash, Read, Glob, Grep]
