JetBrains Mono', ui-monospace, monospace;\">--host workflow<\u002Fcode> from the other side.<\u002Fp>\n<div style=\"overflow-x: auto; margin-bottom: 24px;\">\n<sc-raw-table class=\"table\" style=\"min-width: 900px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Host<\u002Fsc-raw-th><sc-raw-th>Drives<\u002Fsc-raw-th><sc-raw-th>Result schema<\u002Fsc-raw-th><sc-raw-th>Model selection<\u002Fsc-raw-th><sc-raw-th>Plugin hooks<\u002Fsc-raw-th><sc-raw-th>Token usage<\u002Fsc-raw-th><sc-raw-th>Cache accounting<\u002Fsc-raw-th><sc-raw-th>Billing path<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Workflow (default, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship<\u002Fcode>)<\u002Fsc-raw-td><sc-raw-td>the Claude Code Workflow runtime<\u002Fsc-raw-td><sc-raw-td>enforced<\u002Fsc-raw-td><sc-raw-td>the planner's tiers<\u002Fsc-raw-td><sc-raw-td>yes<\u002Fsc-raw-td><sc-raw-td>yes<\u002Fsc-raw-td><sc-raw-td><strong>no<\u002Fstrong>: one cumulative scalar<\u002Fsc-raw-td><sc-raw-td>Claude subscription, interactive<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">claude<\u002Fcode> (runner)<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">claude -p<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>enforced<\u002Fsc-raw-td><sc-raw-td>the planner's tiers<\u002Fsc-raw-td><sc-raw-td>yes<\u002Fsc-raw-td><sc-raw-td>yes<\u002Fsc-raw-td><sc-raw-td>yes<\u002Fsc-raw-td><sc-raw-td>Claude subscription, <strong>programmatic<\u002Fstrong> (metered)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">acp<\u002Fcode> (runner)<\u002Fsc-raw-td><sc-raw-td>your <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">INTERLOCK_ACP_COMMAND<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>recovered from text<\u002Fsc-raw-td><sc-raw-td>negotiated on session start<\u002Fsc-raw-td><sc-raw-td>only over the Claude binary<\u002Fsc-raw-td><sc-raw-td>no<\u002Fsc-raw-td><sc-raw-td>no<\u002Fsc-raw-td><sc-raw-td>whatever the agent is<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">codex<\u002Fcode> (runner)<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">codex exec<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>enforced<\u002Fsc-raw-td><sc-raw-td>mapped, or unrouted<\u002Fsc-raw-td><sc-raw-td><strong>no<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>yes<\u002Fsc-raw-td><sc-raw-td>no<\u002Fsc-raw-td><sc-raw-td>ChatGPT plan or API key<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">qwen<\u002Fcode> (runner)<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">qwen -p<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>enforced<\u002Fsc-raw-td><sc-raw-td>mapped, or unrouted<\u002Fsc-raw-td><sc-raw-td><strong>no<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>no<\u002Fsc-raw-td><sc-raw-td>no<\u002Fsc-raw-td><sc-raw-td>whatever you configured<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"max-width: 70ch; margin: 0 0 12px;\">Model routing on the runner comes from one published map, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">INTERLOCK_MODEL_MAP<\u002Fcode>, parsed once at startup and fatal on malformed input. An unmapped tier on Codex or Qwen gets no model flag at all and is named in a <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">MODEL ROUTING UNAVAILABLE<\u002Fcode> banner with its reason. A model is never guessed, because a wrong model that ran is invisible in a summary and a banner is not.<\u002Fp>\n<p style=\"max-width: 70ch; margin: 0;\">Every runner summary prints <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">RUNNER HOST: &lt;id&gt; (experimental)<\u002Fcode>. A run over the Claude binary prints <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">SUBSCRIPTION PATH: programmatic<\u002Fcode>, because <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">claude -p<\u002Fcode>, the Agent SDK and ACP are the usage Anthropic flagged for separate metered credit; the interactive Workflow runtime is the path that change exempted. That is why the default did not move.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 24px;\">Four hooks. One advisory, three deny. All fail open.<\u002Fh2>\n<div style=\"overflow-x: auto; margin-bottom: 24px;\">\n<sc-raw-table class=\"table\" style=\"min-width: 720px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Hook<\u002Fsc-raw-th><sc-raw-th>Event<\u002Fsc-raw-th><sc-raw-th>Denies<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">preflight.mjs<\u002Fsc-raw-td><sc-raw-td>session start<\u002Fsc-raw-td><sc-raw-td>Nothing. Runs <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock doctor<\u002Fcode> and surfaces failures with their fix strings. Every path exits 0.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">guard-tests.mjs<\u002Fsc-raw-td><sc-raw-td>before Edit or Write<\u002Fsc-raw-td><sc-raw-td>An edit to a test file while the stage is <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">remediation<\u002Fcode> or <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">fix-tests<\u002Fcode>. Test edits during <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">implement<\u002Fcode> are allowed: adding coverage for the feature you are building is the point, not a hazard.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">guard-tasks.mjs<\u002Fsc-raw-td><sc-raw-td>before Edit or Write<\u002Fsc-raw-td><sc-raw-td>An edit that changes the sequence of checkbox states in the active change's <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">tasks.md<\u002Fcode>, in any active stage. The tick is the CLI's job, keyed off recorded outcomes.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">guard-commit.mjs<\u002Fsc-raw-td><sc-raw-td>before Bash<\u002Fsc-raw-td><sc-raw-td>A <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">git commit<\u002Fcode> unless the stage is <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">commit<\u002Fcode>. It canonicalises <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">git -C<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">git -c<\u002Fcode>, environment prefixes, and command chains across <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">&amp;&amp;<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">;<\u002Fcode>, pipes and newlines.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"max-width: 70ch; margin: 0 0 16px;\">The guards read a stage marker at <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">.claude/ship/&lt;change&gt;/stage.json<\u002Fcode> carrying the stage, the change, a monotonic index and the writing process's pid. The agent performing each step publishes it; the run program clears it on every terminal path. There is exactly one definition of the marker, and a test fails if any driver declares a marker literal at all.<\u002Fp>\n<p style=\"max-width: 70ch; margin: 0 0 16px;\">When a guard cannot establish the stage, because the marker is absent, unreadable, malformed, stale, the process is gone, or the guard itself crashed, it allows. The asymmetry is argued rather than hidden: a lost marker during a real run silently disables the guard for that window; fail-closed would, on the same lost marker, brick every edit in the session. A guard that blocked test edits whenever it could not find a marker would break ordinary test-driven work the moment the plugin is installed.<\u002Fp>\n<p style=\"margin: 0; font-family: var(--font-heading); font-weight: 800; font-size: 20px; line-height: 1.3; max-width: 40ch;\">Installing Interlock does not change how your own editing or committing behaves.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 24px;\">Three corpora, recorded and never consulted.<\u002Fh2>\n<div style=\"overflow-x: auto; margin-bottom: 24px;\">\n<sc-raw-table class=\"table\" style=\"min-width: 760px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Corpus<\u002Fsc-raw-th><sc-raw-th>Path<\u002Fsc-raw-th><sc-raw-th>On a failed write<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Run trajectory<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;\">.claude/ship/runs/&lt;runId&gt;.jsonl — one line per wave action, CLI exit, agent spawn and verify judgement<\u002Fsc-raw-td><sc-raw-td>A run whose trajectory cannot be replayed exits 1, even beside <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP COMPLETE<\u002Fcode>. A run nobody can reconstruct defeats the reason the file exists.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Spill<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;\">.claude/ship/spill/&lt;runId&gt;/ — suite output over the spill threshold<\u002Fsc-raw-td><sc-raw-td>Fatal on an unwritable tree.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Outcome record<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;\">.claude/learning/outcomes.jsonl — one line per ship run<\u002Fsc-raw-td><sc-raw-td>Reported, never touches the exit code. Losing a corpus line must not fail the run that produced it.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Review metrics<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;\">.claude/metrics/review-&lt;change&gt;-&lt;stamp&gt;.json<\u002Fsc-raw-td><sc-raw-td>Reported as <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">REVIEW METRICS NOT WRITTEN<\u002Fcode>, never touches the exit code.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Receipt<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;\">a run-receipt event inside the trajectory<\u002Fsc-raw-td><sc-raw-td>Inherits the trajectory's semantics.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Decision ledger<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;\">openspec/changes/&lt;change&gt;/decisions.md<\u002Fsc-raw-td><sc-raw-td>Read-only. A missing ledger blocks readiness, because an absent file reads as “nothing needs a human”, which is the one conclusion a file that was never written cannot support.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"max-width: 70ch; margin: 0 0 16px;\">The difference is deliberate, and the repository's own review policy pre-classifies “make the two corpus-loss policies consistent” as a nit. Every corpus tolerates a torn final line: an append-only log truncated by a crash loses one record, not the read.<\u002Fp>\n<p style=\"max-width: 70ch; margin: 0;\">Nothing reads any of these to change what a run does. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock report<\u002Fcode> reads all three, always exits 0, applies no threshold, labels nothing pass or fail, and writes nothing, not even a cache. Its first run against this repository found three things nobody knew: the receipt path had never once fired, 727 of 729 trajectories were attributed to no change at all, and every metrics file had been written in a shape the reader did not expect. A corpus nobody can read is a corpus nobody notices is empty.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 20px;\">Two agent types, and only the drivers spawn them.<\u002Fh2>\n<p style=\"max-width: 70ch; margin: 0;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock:worker<\u002Fcode> may Read, Write, Edit, Grep, Glob and run Bash. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock:ping<\u002Fcode> may run Bash, Read and Write. Neither lists the Skill or Agent tools and both deny MCP servers. That is the spawn-prefix shrink: on a loaded operator machine a spawned agent otherwise inherits tens of thousands of tokens of tool schemas and skill descriptions per spawn, and a lean run pays that floor thirty times before any task prompt. Isolation of tasks is not isolation of prefix.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section role=\"tabpanel\" id=\"panel-run\" aria-labelledby=\"tab-run\" hidden=\"{{ hideRun }}\" data-screen-label=\"The run\" style=\"max-width: 1120px; margin: 0 auto; padding: 0 16px 72px;\">\n<div style=\"border-top: 2px solid var(--color-divider); padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 20px;\">The run, as a state machine.<\u002Fh2>\n<p style=\"max-width: 70ch; margin: 0 0 16px;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock run<\u002Fcode> emits the whole ship loop as versioned steps: the agents to spawn, the briefing each one carries, and the exact argv to call once they return. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">workflows/ship.js<\u002Fcode> on Claude Code and the experimental <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">bin/interlock-run<\u002Fcode> are interpreters of those steps. Each spawns what a step names, writes the results, calls what the step names next, and branches on nothing: not a flag, not a mode, not a count, not a verdict. Control flow written as prose is control flow the model can talk itself out of. Control flow written twice in two drivers is control flow that drifts.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2px; margin-bottom: 40px;\">\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Stage markers<\u002Fstrong>, six, written to <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">.claude/ship/&lt;change&gt;/stage.json<\u002Fcode> and read by the guard hooks: <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">implement, verify, review, remediation, fix-tests, commit<\u002Fspan>.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Run actions<\u002Fstrong>, the step records the program emits: <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">classify, run-batch, test-wave, verify, verify-final, replan, review, remediate, verdict, handoff, commit, close, done, halt, complete<\u002Fspan>.<\u002Fp>\n<\u002Fdiv>\n\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 12px;\">The shape, in eight nodes<\u002Fp>\n<div style=\"overflow-x: auto; border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider); padding: 24px 0; margin-bottom: 48px;\">\n<svg sc-camel-view-box=\"0 0 1080 240\" width=\"1080\" height=\"240\" role=\"img\" style=\"max-width: 100%; height: auto; min-width: 780px;\">\n<title>The ship loop in eight nodes: bootstrap, spec, the human checkpoint, waves, verify, commit, halt and merge request<\u002Ftitle>\n<defs>\n<marker id=\"ah\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"currentColor\"><\u002Fpath><\u002Fmarker>\n<\u002Fdefs>\n<g color=\"var(--color-text)\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#ah)\">\n<path d=\"M 140 60 L 176 60\"><\u002Fpath>\n<path d=\"M 316 60 L 352 60\"><\u002Fpath>\n<path d=\"M 552 60 L 588 60\"><\u002Fpath>\n<path d=\"M 728 60 L 764 60\"><\u002Fpath>\n<path d=\"M 826 90 L 826 140\"><\u002Fpath>\n<path d=\"M 764 160 L 728 160\"><\u002Fpath>\n<path d=\"M 904 60 L 940 60\"><\u002Fpath>\n<path d=\"M 648 90 L 648 200 L 400 200 L 400 90\"><\u002Fpath>\n<path d=\"M 470 90 L 470 140\"><\u002Fpath>\n<\u002Fg>\n<g font-family=\"'JetBrains Mono', ui-monospace, monospace\" font-size=\"12\">\n<rect x=\"20\" y=\"34\" width=\"120\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"32\" y=\"56\" fill=\"var(--color-text)\">bootstrap<\u002Ftext><text x=\"32\" y=\"73\" fill=\"var(--color-text)\" opacity=\"0.6\" font-size=\"10\">once per repo<\u002Ftext>\n<rect x=\"176\" y=\"34\" width=\"140\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"188\" y=\"56\" fill=\"var(--color-text)\">spec<\u002Ftext><text x=\"188\" y=\"73\" fill=\"var(--color-text)\" opacity=\"0.6\" font-size=\"10\">explore, write, review<\u002Ftext>\n<rect x=\"352\" y=\"34\" width=\"200\" height=\"52\" fill=\"var(--color-accent)\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Frect><text x=\"366\" y=\"56\" fill=\"#ffffff\" font-weight=\"700\">You read the spec<\u002Ftext><text x=\"366\" y=\"73\" fill=\"#ffffff\" opacity=\"0.85\" font-size=\"10\">~10 min · the only stop<\u002Ftext>\n<rect x=\"588\" y=\"34\" width=\"140\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"600\" y=\"56\" fill=\"var(--color-text)\">waves<\u002Ftext><text x=\"600\" y=\"73\" fill=\"var(--color-text)\" opacity=\"0.6\" font-size=\"10\">parallel implementers<\u002Ftext>\n<rect x=\"764\" y=\"34\" width=\"140\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"776\" y=\"56\" fill=\"var(--color-text)\">verify<\u002Ftext><text x=\"776\" y=\"73\" fill=\"var(--color-text)\" opacity=\"0.6\" font-size=\"10\">unit suite<\u002Ftext>\n<rect x=\"940\" y=\"34\" width=\"120\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"952\" y=\"56\" fill=\"var(--color-text)\">commit<\u002Ftext><text x=\"952\" y=\"73\" fill=\"var(--color-text)\" opacity=\"0.6\" font-size=\"10\">SHIP COMPLETE<\u002Ftext>\n<rect x=\"764\" y=\"140\" width=\"140\" height=\"52\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Frect><text x=\"776\" y=\"162\" fill=\"var(--color-accent)\">halt<\u002Ftext><text x=\"776\" y=\"179\" fill=\"var(--color-accent)\" opacity=\"0.85\" font-size=\"10\">nothing committed<\u002Ftext>\n<rect x=\"400\" y=\"140\" width=\"152\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"412\" y=\"162\" fill=\"var(--color-text)\">merge request<\u002Ftext><text x=\"412\" y=\"179\" fill=\"var(--color-text)\" opacity=\"0.6\" font-size=\"10\">then archive<\u002Ftext>\n<\u002Fg>\n<g font-family=\"'JetBrains Mono', ui-monospace, monospace\" font-size=\"9.5\" fill=\"var(--color-text)\" opacity=\"0.6\">\n<text x=\"608\" y=\"216\">next batch / next wave (parallel lanes, capped)<\u002Ftext>\n<text x=\"838\" y=\"118\">red suite, or a cap exhausted<\u002Ftext>\n<text x=\"700\" y=\"152\">fix the cause, then ship again<\u002Ftext>\n<\u002Fg>\n<\u002Fsvg>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 16px; border-bottom: 2px solid var(--color-divider);\">\n<button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ onStep }}\">Step<\u002Fbutton>\n<button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onPlay }}\">{{ playLabel }}<\u002Fbutton>\n<button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onReset }}\">Reset<\u002Fbutton>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: color-mix(in srgb, var(--color-text) 65%, transparent); margin-right: auto;\">{{ stepLabel }}<\u002Fspan>\n<label class=\"radio\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;\"><input type=\"checkbox\" data-flag=\"strict\" checked=\"{{ strict }}\" sc-camel-on-change=\"{{ toggleFlag }}\"><span class=\"dot\"><\u002Fspan>--strict<\u002Flabel>\n<label class=\"radio\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;\"><input type=\"checkbox\" data-flag=\"isolate\" checked=\"{{ isolate }}\" sc-camel-on-change=\"{{ toggleFlag }}\"><span class=\"dot\"><\u002Fspan>--isolate-waves<\u002Flabel>\n<label class=\"radio\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;\"><input type=\"checkbox\" data-flag=\"solo\" checked=\"{{ solo }}\" sc-camel-on-change=\"{{ toggleFlag }}\"><span class=\"dot\"><\u002Fspan>--solo<\u002Flabel>\n<\u002Fdiv>\n\n<div style=\"overflow-x: auto; border-bottom: 2px solid var(--color-divider); padding: 20px 0;\">\n<svg sc-camel-view-box=\"0 0 1680 600\" width=\"1680\" height=\"600\" role=\"img\" style=\"min-width: 1680px;\">\n<title>The full ship state machine, in seven lanes: pre-flight, plan, waves, verify, the strict-only tail, commit and close<\u002Ftitle>\n<g font-family=\"'JetBrains Mono', ui-monospace, monospace\" font-size=\"10.5\" fill=\"var(--color-accent)\" letter-spacing=\"1.6\">\n<text x=\"20\" y=\"14\">PRE-FLIGHT<\u002Ftext><text x=\"260\" y=\"14\">PLAN<\u002Ftext><text x=\"500\" y=\"14\">WAVES<\u002Ftext><text x=\"740\" y=\"14\">VERIFY<\u002Ftext><text x=\"980\" y=\"14\">TAIL — STRICT ONLY<\u002Ftext><text x=\"1220\" y=\"14\">COMMIT<\u002Ftext><text x=\"1460\" y=\"14\">CLOSE<\u002Ftext>\n<\u002Fg>\n<g color=\"var(--color-text)\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.75\" marker-end=\"url(#ah)\">\n<path d=\"M 120 142 L 120 170\"><\u002Fpath>\n<path d=\"M 220 196 L 240 196 L 240 116 L 260 116\"><\u002Fpath>\n<path d=\"M 360 142 L 360 170\"><\u002Fpath>\n<path d=\"M 460 196 L 480 196 L 480 116 L 500 116\"><\u002Fpath>\n<path d=\"M 600 142 L 600 170\"><\u002Fpath>\n<path d=\"M 700 196 L 716 196 L 716 72 L 600 72 L 600 90\"><\u002Fpath>\n<path d=\"M 560 62 L 560 90\"><\u002Fpath>\n<path d=\"M 700 210 L 728 210 L 728 116 L 740 116\"><\u002Fpath>\n<path d=\"M 840 142 L 840 170\"><\u002Fpath>\n<path d=\"M 750 222 L 750 240 L 470 240 L 470 116 L 500 116\"><\u002Fpath>\n<path d=\"M 840 222 L 840 250\"><\u002Fpath>\n<path d=\"M 952 276 L 968 276 L 968 420 L 1200 420 L 1200 116 L 1220 116\"><\u002Fpath>\n<path d=\"M 940 264 L 956 264 L 956 116 L 980 116\"><\u002Fpath>\n<path d=\"M 1080 142 L 1080 170\"><\u002Fpath>\n<path d=\"M 1080 222 L 1080 250\"><\u002Fpath>\n<path d=\"M 1080 302 L 1080 330\"><\u002Fpath>\n<path d=\"M 1180 356 L 1196 356 L 1196 130 L 1220 130\"><\u002Fpath>\n<path d=\"M 1320 142 L 1320 170\"><\u002Fpath>\n<path d=\"M 1320 222 L 1320 250\"><\u002Fpath>\n<path d=\"M 1320 302 L 1320 330\"><\u002Fpath>\n<path d=\"M 1420 196 L 1440 196 L 1440 316 L 1340 316 L 1340 330\"><\u002Fpath>\n<path d=\"M 1420 356 L 1460 356\"><\u002Fpath>\n<path d=\"M 1560 382 L 1560 410\"><\u002Fpath>\n<\u002Fg>\n<g color=\"var(--color-accent)\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" stroke-dasharray=\"5 4\" opacity=\"0.85\" marker-end=\"url(#ah)\">\n<path d=\"M 120 222 L 120 470\"><\u002Fpath>\n<path d=\"M 600 222 L 600 470\"><\u002Fpath>\n<path d=\"M 950 222 L 950 456 L 890 456 L 890 470\"><\u002Fpath>\n<path d=\"M 1080 382 L 1080 470\"><\u002Fpath>\n<path d=\"M 1430 196 L 1430 450 L 1340 450 L 1340 470\"><\u002Fpath>\n<\u002Fg>\n<g font-family=\"'JetBrains Mono', ui-monospace, monospace\" font-size=\"9\" fill=\"var(--color-text)\" opacity=\"0.55\">\n<text x=\"722\" y=\"66\">another batch / next wave<\u002Ftext><text x=\"480\" y=\"254\">green → next wave<\u002Ftext>\n<text x=\"974\" y=\"414\">lean ship (no --review)<\u002Ftext><text x=\"880\" y=\"108\">--review or --strict<\u002Ftext>\n<text x=\"1446\" y=\"192\">no tail flags<\u002Ftext><text x=\"504\" y=\"58\">replan, max 2 per run<\u002Ftext>\n<\u002Fg>\n<g font-family=\"'JetBrains Mono', ui-monospace, monospace\" font-size=\"12\">\n<g data-sm=\"ship_launch\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"20\" y=\"90\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"32\" y=\"112\" fill=\"var(--color-text)\">/interlock:ship<\u002Ftext><text x=\"32\" y=\"129\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">→ Workflow(), once<\u002Ftext><\u002Fg>\n<g data-sm=\"run_start\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"20\" y=\"170\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"32\" y=\"192\" fill=\"var(--color-text)\">run start<\u002Ftext><text x=\"32\" y=\"209\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">validate + plan reuse<\u002Ftext><\u002Fg>\n<g data-sm=\"classify\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"260\" y=\"90\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"272\" y=\"112\" fill=\"var(--color-text)\">classify<\u002Ftext><text x=\"272\" y=\"129\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">one planner agent<\u002Ftext><\u002Fg>\n<g data-sm=\"plan\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"260\" y=\"170\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"272\" y=\"192\" fill=\"var(--color-text)\">run classified<\u002Ftext><text x=\"272\" y=\"209\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">coverage → waves → plan.json<\u002Ftext><\u002Fg>\n<g data-sm=\"replan\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"500\" y=\"10\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"512\" y=\"32\" fill=\"var(--color-text)\">replan<\u002Ftext><text x=\"512\" y=\"49\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">haiku ping, max 2 per run<\u002Ftext><\u002Fg>\n<g data-sm=\"batch\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"500\" y=\"90\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"512\" y=\"112\" fill=\"var(--color-text)\">run-batch<\u002Ftext><text x=\"512\" y=\"129\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">up to 8 lanes in parallel<\u002Ftext><\u002Fg>\n<g data-sm=\"record_batch\" data-kind=\"decision\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"500\" y=\"170\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"><\u002Frect><text x=\"512\" y=\"192\" fill=\"var(--color-text)\">run record-batch<\u002Ftext><text x=\"512\" y=\"209\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">decision<\u002Ftext><\u002Fg>\n<g data-sm=\"interwave_verify\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"740\" y=\"90\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"752\" y=\"112\" fill=\"var(--color-text)\">verify<\u002Ftext><text x=\"752\" y=\"129\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">inter-wave, 2 fix attempts<\u002Ftext><\u002Fg>\n<g data-sm=\"judge_interwave\" data-kind=\"decision\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"740\" y=\"170\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"><\u002Frect><text x=\"752\" y=\"192\" fill=\"var(--color-text)\">judge --context<\u002Ftext><text x=\"752\" y=\"209\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">inter-wave<\u002Ftext><\u002Fg>\n<g data-sm=\"done\" data-kind=\"decision\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"740\" y=\"250\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"><\u002Frect><text x=\"752\" y=\"272\" fill=\"var(--color-text)\">done<\u002Ftext><text x=\"752\" y=\"289\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">no wave follows<\u002Ftext><\u002Fg>\n<g data-sm=\"review\" data-kind=\"stage\" data-strict-only=\"1\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"980\" y=\"90\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"992\" y=\"112\" fill=\"var(--color-text)\">review<\u002Ftext><text x=\"992\" y=\"129\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">dimensions + two skeptics<\u002Ftext><\u002Fg>\n<g data-sm=\"reviewed\" data-kind=\"decision\" data-strict-only=\"1\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"980\" y=\"170\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"><\u002Frect><text x=\"992\" y=\"192\" fill=\"var(--color-text)\">run reviewed<\u002Ftext><text x=\"992\" y=\"209\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">adjudicate<\u002Ftext><\u002Fg>\n<g data-sm=\"remediation\" data-kind=\"stage\" data-strict-only=\"1\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"980\" y=\"250\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"992\" y=\"272\" fill=\"var(--color-text)\">remediate<\u002Ftext><text x=\"992\" y=\"289\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">rounds 1..2<\u002Ftext><\u002Fg>\n<g data-sm=\"verdict_gate\" data-kind=\"decision\" data-strict-only=\"1\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"980\" y=\"330\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"><\u002Frect><text x=\"992\" y=\"352\" fill=\"var(--color-text)\">verdict round<\u002Ftext><text x=\"992\" y=\"369\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">fixes nothing<\u002Ftext><\u002Fg>\n<g data-sm=\"final_verify\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"1220\" y=\"90\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"1232\" y=\"112\" fill=\"var(--color-text)\">verify-final<\u002Ftext><text x=\"1232\" y=\"129\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">marker: fix-tests<\u002Ftext><\u002Fg>\n<g data-sm=\"judge_final\" data-kind=\"decision\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"1220\" y=\"170\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"><\u002Frect><text x=\"1232\" y=\"192\" fill=\"var(--color-text)\">judge --context<\u002Ftext><text x=\"1232\" y=\"209\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">final<\u002Ftext><\u002Fg>\n<g data-sm=\"handoff\" data-kind=\"stage\" data-strict-only=\"1\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"1220\" y=\"250\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"1232\" y=\"272\" fill=\"var(--color-text)\">handoff<\u002Ftext><text x=\"1232\" y=\"289\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">test plan, walkthrough<\u002Ftext><\u002Fg>\n<g data-sm=\"commit\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"1220\" y=\"330\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"1232\" y=\"352\" fill=\"var(--color-text)\">commit<\u002Ftext><text x=\"1232\" y=\"369\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">one feature-level commit<\u002Ftext><\u002Fg>\n<g data-sm=\"close\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"1460\" y=\"330\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"1472\" y=\"352\" fill=\"var(--color-text)\">run close<\u002Ftext><text x=\"1472\" y=\"369\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">receipt, outcome, trajectory<\u002Ftext><\u002Fg>\n<g data-sm=\"mr\" data-kind=\"stage\" sc-camel-on-click=\"{{ pickState }}\" style=\"cursor: pointer;\"><rect x=\"1460\" y=\"410\" width=\"200\" height=\"52\" fill=\"var(--color-surface)\" stroke=\"var(--color-divider)\" stroke-width=\"1.5\"><\u002Frect><text x=\"1472\" y=\"432\" fill=\"var(--color-text)\">/interlock:mr<\u002Ftext><text x=\"1472\" y=\"449\" font-size=\"10\" opacity=\"0.65\" fill=\"var(--color-text)\">human<\u002Ftext><\u002Fg>\n<g data-sm=\"trampoline_halt\" data-kind=\"halt\"><rect x=\"20\" y=\"470\" width=\"200\" height=\"44\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Frect><text x=\"32\" y=\"497\" fill=\"var(--color-accent)\" font-size=\"11\">HALT no Workflow tool<\u002Ftext><\u002Fg>\n<g data-sm=\"preflight_halt\" data-kind=\"halt\"><rect x=\"20\" y=\"524\" width=\"200\" height=\"44\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Frect><text x=\"32\" y=\"551\" fill=\"var(--color-accent)\" font-size=\"11\">HALT validate / coverage<\u002Ftext><\u002Fg>\n<g data-sm=\"failure_halt\" data-kind=\"halt\"><rect x=\"500\" y=\"470\" width=\"200\" height=\"44\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Frect><text x=\"512\" y=\"497\" fill=\"var(--color-accent)\" font-size=\"11\">HALT &gt; 2 task failures<\u002Ftext><\u002Fg>\n<g data-sm=\"merge_halt\" data-kind=\"halt\" data-isolate-only=\"1\"><rect x=\"500\" y=\"524\" width=\"200\" height=\"44\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Frect><text x=\"512\" y=\"551\" fill=\"var(--color-accent)\" font-size=\"11\">HALT merge-lanes collision<\u002Ftext><\u002Fg>\n<g data-sm=\"interwave_halt\" data-kind=\"halt\"><rect x=\"740\" y=\"470\" width=\"200\" height=\"44\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Frect><text x=\"752\" y=\"497\" fill=\"var(--color-accent)\" font-size=\"11\">HALT inter-wave still red<\u002Ftext><\u002Fg>\n<g data-sm=\"blocker_halt\" data-kind=\"halt\" data-strict-only=\"1\"><rect x=\"980\" y=\"470\" width=\"200\" height=\"44\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Frect><text x=\"992\" y=\"497\" fill=\"var(--color-accent)\" font-size=\"11\">HALT unresolved blockers<\u002Ftext><\u002Fg>\n<g data-sm=\"unit_halt\" data-kind=\"halt\"><rect x=\"1220\" y=\"470\" width=\"200\" height=\"44\" fill=\"none\" stroke=\"var(--color-accent)\" stroke-width=\"2\"><\u002Frect><text x=\"1232\" y=\"497\" fill=\"var(--color-accent)\" font-size=\"11\">HALT unit red / weakened<\u002Ftext><\u002Fg>\n<\u002Fg>\n<text x=\"1460\" y=\"497\" font-family=\"'JetBrains Mono', ui-monospace, monospace\" font-size=\"10\" fill=\"var(--color-text)\" opacity=\"0.6\">every halt → close: receipt,<\u002Ftext>\n<text x=\"1460\" y=\"511\" font-family=\"'JetBrains Mono', ui-monospace, monospace\" font-size=\"10\" fill=\"var(--color-text)\" opacity=\"0.6\">outcome record, trajectory, exit 1<\u002Ftext>\n<\u002Fsvg>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2px; margin-top: 2px;\">\n<div style=\"background: var(--color-surface); padding: 18px; min-height: 320px;\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 14px;\">Terminal<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 14px;\">\n<sc-for list=\"{{ printed }}\" as=\"b\" hint-placeholder-count=\"2\">\n<pre style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;\">{{ b.text }}<\u002Fpre>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p hidden=\"{{ hideStepHint }}\" style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">Press Step or Play. The change is add-report-json-flag: seven tasks across two numbered sections plus paired test tasks. Two tasks in section 1 both name lib/report.mjs.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 18px;\">\n<div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px;\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0; margin-right: auto;\">Halts<\u002Fp>\n<sc-raw-select class=\"input\" sc-camel-on-change=\"{{ filterHalts }}\" aria-label=\"Filter halts by stage\" style=\"width: auto; font-size: 13px;\">\n<option value=\"\">All stages<\u002Foption>\n<option value=\"run start\">run start<\u002Foption>\n<option value=\"pre-run\">pre-run<\u002Foption>\n<option value=\"run classified\">run classified<\u002Foption>\n<option value=\"record-batch\">record-batch<\u002Foption>\n<option value=\"judge\">judge<\u002Foption>\n<option value=\"verdict\">verdict<\u002Foption>\n<option value=\"close\">close<\u002Foption>\n<option value=\"spec\">spec<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px; max-height: 420px; overflow-y: auto;\">\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"run start\" data-node=\"preflight_halt\" data-banner=\"SHIP HALTED — validate failed: &lt;problems&gt;\n→ interlock validate &lt;change&gt;; usually the change was never fully specced.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — validate failed<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"pre-run\" data-node=\"trampoline_halt\" data-banner=\"SHIP HALTED — subagents unavailable\n→ Allow the Agent tool. Do not ask the model to implement in the main conversation.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — subagents unavailable<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"pre-run\" data-node=\"trampoline_halt\" data-banner=\"Trampoline halt — the Workflow tool is unavailable.\n→ Enable dynamic workflows. Everything else still works. It does not fall back to chat and does not start the experimental runner.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">Trampoline halt — Workflow tool unavailable<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"run classified\" data-node=\"preflight_halt\" data-banner=\"SHIP HALTED — plan omitted unchecked tasks: &lt;ids&gt;\n→ Re-run; if it recurs the checkbox wording is the problem.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — plan omitted unchecked tasks<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"run classified\" data-node=\"preflight_halt\" data-banner=\"SHIP HALTED — waves failed: &lt;message&gt;\n→ Fix the dangling, backward or cyclic dependsOn edge in tasks.md.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — waves failed<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"record-batch\" data-node=\"failure_halt\" data-banner=\"SHIP HALTED — &lt;n&gt; task failures accumulated across waves; more than 2 halts the run\n→ Repeated failures in one area mean tasks.md was underspecified there. Re-spec that slice.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — task failures over the cap<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"record-batch\" data-node=\"merge_halt\" data-banner=\"SHIP HALTED — merge-lanes halted on wave &lt;n&gt;: real collision on &lt;paths&gt;\n→ Resolve the writes by hand from the named worktrees. Merge-lanes never applies a guess.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — merge-lanes collision (isolate)<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"judge\" data-node=\"interwave_halt\" data-banner=\"SHIP HALTED — inter-wave checks after wave 2 still failing after 2 fix attempts, and the caller reported the errors block the test wave\n  leftover tasks (boxes still unchecked): 3.1, 3.2\n  PLAN REBUILT (no-plan): no stored plan at .claude/ship/plan.json\n  wave 1 (run-batch): 3 ok, 0 failed\n  wave 2 (run-batch): 2 ok, 0 failed\n  run: 7f2c1b8e-3d4a-4c11-9e02-5b6a7c8d9e01\n  project: -Users-you-src-yourrepo\n  cwd: /Users/you/src/yourrepo\nDo not start another ship run unless the user asks.\n\nLEAN SHIP: skipped review, handoff, conformance — pass --review / --handoff / --strict to enable\nGOAL MET: interlock ship returned a terminal summary.\n\nExit 1. No commit. No question. Leftover tasks are a report, not authorisation to relaunch.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — inter-wave checks still red<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"judge\" data-node=\"unit_halt\" data-banner=\"SHIP HALTED — verification reported no result for &lt;kinds&gt;\n→ An unverified step is not a passing one, and an unverified run does not commit.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — verification reported no result<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"judge\" data-node=\"unit_halt\" data-banner=\"SHIP HALTED — unit suite is red (&lt;n&gt; failing, &lt;k&gt; root-cause cluster(s)) · unit suite was weakened (&lt;signal&gt;) · unit suite did not run\n→ Fix it, or /interlock:fix-tests. Ship will not weaken a test, loosen an assertion, or narrow the suite to get green.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — unit suite red / weakened<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"verdict\" data-node=\"blocker_halt\" data-banner=\"SHIP HALTED — &lt;n&gt; unresolved blocker(s) after 2 remediation round(s)\n→ Two failed rounds usually means the design was wrong, not the code. Re-spec rather than a third round.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — unresolved blockers (strict)<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"close\" data-node=\"close\" data-banner=\"SHIP HALTED — the run exceeded the published run-step cap without reaching a terminal state\n→ Read the trajectory.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — run-step cap exceeded<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"close\" data-node=\"close\" data-banner=\"SHIP HALTED — out of sequence: the run program's last step named interlock &lt;x&gt; and this call was interlock &lt;y&gt;\n→ A driver bug.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — out of sequence<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"pre-run\" data-node=\"trampoline_halt\" data-banner=\"SHIP HALTED — contradictory plan-shape flags: --solo and --waves were both passed\n→ Pass one. Halting here costs one invocation; guessing costs a whole run of the wrong shape.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">SHIP HALTED — contradictory plan-shape flags<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"close\" data-node=\"close\" data-banner=\"RUN NOT RECONSTRUCTABLE: &lt;problems&gt;   (exit 1 even beside SHIP COMPLETE)\n→ interlock run-log check. Usually a write to .claude/ship/ failed mid-run. interlock doctor probes exactly that.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">RUN NOT RECONSTRUCTABLE<\u002Fbutton>\n<button type=\"button\" data-halt-row=\"1\" data-stage=\"spec\" data-node=\"preflight_halt\" data-banner=\"spec: blockers at the artifact review\n→ Fix the cause, not the report. No silent fix-and-continue.\" sc-camel-on-click=\"{{ pickHalt }}\" style=\"text-align: left; background: var(--color-bg); border: 0; border-left: 3px solid var(--color-accent); padding: 10px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec — blockers at the artifact review<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin: 14px 0 0; font-size: 13px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">On any halt: nothing is committed, and it will not ask you a question. Every one is a non-zero exit from a CLI subcommand rather than a judgement call.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<p style=\"margin: 24px 0 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 68%, transparent); max-width: 80ch;\">Receipt lines that are not degradations: <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">LEAN SHIP<\u002Fspan> · <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">ARCHIVE PENDING<\u002Fspan> · <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">PLAN REUSED<\u002Fspan> / <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">PLAN REBUILT<\u002Fspan> · leftover tasks (boxes still unchecked) · <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">run:<\u002Fspan> / <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">project:<\u002Fspan> / <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">cwd:<\u002Fspan> · “No degradation banners — graph, test profile, model routing, verification and e2e were all clean.”<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 24px;\">What each state does.<\u002Fh2>\n<div style=\"overflow-x: auto;\">\n<sc-raw-table class=\"table\" style=\"min-width: 900px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 130px;\">State<\u002Fsc-raw-th><sc-raw-th>Agents spawned<\u002Fsc-raw-th><sc-raw-th style=\"width: 190px;\">Then<\u002Fsc-raw-th><sc-raw-th>Branch<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr data-state-row=\"run_start\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">run start<\u002Fsc-raw-td><sc-raw-td>none<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">validates the change; asks whether the stored plan still matches its inputs<\u002Fsc-raw-td><sc-raw-td>validate red → halt. Plan matches and all tasks ticked → close with <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">NO REMAINING WORK<\u002Fcode>. Plan matches with work left → narrow it, skip the classifier. Anything else → classify. The summary always says <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">PLAN REUSED<\u002Fcode> or <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">PLAN REBUILT<\u002Fcode>.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"classify\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">classify<\u002Fsc-raw-td><sc-raw-td>one planner (session model). Reads proposal, design, tasks and specs in full: the artifact leash. Classifies every unchecked task with a tier 1–5, a model, predicted paths and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">dependsOn<\u002Fcode>, and recommends solo or waves. Is told not to run the CLI itself.<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">interlock run classified<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"plan\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">run classified<\u002Fsc-raw-td><sc-raw-td>none<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">coverage check → planWaves → plan.json and its fingerprint → state.json<\u002Fsc-raw-td><sc-raw-td>a checkbox omitted → halt naming the ids. A dangling edge, a backward edge or a cycle → halt naming it. Otherwise the plan preview is written before a single implementer spawns.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"batch\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">run-batch / test-wave<\u002Fsc-raw-td><sc-raw-td>one implementer per lane, up to 8 in parallel. Model and effort follow the lane's hardest task. Each reads only what its tier needs, receives the previous wave's handoff packets, and must return its briefing's sha256 or the task fails closed.<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">interlock run record-batch<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"record_batch\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">run record-batch<\u002Fsc-raw-td><sc-raw-td>none<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">records outcomes against the run's own git status, not the agent's claim; folds worktrees under --isolate-waves; ticks the recorded-ok tasks<\u002Fsc-raw-td><sc-raw-td>another batch → next batch. Wave done and another follows → inter-wave verify unless skipped (docs-only wave, red wave, or the per-run cap). No wave follows → done. Failures over the cap → halt. A real collision → halt naming the path and both lanes.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"interwave_verify\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">verify (inter-wave)<\u002Fsc-raw-td><sc-raw-td>one verify agent, or none when the plan has no steps. Runs the commands the test profile names, verbatim, and reports exit codes and counts. It is never asked whether the run may continue.<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">interlock run judge --context inter-wave<\u002Fsc-raw-td><sc-raw-td>green → next wave. Red → a retry briefed as a repair, up to 2 attempts per wave. Budget spent and blocking → halt. Budget spent and not blocking → warn, advance, and print <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">UNRESOLVED ERRORS CARRIED PAST A WAVE<\u002Fcode> at close.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"replan\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">replan<\u002Fsc-raw-td><sc-raw-td>one haiku ping<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">interlock run replan<\u002Fsc-raw-td><sc-raw-td>a declined or empty revision → carry on. A revision that touches an already-executed group → halt. Two per run.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"review\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">review (strict)<\u002Fsc-raw-td><sc-raw-td>one review worker at <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">xhigh<\u002Fcode> effort. Inside its own context it fans out one reviewer per dimension, then two skeptics per finding. The CLI selects the dimensions from the observed changed paths and inlines each rubric and the repo's REVIEW.md into the briefing.<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">interlock run reviewed<\u002Fsc-raw-td><sc-raw-td>nothing survived → straight to final verify, no round spent. Otherwise → remediation round 1.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"remediation\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">remediate (strict)<\u002Fsc-raw-td><sc-raw-td>one fixer worker per round at <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">xhigh<\u002Fcode>; its plan is one fixer per file group, unscoped findings last, re-reviewing only the dimensions that raised something<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">interlock run remediated --round n<\u002Fsc-raw-td><sc-raw-td>every blocker cleared → jump to the verdict. Otherwise the next round, up to 2.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"verdict_gate\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">verdict (strict)<\u002Fsc-raw-td><sc-raw-td>one worker that fixes nothing and re-reviews nothing<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>blockers remain → halt, and no commit step is ever emitted. Clean → final verify.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"final_verify\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">verify-final<\u002Fsc-raw-td><sc-raw-td>one verify agent. The marker is <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">fix-tests<\u002Fcode> because the final step repairs a red suite by root cause, and that repair is exactly when weakening a test is the hazard, so the guard is in deny for test files.<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">interlock run judge --context final<\u002Fsc-raw-td><sc-raw-td>unit red, weakened, or unrun → halt. Typecheck red → <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">TYPECHECK FAILED (non-blocking at the final gate)<\u002Fcode>. E2E red → <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">E2E FAILED (non-blocking by policy)<\u002Fcode> and the commit happens anyway. Green → handoff or commit.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"handoff\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">handoff (strict)<\u002Fsc-raw-td><sc-raw-td>one handoff worker. The CLI decides whether the diff needs a manual test plan and builds the conformance checklist; the agent writes <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">manual-test-plan.md<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">code-explanation.md<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">conformance.md<\u002Fcode> and memory entries.<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">interlock run commit<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"commit\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">commit<\u002Fsc-raw-td><sc-raw-td>one commit agent. One feature-level commit, a verb-phrase message from the artifacts, only the files this run touched. Never <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">git add -A<\u002Fcode>, never amend, never push. A hook denies <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">git commit<\u002Fcode> in any other stage.<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">interlock run close<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--no-commit<\u002Fcode> skips the agent and records it.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-state-row=\"close\"><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">run close<\u002Fsc-raw-td><sc-raw-td>none<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">reads the host's token counter, the leftover task ids, builds the receipt, clears the stage marker, appends the outcome record, writes the terminal trajectory event, checks the trajectory can be replayed, pushes a notification if configured, runs the archive check<\u002Fsc-raw-td><sc-raw-td>exit 0 on completion. Exit 1 on any halt, and on a clean run whose trajectory cannot be reconstructed.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 20px;\">Waves, lanes and batches.<\u002Fh2>\n<p style=\"max-width: 70ch; margin: 0 0 24px;\">The plan is a pure function of <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">classified.json<\u002Fcode> plus three options: the parallel cap, the mode, and the red wave. No filesystem, no clock, no randomness, so the same input produces the same plan every run.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2px;\">\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Validation fails closed.<\u002Fstrong> A <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">dependsOn<\u002Fcode> that names no task, points at a later section, or forms a cycle is a halt naming the ids. Dropping an unresolved reference would produce a plan that looks successful and runs in the wrong order.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>The model clamp.<\u002Fstrong> Only tier 5 may be opus. Classifiers reliably over-assign opus to anything touching several files, so the planner clamps after classification and prints every clamp: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">clamped 1.4: opus → sonnet (tier 3)<\u002Fcode>.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Mode.<\u002Fstrong> A <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--solo<\u002Fcode> or <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--waves<\u002Fcode> flag wins. Otherwise the classifier's recommendation is honoured inside the published solo envelope; above it, refused and named. Otherwise waves. The planner prompt is forbidden from naming the envelope, because a model that can read the bound can argue with it.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Sections are waves.<\u002Fstrong> Tasks numbered <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">1.x<\u002Fcode> share a wave, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">2.x<\u002Fcode> the next. A shared file is not a reason for a new section; name the path and let the planner fold. A cross-file dependency is a <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">dependsOn<\u002Fcode> edge, not a new section; an edge orders one task, a new section serialises every task in it.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Edges become layers.<\u002Fstrong> Each section is split by dependency depth, and each layer is a wave. With no edges every task is depth zero and the plan is what it always was.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Hardest first.<\u002Fstrong> Inside a layer, descending tier, so the tier-5 task whose failure means the design was wrong is discovered in the first batch rather than the third.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Collision on canonical paths.<\u002Fstrong> Two tasks that claim a common canonical path, directly or transitively, join one lane run in order by one agent. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">src/a.ts<\u002Fcode> and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">./src/a.ts<\u002Fcode> are one file. A path that is absolute or escapes the repo root joins nothing and is reported, never rewritten into scope.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Cohesion packing.<\u002Fstrong> Path-disjoint components at tier 3 or below pack into a shared lane, bounded by the lane's per-tier cap. Seven tasks each writing one <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">case.yaml<\u002Fcode> used to be seven spawns that then had to be told, by an eighth task, what convention to agree on.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Batches.<\u002Fstrong> Lanes fill a batch while no path is double-claimed and the batch is under the parallel cap. A lane pushed out because the batch was full waits for a later batch; it is never folded into another lane's agent.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Singleton waves fold.<\u002Fstrong> A wave holding one implementation task buys a checkpoint to express one thing: that its task runs after the previous wave. A later batch expresses the same ordering and costs nothing, so it folds, and the fold is printed. Never folded: a leading singleton, two real waves, the trailing test wave, or work onto the red wave.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Test tasks trail.<\u002Fstrong> Every test task outside the red wave defers to a single trailing wave, so a cross-cutting test failure is diagnosed once against the finished implementation.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>The red wave under TDD.<\u002Fstrong> When <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">tasks.md<\u002Fcode> opens with the heading <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">## 1. Failing tests first<\u002Fcode>, that section runs first as an ordinary implementation wave and its inter-wave check is skipped without consuming a verification slot. The planner refuses the claim, with a warning and never a halt, when the section holds no test task or is not the first section.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>The bill is in lanes, not tasks.<\u002Fstrong> Projected agents = lanes + one record ping per wave + inter-wave verifications. Four tasks in one lane cost one spawn prefix, not four.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 20px;\">Soft continues: the degradation banners.<\u002Fh2>\n<p style=\"max-width: 70ch; margin: 0 0 24px;\">A <strong>loud halt<\u002Fstrong> stops the run, commits nothing, and reports what completed and what you need to decide. A <strong>soft continue<\u002Fstrong> keeps going with a documented default and prints a banner saying what it degraded. Almost everything is a soft continue.<\u002Fp>\n<div style=\"overflow-x: auto;\">\n<sc-raw-table class=\"table\" style=\"min-width: 760px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 320px;\">Banner<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">GRAPH UNAVAILABLE: &lt;reason&gt;<\u002Fsc-raw-td><sc-raw-td>Agents fall back to grep: correct, slower, more tokens. Expected on Go, Rust, Java and Ruby repos. Nothing in the loop requires the graph.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">NO TEST PROFILE<\u002Fsc-raw-td><sc-raw-td>Ship worked without discoverable commands. There is no branch where a command gets guessed. Run <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:fix-tests --reconfigure<\u002Fcode> once.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">MODEL ROUTING OVERRIDDEN<\u002Fsc-raw-td><sc-raw-td>Every agent runs on <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">CLAUDE_CODE_SUBAGENT_MODEL<\u002Fcode>; the tier ladder is not in effect. A cost degradation, not a quality one.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">VERIFICATION SKIPPED: reason=&lt;r&gt;<\u002Fsc-raw-td><sc-raw-td>The fast between-waves loop was missing. The final unit suite was not skipped; that one halts when red. The reason strings are a contract: added to, never reworded.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">VERIFY CAP EXHAUSTED<\u002Fsc-raw-td><sc-raw-td>Inter-wave checkpoints beyond the per-run cap were skipped.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">UNRESOLVED ERRORS CARRIED PAST A WAVE<\u002Fsc-raw-td><sc-raw-td>The fix budget was spent and the run continued because the errors were reported as not blocking. Look at them.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">E2E FAILED (non-blocking by policy)<\u002Fsc-raw-td><sc-raw-td>The commit is not a statement that e2e passed. E2E is run and never repaired, because auto-fixing e2e is how a real regression gets papered over. You have to look at this one.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">TYPECHECK FAILED (non-blocking at the final gate)<\u002Fsc-raw-td><sc-raw-td>Halting between waves, reported at the end, because the published halt list does not include it and it must not become a fourth halt silently.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">LANE STOPPED EARLY: &lt;ids&gt;<\u002Fsc-raw-td><sc-raw-td>Tasks behind a failed sibling in the same lane are not counted as failures and stay unchecked.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">LANE WORKTREE PRESERVED<\u002Fsc-raw-td><sc-raw-td>A failed lane's writes were not folded. Inspect the worktree.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">BRIEFING NOT ACKNOWLEDGED: &lt;label&gt;<\u002Fsc-raw-td><sc-raw-td>The agent did not return its briefing's hash; the task fails closed. An agent that did not read its instructions did not do this task.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">CLAIM OVERRIDDEN: &lt;ids&gt;<\u002Fsc-raw-td><sc-raw-td>The implementing agent reported one thing and the run acted on what it recorded.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">CLAIM-DERIVED TALLIES<\u002Fsc-raw-td><sc-raw-td>No usable recorded outcomes, so the wave was counted from claims. The weaker source, said out loud.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">TASK TICK FAILED<\u002Fsc-raw-td><sc-raw-td>The work was done, the checkbox was not. Not a reason to re-ship.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">STAGE MARKER NOT PUBLISHED / NOT CLEARED<\u002Fsc-raw-td><sc-raw-td>A window in which a guard was not in force, or a marker left armed for the session. Never an exit code.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">REVIEW RUBRIC UNAVAILABLE: &lt;dimension&gt;<\u002Fsc-raw-td><sc-raw-td>That reviewer still ran, from the name alone.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">REVIEW METRICS NOT WRITTEN<\u002Fsc-raw-td><sc-raw-td>Bookkeeping only; the indicators will read unobserved.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">PLAN FINGERPRINT NOT STORED<\u002Fsc-raw-td><sc-raw-td>The next run pays a classifier pass. Said out loud rather than discovered as a slow run.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">TDD SHAPE REFUSED / INFERRED / UNAVAILABLE<\u002Fsc-raw-td><sc-raw-td>A shape the operator asked for and did not get is a banner, not a line in a plan file.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">TOKEN USAGE NOT REPORTED<\u002Fsc-raw-td><sc-raw-td>Recorded as unknown, never zero. A wave that ran agents did not spend nothing.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">CACHE ACCOUNTING NOT REPORTED<\u002Fsc-raw-td><sc-raw-td>The host exposes no cache decomposition. The Workflow runtime is such a host. Recorded as unknown rather than a measured zero.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">PUSH FAILED: &lt;reason&gt;<\u002Fsc-raw-td><sc-raw-td>The notification did not go out. Never echoes the topic. Never moves the exit code.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">RUNNER HOST · SUBSCRIPTION PATH · CHATGPT PLAN PATH · HOOKS NOT IN FORCE · MODEL ROUTING UNAVAILABLE<\u002Fsc-raw-td><sc-raw-td>Runner only. The billing path, the missing guards, and unrouted spawns, each named. A model is never guessed, because a wrong model that ran is invisible in a summary and a banner is not.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"margin: 20px 0 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 68%, transparent); max-width: 80ch;\">Three conditions that are not halts at all: the preflight (<code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock doctor<\u002Fcode>, advisory, also a session-start hook); the mid-run permission prompt (the one interruption the runtime cannot prevent, since it is your setting being honoured); and Claude Code's <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">Large workflow<\u002Fcode> warning (advisory; a strict run crosses it easily, lean ship usually stays under).<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section role=\"tabpanel\" id=\"panel-first-hour\" aria-labelledby=\"tab-first-hour\" hidden=\"{{ hideFirst }}\" data-screen-label=\"First hour\" style=\"max-width: 1120px; margin: 0 auto; padding: 0 16px 72px;\">\n<div style=\"border-top: 2px solid var(--color-divider); padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 36px;\">Install to first shipped change, in one hour.<\u002Fh2>\n\n<div style=\"display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 20px 24px; padding: 24px 0; border-top: 1px solid var(--color-divider);\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; color: var(--color-accent); margin: 0;\">min 0–2<\u002Fp>\n<div>\n<label class=\"radio\" style=\"align-items: flex-start; margin-bottom: 12px;\"><input type=\"checkbox\" data-check=\"s1\" sc-camel-on-change=\"{{ onCheck }}\"><span class=\"dot\" style=\"margin-top: 4px;\"><\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.2;\">Install<\u002Fspan><\u002Flabel>\n<div data-copy=\"t1\" style=\"background: var(--color-surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;\">\n<button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ copy }}\" style=\"align-self: flex-start; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em;\">COPY<\u002Fbutton>\n<pre style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.
