  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // artifact, so window.top can be a FOREIGN document — a top-addressed

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;

        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

          return;

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

              const { done, value } = await reader.read();

              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  id=\"tab-first-hour\" data-tab=\"first-hour\" aria-selected=\"{{ selFirst }}\" aria-controls=\"panel-first-hour\" sc-camel-on-click=\"{{ selectTab }}\" style=\"background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; color: var(--color-text);\">First hour<\u002Fbutton>\n<button type=\"button\" role=\"tab\" id=\"tab-deep-dive\" data-tab=\"deep-dive\" aria-selected=\"{{ selDeep }}\" aria-controls=\"panel-deep-dive\" sc-camel-on-click=\"{{ selectTab }}\" style=\"background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; color: var(--color-text);\">Deep dive<\u002Fbutton>\n<button type=\"button\" role=\"tab\" id=\"tab-compare\" data-tab=\"compare\" aria-selected=\"{{ selCompare }}\" aria-controls=\"panel-compare\" sc-camel-on-click=\"{{ selectTab }}\" style=\"background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; color: var(--color-text);\">Compare<\u002Fbutton>\n<\u002Fnav>\n<button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goInstall }}\" style=\"flex: none;\">Install<\u002Fbutton>\n<a class=\"btn btn-secondary\" href=\"https://github.com/renzrollon/interlock\" style=\"flex: none;\">GitHub<\u002Fa>\n<button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Toggle light and dark theme\" style=\"flex: none; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px;\">{{ themeLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section data-screen-label=\"Hero\" style=\"max-width: 1120px; margin: 0 auto; padding: 56px 16px 0;\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 24px;\">Autonomous spec-driven development for Claude Code · layered on OpenSpec · v1.0.0<\u002Fp>\n<h1 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(42px, 7.5vw, 92px); line-height: 0.95; letter-spacing: -0.03em; margin: 0 0 28px; max-width: 16ch;\">Two commands. One human checkpoint.<\u002Fh1>\n<p style=\"max-width: 66ch; font-size: 19px; margin: 0 0 12px; text-wrap: pretty;\">Spec a change, read it, then ship it start-to-commit with parallel agents. Every cap the run obeys is a CLI you can run yourself, with no model and no network. Zero-touch is a property of the runtime, not a promise in a prompt.<\u002Fp>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: color-mix(in srgb, var(--color-text) 62%, transparent); margin: 0 0 48px; max-width: 70ch;\">Every change is spec, then ship. Bootstrap runs once per repo; mr when you want the merge request.<\u002Fp>\n\n<div style=\"display: grid; grid-template-columns: 1fr 1.5fr; gap: 8px 24px; margin-bottom: 12px;\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0;\">Run once, after you clone<\u002Fp>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0;\">Then, every change<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 2px; border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider); padding: 2px 0;\">\n<button type=\"button\" data-flow=\"bootstrap\" sc-camel-on-mouse-enter=\"{{ tipOn }}\" sc-camel-on-mouse-leave=\"{{ tipOff }}\" sc-camel-on-focus=\"{{ tipOn }}\" sc-camel-on-blur=\"{{ tipOff }}\" style=\"flex: 1 1 150px; text-align: left; background: var(--color-surface); border: 0; padding: 20px 16px; font: inherit; cursor: default; color: var(--color-text);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; font-weight: 700;\">bootstrap<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" data-flow=\"spec\" sc-camel-on-mouse-enter=\"{{ tipOn }}\" sc-camel-on-mouse-leave=\"{{ tipOff }}\" sc-camel-on-focus=\"{{ tipOn }}\" sc-camel-on-blur=\"{{ tipOff }}\" sc-camel-on-click=\"{{ flowClick }}\" style=\"flex: 1 1 150px; text-align: left; background: var(--color-surface); border: 0; padding: 20px 16px; font: inherit; cursor: pointer; color: var(--color-text); display: flex; flex-direction: column; gap: 10px; align-items: flex-start;\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; font-weight: 700;\">spec<\u002Fspan>\n<span class=\"tag tag-neutral\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.12em;\">SKILL<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" data-flow=\"checkpoint\" sc-camel-on-mouse-enter=\"{{ tipOn }}\" sc-camel-on-mouse-leave=\"{{ tipOff }}\" sc-camel-on-focus=\"{{ tipOn }}\" sc-camel-on-blur=\"{{ tipOff }}\" sc-camel-on-click=\"{{ flowClick }}\" style=\"flex: 1.5 1 230px; text-align: left; background: var(--color-accent); border: 0; padding: 20px 16px; font: inherit; cursor: pointer; color: #ffffff; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.85;\">The only stop<\u002Fspan>\n<span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px; line-height: 1.1;\">You read the spec.<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85;\">↺ Revise idea → re-spec<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" data-flow=\"ship\" sc-camel-on-mouse-enter=\"{{ tipOn }}\" sc-camel-on-mouse-leave=\"{{ tipOff }}\" sc-camel-on-focus=\"{{ tipOn }}\" sc-camel-on-blur=\"{{ tipOff }}\" sc-camel-on-click=\"{{ flowClick }}\" style=\"flex: 1 1 150px; text-align: left; background: var(--color-surface); border: 0; padding: 20px 16px; font: inherit; cursor: pointer; color: var(--color-text); display: flex; flex-direction: column; gap: 10px; align-items: flex-start;\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; font-weight: 700;\">ship<\u002Fspan>\n<span class=\"tag tag-outline\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.12em;\">WORKFLOW<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" data-flow=\"mr\" sc-camel-on-mouse-enter=\"{{ tipOn }}\" sc-camel-on-mouse-leave=\"{{ tipOff }}\" sc-camel-on-focus=\"{{ tipOn }}\" sc-camel-on-blur=\"{{ tipOff }}\" style=\"flex: 1 1 150px; text-align: left; background: var(--color-surface); border: 0; padding: 20px 16px; font: inherit; cursor: default; color: var(--color-text);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px; font-weight: 700;\">mr<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<p aria-live=\"polite\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.6; margin: 14px 0 0; min-height: 3em; max-width: 80ch; color: color-mix(in srgb, var(--color-text) 72%, transparent);\">{{ tipText }}<\u002Fp>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; margin: 8px 0 56px; max-width: 80ch;\"><strong>ship is a dynamic workflow, so there is nobody to ask.<\u002Fstrong> The runtime takes no mid-run input at all; zero-touch is a property of the runtime, not a promise in a prompt.<\u002Fp>\n\n<div ref=\"{{ installRef }}\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 2px; border-top: 2px solid var(--color-divider); padding-top: 2px;\">\n<div data-copy=\"1\" style=\"background: var(--color-surface); padding: 16px; display: flex; flex-direction: column; gap: 10px;\">\n<div style=\"display: flex; align-items: center; gap: 12px;\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin-right: auto;\">Install<\u002Fspan>\n<button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ copy }}\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em;\">COPY<\u002Fbutton>\n<\u002Fdiv>\n<pre style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto;\">npm install -g @fission-ai/openspec@latest\ncd your-project &amp;&amp; openspec init\n/plugin marketplace add renzrollon/interlock\n/plugin install interlock@interlock<\u002Fpre>\n<\u002Fdiv>\n<div data-copy=\"2\" style=\"background: var(--color-surface); padding: 16px; display: flex; flex-direction: column; gap: 10px;\">\n<div style=\"display: flex; align-items: center; gap: 12px;\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin-right: auto;\">Once per repo<\u002Fspan>\n<button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ copy }}\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em;\">COPY<\u002Fbutton>\n<\u002Fdiv>\n<pre style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto;\">interlock doctor              # prints the exact allowlist an unattended run needs\n/interlock:bootstrap          # code → understanding → graph<\u002Fpre>\n<\u002Fdiv>\n<div data-copy=\"3\" style=\"background: var(--color-surface); padding: 16px; display: flex; flex-direction: column; gap: 10px;\">\n<div style=\"display: flex; align-items: center; gap: 12px;\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin-right: auto;\">Every change<\u002Fspan>\n<button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ copy }}\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em;\">COPY<\u002Fbutton>\n<\u002Fdiv>\n<pre style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto;\">/interlock:spec \"&lt;idea&gt;\"      # explore → artifacts → review, then stops\n/interlock:ship               # waves → verify → commit\n/interlock:ship --strict      # + adversarial review, remediation, handoff, conformance<\u002Fpre>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-size: 14px; color: color-mix(in srgb, var(--color-text) 65%, transparent); margin: 16px 0 56px; max-width: 90ch; text-wrap: pretty;\">Requires Claude Code v2.1.154+ with dynamic workflows enabled, the <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec<\u002Fcode> CLI, and Node.js 18 or newer. Interlock is a Claude Code plugin; Cursor and Copilot are not supported in 0.x. The three CLIs also install on their own with <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">npm install -g @renzrollon/interlock<\u002Fcode>.<\u002Fp>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 2px; border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider); padding: 2px 0; margin-bottom: 56px;\">\n<div style=\"background: var(--color-surface); padding: 20px 16px;\">\n<div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.04em;\">1<\u002Fdiv>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.5; margin: 10px 0 0; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">required human stop, between spec and ship<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 20px 16px;\">\n<div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.04em;\">17<\u002Fdiv>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.5; margin: 10px 0 0; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">decisions moved out of prose and into a CLI with an exit code<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 20px 16px;\">\n<div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.04em;\">0<\u002Fdiv>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.5; margin: 10px 0 0; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">runtime dependencies. Stdlib Node, nothing to install<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 20px 16px;\">\n<div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.04em;\">35<\u002Fdiv>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.5; margin: 10px 0 0; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">changes shipped through its own loop, 22 Aug to 7 Sep 2026<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 20px 16px;\">\n<div style=\"font-family: var(--font-heading); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.04em;\">63<\u002Fdiv>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.5; margin: 10px 0 0; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">test files. npm test, no model, no network<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section role=\"tabpanel\" id=\"panel-why\" aria-labelledby=\"tab-why\" hidden=\"{{ hideWhy }}\" data-screen-label=\"Why\" style=\"max-width: 1120px; margin: 0 auto; padding: 0 16px 72px;\">\n<div style=\"border-top: 2px solid var(--color-divider); padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 20px; max-width: 20ch;\">How many decisions the model is not allowed to make.<\u002Fh2>\n<p style=\"max-width: 68ch; margin: 0 0 40px; text-wrap: pretty;\">Most of the category competes on how much structure you write before coding. Spec Kit adds phases, BMAD adds roles, Kiro adds an IDE. Interlock competes on a different axis. Every row below is a decision a model used to make in prose, on every run, usually differently. Each now has a command, a hook or a runtime property that makes it, and a cost stated beside it.<\u002Fp>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 32px; padding: 0 0 12px; border-bottom: 2px solid var(--color-divider);\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0;\">The pain<\u002Fp>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0;\">The mechanism<\u002Fp>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0;\">The cost<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; padding: 28px 0; border-bottom: 1px solid var(--color-divider);\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.15; letter-spacing: -0.02em; margin: 0;\">“The agent talked itself past its own cap.”<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">Caps are code. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">lib/limits.mjs<\u002Fcode> holds every one and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">interlock limits<\u002Fcode> prints them. Skills are forbidden from restating a number; a test walks the codebase and fails on any published cap nothing reads. The planner prompt is forbidden from naming the solo envelope, because a model that can read a bound can argue with it.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">Changing a cap is a code change with a test, not a prompt edit. There are no per-repo caps, on purpose.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; padding: 28px 0; border-bottom: 1px solid var(--color-divider);\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.15; letter-spacing: -0.02em; margin: 0;\">“The run asked a question at 2am and sat there.”<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">/interlock:ship<\u002Fcode> is a dynamic workflow, a script the Claude Code runtime executes. The runtime takes no mid-run input. There is no question to remove because nothing is listening. Everything that needs a human is settled in <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">spec<\u002Fcode>, before the run starts.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">One interruption survives: a permission prompt for a command you did not allowlist. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">interlock doctor<\u002Fcode> derives the exact list from what the flow shells out to plus your own test profile, and a session-start hook runs it for you.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; padding: 28px 0; border-bottom: 1px solid var(--color-divider);\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.15; letter-spacing: -0.02em; margin: 0;\">“Two parallel agents overwrote each other.”<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">The planner compares each task's predicted files on the canonical path and folds any two that collide into one lane, run in order by one agent. With <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">--isolate-waves<\u002Fcode>, each lane runs in its own git worktree and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">interlock merge-lanes<\u002Fcode> folds them back; two lanes that wrote the same file halt the run naming the path and both lanes, never last-writer-wins.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">The file prediction is still a model's. Without the flag the race is narrowed, not closed.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; padding: 28px 0; border-bottom: 1px solid var(--color-divider);\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.15; letter-spacing: -0.02em; margin: 0;\">“The review reports everything, so we skim it.”<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">Up to six review dimensions run in parallel, then two skeptics attack every blocker and warning. A finding that does not survive is never shown to you. A dismissal must cite a <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">file:line<\u002Fcode> inside the reviewed diff or it dismisses nothing. The report prints how many findings were dismissed and how many refutations were refused.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">Review is opt-in (<code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">--review<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">--strict<\u002Fcode>, or <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">/interlock:review-code<\u002Fcode>) and it is the expensive part of a run. Default ship does not pay for it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; padding: 28px 0; border-bottom: 1px solid var(--color-divider);\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.15; letter-spacing: -0.02em; margin: 0;\">“Nobody can reconstruct what the run did.”<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">Every run appends a JSONL trajectory, one line per wave action, CLI exit, agent spawn and verify judgement, plus a receipt and an outcome record. The summary names the run id, project and directory. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">interlock run-log check<\u002Fcode> halts an otherwise clean run whose trajectory cannot be replayed.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">The corpora live in the repo tree. Decide once whether they are an audit trail to commit or exhaust to ignore.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; padding: 28px 0; border-bottom: 1px solid var(--color-divider);\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.15; letter-spacing: -0.02em; margin: 0;\">“Specs rot, so we stopped writing them.”<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">interlock drift<\u002Fcode> reports four findings at three separate confidence levels, never averaged: unarchived changes (certain), specs citing deleted files (evidence), changed files no spec describes (evidence, always with a repo-wide denominator), specs older than the code they cite (inference, printed last). Every clean ship prints <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">ARCHIVE PENDING<\u002Fcode>.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">Drift never blocks. A gate built on regex-inferred links would be wrong often enough to get switched off, and a gate everyone disables protects nothing.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; padding: 28px 0; border-bottom: 1px solid var(--color-divider);\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.15; letter-spacing: -0.02em; margin: 0;\">“The suite went green because it got smaller.”<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">During remediation and final verification, a <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">PreToolUse<\u002Fcode> guard denies edits to test files. Given a baseline, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">interlock verify<\u002Fcode> flags a test count that fell or a skipped count that rose, and a weakened suite outranks a green one. Repair is by root cause: failures cluster by normalised error signature and the largest cause is fixed first, bounded by a cap.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">The guard binds only on Claude Code. On the experimental Codex and Qwen hosts you get the shrink check alone and a <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">HOOKS NOT IN FORCE<\u002Fcode> banner.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; padding: 28px 0; border-bottom: 2px solid var(--color-divider);\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.15; letter-spacing: -0.02em; margin: 0;\">“The run degraded and the summary looked identical to a clean one.”<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">Every degradation is a named banner: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">GRAPH UNAVAILABLE<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">NO TEST PROFILE<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">MODEL ROUTING OVERRIDDEN<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">VERIFICATION SKIPPED<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">LEAN SHIP<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">PUSH FAILED<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">CACHE ACCOUNTING NOT REPORTED<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">HOOKS NOT IN FORCE<\u002Fcode>. A clean run prints the banner block too, saying nothing degraded, because silence and cleanliness must not look alike. The banner strings are asserted verbatim in the test suite: a reworded banner is a banner nobody greps for.<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">Summaries are longer.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding-top: 56px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 36px;\">Five bets, with the wager stated.<\u002Fh2>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2px;\">\n<div style=\"background: var(--color-surface); padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n<span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 32px; line-height: 1; color: var(--color-accent);\">1<\u002Fspan>\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 21px; line-height: 1.15; margin: 0;\">The human checkpoint between spec and ship is the product.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">One required stop, placed where a wrong idea is cheapest to kill, buys an uninterrupted implementation run on the other side. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">/interlock:spec<\u002Fcode> writes specifications and stops. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">/interlock:ship<\u002Fcode> asks nothing. The one opt-out, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">spec --continue<\u002Fcode>, is argued against in its own documentation: “Continuity cannot catch a wrong idea. Every check it runs asks whether the change is implementable. None of them asks whether it is right.”<\u002Fp>\n<blockquote style=\"margin: 0; border-left: 2px solid var(--color-accent); padding-left: 16px; font-family: var(--font-heading); font-weight: 600; font-size: 17px; line-height: 1.35;\">“The gap between <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec<\u002Fcode> and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">ship<\u002Fcode> is the product. A spec is the cheapest place to catch a wrong idea, so that is the one place a person is required to look.”<\u002Fblockquote>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n<span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 32px; line-height: 1; color: var(--color-accent);\">2<\u002Fspan>\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 21px; line-height: 1.15; margin: 0;\">Thresholds are code, not prose.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">The test for what belongs in the CLI: if two competent runs could reach different answers from the same inputs and only one is right, it was never a judgement. Seventeen such decisions are subcommands with exit codes. A cap nothing reads was removed rather than wired. A removed cap is removed, not aliased, so a stale reader fails at import.<\u002Fp>\n<blockquote style=\"margin: 0; border-left: 2px solid var(--color-accent); padding-left: 16px; font-family: var(--font-heading); font-weight: 600; font-size: 17px; line-height: 1.35;\">“A speed limit painted on the road and a governor fitted in the engine are both ‘the rule’. Only one of them still holds when the driver is late.”<\u002Fblockquote>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n<span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 32px; line-height: 1; color: var(--color-accent);\">3<\u002Fspan>\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 21px; line-height: 1.15; margin: 0;\">Zero-touch is a property of the runtime, not a promise.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">You cannot get autonomy by instructing a model to be autonomous. You get it by running the loop somewhere that has no channel for a question. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">lib/run.mjs<\u002Fcode> emits the whole ship program as versioned steps: the agents to spawn, their briefings, and the exact argv to call next. The two drivers interpret those steps and branch on nothing.<\u002Fp>\n<blockquote style=\"margin: 0; border-left: 2px solid var(--color-accent); padding-left: 16px; font-family: var(--font-heading); font-weight: 600; font-size: 17px; line-height: 1.35;\">“<code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">ship<\u002Fcode> asks nothing not because it was instructed to be autonomous, but because the workflow runtime has no channel for mid-run input at all. There is nobody listening.”<\u002Fblockquote>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n<span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 32px; line-height: 1; color: var(--color-accent);\">4<\u002Fspan>\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 21px; line-height: 1.15; margin: 0;\">A dismissal must cite evidence. A report needn't.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">The two review errors are not symmetric. A surviving false positive costs a human ten seconds. A wrongly dismissed finding is invisible, and nobody can catch a mistake they never see. So only the dismissing direction is gated: a “not real” verdict must carry a <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">file:line<\u002Fcode> span whose path is in the reviewed diff. An uncited refutation is a non-vote, and the report counts how many were refused.<\u002Fp>\n<blockquote style=\"margin: 0; border-left: 2px solid var(--color-accent); padding-left: 16px; font-family: var(--font-heading); font-weight: 600; font-size: 17px; line-height: 1.35;\">“Confident prose is the single thing an LLM produces most reliably, so it is the one thing a dismissal must not rest on.”<\u002Fblockquote>\n<p style=\"margin: 0; font-size: 14px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">Cited: <a href=\"https://arxiv.org/pdf/2604.19049\">Refute-or-Promote (arXiv 2604.19049)<\u002Fa> documents eighty-plus agents, dedicated skeptics among them, unanimously endorsing an OpenSSL padding oracle that did not exist.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 24px; display: flex; flex-direction: column; gap: 14px;\">\n<span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 32px; line-height: 1; color: var(--color-accent);\">5<\u002Fspan>\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 21px; line-height: 1.15; margin: 0;\">Degradation is spoken, never silent.<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px;\">The compounding failure is not a bad run. It is a bad run that looks like a good one. Token usage a host cannot report is <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.92em;\">unknown<\u002Fcode>, never zero. An unobserved indicator renders at the same weight as a measured one, with its reason as the cell content. An empty graph build says so and explains why.<\u002Fp>\n<blockquote style=\"margin: 0; border-left: 2px solid var(--color-accent); padding-left: 16px; font-family: var(--font-heading); font-weight: 600; font-size: 17px; line-height: 1.35;\">“What you cannot see, you cannot correct.”<\u002Fblockquote>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<ul style=\"margin: 32px 0 0; padding-left: 20px; max-width: 78ch; display: flex; flex-direction: column; gap: 12px; font-size: 16px;\">\n<li><strong>Guards fail open, never closed.<\u002Fstrong> The three deny hooks bind only agents inside a ship run and allow whenever they cannot establish the stage. Installing Interlock does not change how your own editing or committing behaves.<\u002Fli>\n<li><strong>Spec drift is measured at three confidence levels, never averaged.<\u002Fstrong> Collapsing them into one number would launder the weakest signal through the strongest.<\u002Fli>\n<li><strong>Corpora are recorded but never consulted.<\u002Fstrong> Earned autonomy is a ledger nobody reads yet. No autonomy level and no accumulated outcome relaxes a gate. “Reading a corpus and branching on it are different acts, and only the first has been built.”<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 56px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 20px;\">What stays with the model.<\u002Fh2>\n<p style=\"max-width: 68ch; margin: 0 0 24px; text-wrap: pretty;\">Read the two sections above quickly and you could conclude the design distrusts the model. That is the wrong takeaway. Everything that is genuinely a judgement stays with it: reading an unfamiliar codebase, deciding what a task is worth, writing the code, reviewing a diff, synthesising a summary a person will read. What moved out is only what has a correct answer. The split is the point:<\u002Fp>\n<blockquote style=\"margin: 0; font-family: var(--font-heading); font-weight: 800; font-size: clamp(22px, 3.2vw, 34px); line-height: 1.15; letter-spacing: -0.02em; max-width: 24ch; border-left: 4px solid var(--color-accent); padding-left: 20px;\">The script holds the loop, the CLI holds the rules, the agents do the work.<\u002Fblockquote>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 56px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 24px;\">No published benchmark.<\u002Fh2>\n<blockquote style=\"margin: 0 0 28px; max-width: 72ch; border-left: 2px solid var(--color-accent); padding-left: 20px; font-size: 18px; text-wrap: pretty;\">“The unit suite proves the policy engine behaves as specified. It does not prove the workflow produces better outcomes than a simpler loop. That comparison has not been run, and until it has, everything above is an argument from mechanism rather than from measurement. The outcome corpus exists to close that gap and currently has no control group.”<\u002Fblockquote>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2px;\">\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 15px;\"><strong>Portability.<\u002Fstrong> Spec Kit runs on thirty agents. Interlock runs on one, because the guarantees come from Claude Code's workflow runtime. A portable version of this would be a folder of prompts, which is the thing it exists not to be.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 15px;\"><strong>Surface area.<\u002Fstrong> Twenty-eight top-level subcommands, sixteen skills, four host adapters, four hooks. The repository books this as a cost.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 15px;\"><strong>Review is opt-in.<\u002Fstrong> Lean ship trusts your unit suite. If <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">tasks.md<\u002Fcode> and the suite are thin, lean ship is a cost default, not a quality default.<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 28px 0 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 70%, transparent); max-width: 78ch;\">Interlock is a Claude Code plugin. Cursor and Copilot are not supported in 0.x. The experimental runner (<code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock-run<\u002Fcode>) and earned autonomy are experimental; <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship<\u002Fcode> is the supported path.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section role=\"tabpanel\" id=\"panel-harness\" aria-labelledby=\"tab-harness\" hidden=\"{{ hideHarness }}\" data-screen-label=\"Harness\" style=\"max-width: 1120px; margin: 0 auto; padding: 0 16px 72px;\">\n<div style=\"border-top: 2px solid var(--color-divider); padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 20px;\">Where Interlock sits inside Claude Code.<\u002Fh2>\n<p style=\"max-width: 70ch; margin: 0 0 36px; text-wrap: pretty;\">Interlock is a process layer with no harness of its own. It borrows Claude Code's: the Skill tool, the slash namespace, the Workflow runtime, subagent fan-out, the hook dispatch, and the injection of the plugin's <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">bin/<\u002Fcode> onto the PATH. Everything the loop decides lives below that line, in a zero-dependency Node CLI any host can shell out to. The diagram reads top to bottom: what the host provides, what the plugin adds in prose, what interprets, what decides, and what is written to disk.<\u002Fp>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--color-divider);\">\n<button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleLens }}\">{{ lensLabel }}<\u002Fbutton>\n<p style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; letter-spacing: 0.04em; color: color-mix(in srgb, var(--color-text) 65%, transparent);\">dotted: a model decides · solid: code decides, no model, no network<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column;\">\n<div style=\"display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent);\">Host<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n<button type=\"button\" data-layer-node=\"cc-host\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; text-align: left;\">Claude Code<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"slash\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">/interlock:bootstrap · spec · ship · mr<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"workflow-rt\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; text-align: left;\">Workflow runtime<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"subagents\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">interlock:worker · interlock:ping<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"path-inject\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; text-align: left;\">plugin bin/ on the PATH<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent);\">Guards<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n<button type=\"button\" data-layer-node=\"hooks\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; text-align: left;\">four hooks: one preflight, three guards<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent);\">Prose<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n<button type=\"button\" data-layer-node=\"skills\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; text-align: left;\">sixteen SKILL.md<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent);\">Drivers<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n<button type=\"button\" data-layer-node=\"ship-js\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">workflows/ship.js<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"runner\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">bin/interlock-run (experimental)<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent);\">Policy<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n<button type=\"button\" data-layer-node=\"run-mjs\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">lib/run.mjs — the run program<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"lib\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; text-align: left;\">thirty-six pure decision modules<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"prompts\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">lib/prompts/<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"limits\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">lib/limits.mjs<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent);\">CLI<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n<button type=\"button\" data-layer-node=\"cli\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">bin/interlock<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"graph-cli\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">interlock-graph<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"report\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">interlock report<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent);\">Port<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n<button type=\"button\" data-layer-node=\"hostport\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">lib/host.mjs<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"registry\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">lib/host/registry.mjs<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"adapters\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">claude · acp · codex · qwen<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--color-divider);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent);\">External<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n<button type=\"button\" data-layer-node=\"openspec\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; padding: 8px 12px; cursor: pointer; text-align: left;\">the openspec CLI and openspec/<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 2px solid var(--color-divider);\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent);\">Corpora<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n<button type=\"button\" data-layer-node=\"stage\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; text-align: left;\">the stage marker<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"runstate\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; text-align: left;\">run state, briefings, worktrees, spill<\u002Fbutton>\n<button type=\"button\" data-layer-node=\"corpora\" sc-camel-on-click=\"{{ pickNode }}\" style=\"border: 1px solid var(--color-divider); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; text-align: left;\">trajectory · outcomes · review metrics · receipt · ledger<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div hidden=\"{{ drawerHidden }}\" style=\"background: var(--color-surface); border-left: 4px solid var(--color-accent); padding: 24px; margin-top: 2px;\">\n<div style=\"display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 21px; line-height: 1.2; margin: 0; margin-right: auto;\">{{ drawerLabel }}<\u002Fh3>\n<button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ closeDrawer }}\">Close<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;\">\n<div>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 6px;\">Owns<\u002Fp>\n<p style=\"margin: 0; font-size: 15px;\">{{ drawerOwns }}<\u002Fp>\n<\u002Fdiv>\n<div>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 6px;\">Forbidden from<\u002Fp>\n<p style=\"margin: 0; font-size: 15px;\">{{ drawerNo }}<\u002Fp>\n<\u002Fdiv>\n<div>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 6px;\">Path<\u002Fp>\n<p style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px;\">{{ drawerPath }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 20px 0 6px;\">Wires<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 4px;\">\n<sc-for list=\"{{ drawerWires }}\" as=\"w\" hint-placeholder-count=\"3\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: color-mix(in srgb, var(--color-text) 75%, transparent);\">{{ w.line }}<\u002Fp>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; font-size: 14px; color: color-mix(in srgb, var(--color-text) 62%, transparent);\">Two wires are absent by design: the run program never loads a transport, and nothing in the loop consults the report.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 20px;\">The whole loop is emitted, not written.<\u002Fh2>\n<p style=\"max-width: 70ch; margin: 0 0 20px;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock run<\u002Fcode> emits every step of a ship run as a record with exactly four guaranteed fields: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">schema<\u002Fcode> (<code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock.run-step/1<\u002Fcode>), <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">action<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">then<\u002Fcode>, and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spawns<\u002Fcode>. The action is one of fifteen frozen values. Each spawn carries a label, a kind, a model, an effort, the tools it may use, a result schema, and a briefing delivered by path and sha256. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">then<\u002Fcode> is the exact argv to call once the spawns return, or null when the run is over.<\u002Fp>\n<p style=\"max-width: 70ch; margin: 0 0 28px;\">The driver's entire loop, in prose: while there is a step with a continuation, spawn everything the step names, then call the continuation. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">workflows/ship.js<\u002Fcode> has no switch on the action. The only reads of it in the file are token accounting and one cosmetic word in the final line. The experimental runner has the identical loop. A test runs a sweep over both drivers for any policy literal and allows none.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2px; margin-bottom: 24px;\">\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 15px;\"><strong>Briefing by reference.<\u002Fstrong> The CLI writes <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">.claude/ship/briefings/&lt;label&gt;.md<\u002Fcode> with its sha256 on line one. The Workflow host hands the worker the path and requires the hash back. An unacknowledged or wrong hash fails the task closed rather than risking a silently under-instructed agent.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 15px;\"><strong>The CLI relay.<\u002Fstrong> The Workflow runtime has no shell, so every <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock<\u002Fcode> call is a haiku ping told to run one command and copy its stdout verbatim. An invented action gets one re-ask and then a halt; it is never obeyed.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 15px;\"><strong>The sequence guard.<\u002Fstrong> The manifest records the last continuation the program emitted. A call that is not the expected one halts the run naming the expected one, so a driver that skips or repeats cannot advance the state machine twice.<\u002Fp>\n<\u002Fdiv>\n<blockquote style=\"margin: 0; border-left: 2px solid var(--color-accent); padding-left: 20px; max-width: 76ch; font-size: 16px;\">Every briefing ends with one appended line, stated once so neither driver holds it: “You are one step of an automated ship run. Do not ask questions; there is no one listening. If something is undecidable, put it in the result fields rather than guessing at product intent.”<\u002Fblockquote>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 20px;\">What a host cannot do is declared, never discovered.<\u002Fh2>\n<p style=\"max-width: 70ch; margin: 0 0 16px;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">lib/host.mjs<\u002Fcode> states the whole host contract as three operations: spawn one labelled agent, spawn a batch in parallel, and run <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock<\u002Fcode> and hand back its exit code and stdout. A host may not decide wave order, judge a verify result, apply a cap or a gate; those live behind the CLI on purpose, so a second host cannot quietly grow a second copy of the rules. The CLI path resolves from the module's own location, never from the PATH or a caller string. A non-zero exit is an answer, not an error: a host that threw on it would turn a halt into a crash.<\u002Fp>\n<p style=\"max-width: 70ch; margin: 0 0 28px;\">An adapter under <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">lib/host/<\u002Fcode> is a transport plus a declaration of seven capabilities. Every one describes a way a run on that host is weaker than the default, and the run program branches on the declaration, never on the host's name. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship<\u002Fcode> on the Workflow runtime is the supported path. The runner is experimental, no slash command starts it, and it refuses <code style=\"font-family: '
