ate everyone disables protects nothing.<\u002Fp>\n<\u002Fdiv>\n\n<div data-dd=\"dd-review-md\" style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(28px, 4vw, 46px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 16px;\">Scope and advice, never the bar.<\u002Fh2>\n<p style=\"max-width: 72ch; margin: 0 0 24px;\">An optional file at the repository root, read on every review. Two consumers, one per trust level.<\u002Fp>\n<div style=\"overflow-x: auto; margin-bottom: 20px;\">\n<sc-raw-table class=\"table\" style=\"min-width: 720px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Part of the file<\u002Fsc-raw-th><sc-raw-th style=\"width: 160px;\">Consumer<\u002Fsc-raw-th><sc-raw-th style=\"width: 110px;\">Trust<\u002Fsc-raw-th><sc-raw-th>Effect<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Prose: who owns the bar, what “Important” means here, why paths are excluded<\u002Fsc-raw-td><sc-raw-td>the reviewer prompt<\u002Fsc-raw-td><sc-raw-td>advice<\u002Fsc-raw-td><sc-raw-td>Injected into every reviewer as quoted repository context. It cannot lower survival.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">## Do Not Report<\u002Fcode> paths<\u002Fsc-raw-td><sc-raw-td>the CLI<\u002Fsc-raw-td><sc-raw-td>enforced<\u002Fsc-raw-td><sc-raw-td>Findings on those paths are dropped before the band applies, and each drop is reported with the excluding path.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"max-width: 74ch; margin: 0;\">A model is never handed the path list as something to honour. A path exclusion a model can choose to ignore is not an exclusion. What the file cannot change is the quality band or the nit cap: a threshold-shaped key is reported as not an accepted field and ignored, never adopted. Exclusions shrink the input set; they never lower the bar. No file means the feature is off. A malformed file is reported and the run proceeds under default policy, with each half validated independently, because a typo in a policy file must never block a ship run but must be visible. Path matching is canonical and case-sensitive: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">dist<\u002Fcode> excludes <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">dist/bundle.js<\u002Fcode> and not <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">distant/a.js<\u002Fcode>, and Interlock accepts a visible under-exclusion over a silent over-exclusion.<\u002Fp>\n<\u002Fdiv>\n\n<div data-dd=\"dd-evals\" style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(28px, 4vw, 46px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 16px;\">No model evals run in your CI.<\u002Fh2>\n<p style=\"max-width: 74ch; margin: 0 0 16px;\">The deterministic spine is densely unit-tested. The prompts and skills that steer a model are regression-tested against a real model by an eval suite of eleven cases, each citing the reproduced failure it encodes: tier read scope, cited-cap resolution, lane partial-failure reporting, handoff enum conformance, control-plane action invention, trampoline halt and launch, skill routing, and evidence-locator fabrication. The case list is pinned in a test that compares it to directory discovery: a list nobody asserts silently drifts.<\u002Fp>\n<p style=\"max-width: 74ch; margin: 0 0 16px;\">The verdict is model-free. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock evals triage<\u002Fcode> classifies a results file as regression, variance, or no signal, with no model and no network, and its exit code is the verdict, so the one gate a model could otherwise re-argue is on the deterministic spine like every other decision. The suite is advisory pending a baseline; no blocking threshold exists because it would be a guess.<\u002Fp>\n<p style=\"max-width: 74ch; margin: 0;\">For a team running Interlock against its own product: the model-facing surface is identical in every consumer, your own suite and your read at the checkpoint answer what you actually want to know, and the eval harness is early-access and metered on terms you do not control. So Interlock runs no model evals in your CI. A misbehaving run becomes a citable report with <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock evals capture<\u002Fcode>.<\u002Fp>\n<\u002Fdiv>\n\n<div data-dd=\"dd-cost\" style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(28px, 4vw, 46px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 16px;\">Cost is not the point. Degradation is. The two are the same lever.<\u002Fh2>\n<p style=\"max-width: 74ch; margin: 0 0 24px;\">Context rot is the reason; cost is the side effect. <a href=\"https://www.trychroma.com/research/context-rot\">Chroma measured accuracy degradation<\u002Fa> across eighteen frontier models as context grows, even when every relevant token is present. Four mechanisms, each visible in the plan or the receipt.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2px; margin-bottom: 32px;\">\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>1. Context tiering.<\u002Fstrong> Tier 1 reads the task description and nothing else; tier 2 adds the relevant section of the design; tier 3 the relevant spec file; tier 4 and above the design and specs in full. Tiers 1 and 2 carry a stop instruction: after typecheck and lint pass, stop; do not refactor or polish. The exception is load-bearing: an agent implementing against an active change reads the proposal, design, tasks and delta specs in full.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>2. Model routing with a clamp.<\u002Fstrong> Tier 1 to haiku, tiers 2 to 4 to sonnet, tier 5 to opus. Control-plane pings run on haiku; they parse JSON and report it verbatim. Classifiers reliably over-assign opus, so the planner clamps after classification and prints every clamp. Reasoning effort is tabled per tier; the verify and skeptic steps are pinned to the highest.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>3. Locate before you read.<\u002Fstrong> Query the graph before you grep; locate the line, then read a span. Retrieval is budgeted in tokens: the docs digest at roughly 2500, a graph context bundle at 2000, a docs query at 800, a structural query at 1500.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>4. Spawn weight, not just spawn count.<\u002Fstrong> Two named plugin agents with tool allowlists that exclude Skill, Agent and MCP, so workers stop inheriting tens of thousands of tokens of schemas per spawn. Cohesion lanes fold sixteen tier-2 test tasks into one agent reading the design once. Singleton waves fold into batches. Solo mode ships a small change on one opus agent.<\u002Fp>\n<\u002Fdiv>\n<div style=\"overflow-x: auto; margin-bottom: 28px;\">\n<sc-raw-table class=\"table\" style=\"min-width: 680px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 60px;\">Tier<\u002Fsc-raw-th><sc-raw-th>Work<\u002Fsc-raw-th><sc-raw-th style=\"width: 170px;\">Model after clamp<\u002Fsc-raw-th><sc-raw-th style=\"width: 110px;\">Effort<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">1<\u002Fsc-raw-td><sc-raw-td>trivial one-file edit<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">haiku<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">low<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">2<\u002Fsc-raw-td><sc-raw-td>single-concern change<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">sonnet<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">low<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">3<\u002Fsc-raw-td><sc-raw-td>new logic in one domain<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">sonnet<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">inherit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">4<\u002Fsc-raw-td><sc-raw-td>cross-file work following existing patterns; breadth is not depth<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">sonnet<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">inherit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">5<\u002Fsc-raw-td><sc-raw-td>genuinely novel architecture; the only tier that may be opus<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">opus<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">xhigh<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"max-width: 74ch; margin: 0 0 20px;\"><strong>Prefix lifetime<\u002Fstrong>, the axis the four above never touch. Writing a prefix to cache costs more than not caching (1.25× base input for the five-minute tier, 2× for the one-hour tier); reading one back costs 0.1×. A prefix that survives to be read is a large saving; one that expires before the next wave is a surcharge on work you would have paid for anyway. Wave boundaries measured in this repository's own trajectory ran to 363 and 1017 seconds, both past the short default lifetime. Interlock cannot set either lifetime, because a plugin has no settings component, and says so. What it does: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock doctor<\u002Fcode> reports the two settings keys and which scopes configure them, advisory and never failing; a run records cache reads and cache creation per wave, creation split by lifetime tier and never summed; and cache accounting is a declared host capability, bannered where absent. The Workflow runtime exposes one cumulative scalar, so a ship run prints <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">CACHE ACCOUNTING NOT REPORTED<\u002Fcode> and records unknown, never zero.<\u002Fp>\n<div style=\"background: var(--color-accent); color: #ffffff; padding: 24px; margin-bottom: 20px;\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; margin: 0 0 10px; opacity: 0.9;\">The billing note<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; max-width: 76ch;\">A Claude subscription can only be spent through the interactive <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">claude<\u002Fcode> binary. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">claude -p<\u002Fcode>, the Agent SDK and ACP are the usage Anthropic flagged for separate metered credit; the interactive Workflow runtime is the path that change exempted. So <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship<\u002Fcode> stays the default, no skill ever starts the runner, and every run on the runner prints <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">SUBSCRIPTION PATH: programmatic<\u002Fcode>.<\u002Fp>\n<\u002Fdiv>\n<p style=\"max-width: 74ch; margin: 0;\"><strong>Two cost kill-switches to name.<\u002Fstrong> <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">CLAUDE_CODE_SUBAGENT_MODEL<\u002Fcode> overrides every per-tier model; a run of forty tier-1 tasks costs forty opus calls if that is what you exported, and Interlock banners it rather than reporting a clean run. A missing allowlist entry parks the run on a permission prompt, and a parked run re-runs work on resume.<\u002Fp>\n<\u002Fdiv>\n\n<div data-dd=\"dd-receipts\" style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(28px, 4vw, 46px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 24px;\">A run nobody watched can still be reconstructed and priced.<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2px;\">\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>The summary<\u002Fstrong> names every default applied, the run id, the project slug and the directory, and prints the banner block even when clean.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>The receipt<\u002Fstrong> records the host, its billing path, its hook availability and cache-accounting declaration; per-wave and per-run token spend; the plan-reuse status; remediation rounds; the paths the commit touched, read from version control rather than reported by the commit agent; and the paths the plan predicted.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>The trajectory<\u002Fstrong> is append-only JSONL: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock run-log show &lt;runId&gt;<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">query --halted<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">query --type verify-judgement<\u002Fcode>.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>The report<\u002Fstrong>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock report --html<\u002Fcode>, renders indicators over all three corpora as one self-contained offline document. Every value carries its denominator. An unobserved indicator renders at the same weight as a number, with its reason, never as a zero, a dash, a grey row or a collapsed cell. No threshold, no target, no trend arrow, no colour encodes health. It gates nothing, and that is policy: a rate over three observations is not a rate.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section role=\"tabpanel\" id=\"panel-compare\" aria-labelledby=\"tab-compare\" hidden=\"{{ hideCompare }}\" data-screen-label=\"Compare\" style=\"max-width: 1120px; margin: 0 auto; padding: 0 16px 72px;\">\n<div style=\"border-top: 2px solid var(--color-divider); padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(28px, 4vw, 46px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 20px; max-width: 24ch;\">Most tools compete on how much structure you write. This one competes on how many decisions the model is not allowed to make.<\u002Fh2>\n<p style=\"max-width: 72ch; margin: 0 0 28px;\">Read down the layer column and the map resolves. OpenClaw is a harness plus a channel layer. Hermes is a harness plus a channel plus a memory layer. DeepSeek Harness is a harness and nothing else. Interlock is a process layer with no harness of its own; it borrows Claude Code's. Against the tools that sit at Interlock's layer, the difference is where the enforcement lives.<\u002Fp>\n<div style=\"overflow-x: auto;\">\n<sc-raw-table class=\"table\" style=\"min-width: 940px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 150px;\">Tool<\u002Fsc-raw-th><sc-raw-th style=\"width: 130px;\">Layer<\u002Fsc-raw-th><sc-raw-th>Competes on<\u002Fsc-raw-th><sc-raw-th>Where Interlock differs<\u002Fsc-raw-th><sc-raw-th>Where it is honestly better<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><strong>Spec Kit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">process<\u002Fsc-raw-td><sc-raw-td>phases before code; breadth of host support<\u002Fsc-raw-td><sc-raw-td>caps, gate verdicts and the review band are a tested CLI with exit codes, not prompts a model follows<\u002Fsc-raw-td><sc-raw-td>portability: it runs on roughly thirty agents; Interlock runs on one<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>BMAD<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">process<\u002Fsc-raw-td><sc-raw-td>roles and ceremony: PM, architect, dev, QA agents<\u002Fsc-raw-td><sc-raw-td>no role-play; tiers, lanes and a model clamp. Judgement stays with the model, sequencing does not<\u002Fsc-raw-td><sc-raw-td>the role vocabulary is legible to non-engineers<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Kiro<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">IDE and process<\u002Fsc-raw-td><sc-raw-td>an IDE experience around specs<\u002Fsc-raw-td><sc-raw-td>a terminal plugin with CLIs on your PATH; nothing renders<\u002Fsc-raw-td><sc-raw-td>the IDE. Interlock has none and is not building one<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>OpenSpec, stock<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">artifact format and lifecycle<\u002Fsc-raw-td><sc-raw-td>the spec contract, templates, validation, archive<\u002Fsc-raw-td><sc-raw-td>Interlock composes it and does not fork it; it drives the CLI because the CLI is the stable contract<\u002Fsc-raw-td><sc-raw-td>simplicity and artifact portability. For a one-line change, propose it and implement it yourself. Uninstall Interlock and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec/<\u002Fcode> is still valid<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>OpenClaw<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">harness and channel<\u002Fsc-raw-td><sc-raw-td>your assistant exists when your laptop is closed: messaging apps into one gateway<\u002Fsc-raw-td><sc-raw-td>a different floor entirely. It does not know what a wave is and will not cap a remediation round<\u002Fsc-raw-td><sc-raw-td>reach: start work from your phone and keep it running after you disconnect<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Hermes Agent<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">harness, channel and memory<\u002Fsc-raw-td><sc-raw-td>an agent that accumulates: self-written memory, self-authored skills<\u002Fsc-raw-td><sc-raw-td>philosophically opposed: Hermes bets an agent should edit its own instructions; Interlock bets a decision with a correct answer belongs in a tested CLI<\u002Fsc-raw-td><sc-raw-td>continuity and isolation, including hibernating cloud sandboxes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>DeepSeek Harness<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">harness only<\u002Fsc-raw-td><sc-raw-td>everything is a plugin: adapter, tools, session log and the loop itself<\u002Fsc-raw-td><sc-raw-td>a harness is what Interlock runs on, not what it is. Moving Interlock onto it would be a port, not an upgrade<\u002Fsc-raw-td><sc-raw-td>the architecture and its documentation: an event-sourced session log with the LLM history derived from it<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>A folder of prompts<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">process, unenforced<\u002Fsc-raw-td><sc-raw-td>zero install cost; works everywhere<\u002Fsc-raw-td><sc-raw-td>every guarantee on this page is absent<\u002Fsc-raw-td><sc-raw-td>you already have it and it costs nothing. For a small repo with a careful operator this is fine<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Plain Claude Code with CLAUDE.md<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">harness and always-on instructions<\u002Fsc-raw-td><sc-raw-td>the baseline everyone runs<\u002Fsc-raw-td><sc-raw-td>CLAUDE.md is read every turn and followed; Interlock's caps are called. Interlock adds the checkpoint, wave isolation, the gates, the trajectory and the drift measure<\u002Fsc-raw-td><sc-raw-td>simplicity and always-on context. Interlock does not replace it<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"max-width: 76ch; margin: 24px 0 0;\">The price is portability, and it is not hidden. Spec Kit runs on thirty agents and Interlock runs on one, because the guarantees come from Claude Code's workflow runtime. A portable version of this would be a folder of prompts, which is the thing it exists not to be. The host-specific part turned out to be small, so it is a stated contract with four adapters behind it. Portability here means a second host adapter, not thirty prompt templates.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 24px;\">Objections, each answered with its limit.<\u002Fh2>\n<div style=\"border-top: 1px solid var(--color-divider);\">\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“This locks us into Claude Code.”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\">Correct, in 0.x, for the supported path, and the README says so in bold before it says anything else. The zero-touch contract, the PATH injection, the subagent fan-out and the guards all come from Claude Code. What is not locked in is everything the loop decides: the run program emits steps, and a host is one file that declares what it cannot do. Four exist. The CLIs install standalone from npm with no plugin at all.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship<\u002Fcode> runs on the workflow runtime or halts. The runner is experimental, no slash command starts it, and on Codex and Qwen the guards do not exist.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“We already have a CLAUDE.md.”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\">A CLAUDE.md is instructions the model reads and follows, and following is a decision. Take the situation where the rule has to hold: forty minutes in, two rounds have not fixed it, and it is close. Ask the model whether it has earned a third round. It will say yes, articulately. The real cap is a number in a file read by a script that has no opinion.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> CLAUDE.md is portable, always on, and costs nothing. Interlock does not replace it.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“Parallel agents will cost us a fortune.”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\">Context tiering gives tier-1 tasks the task description and nothing else. The model clamp stops classifiers escalating to opus. Retrieval is token-budgeted. Workers are named plugin agents with tool allowlists that exclude the schemas they would otherwise inherit per spawn. Cohesion lanes fold sixteen small tasks into one agent reading the design once. Default ship does not pay for review at all.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--strict<\u002Fcode> is expensive. One environment variable, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">CLAUDE_CODE_SUBAGENT_MODEL<\u002Fcode>, defeats the entire ladder, and Interlock banners it rather than hiding it. The prompt-cache lifetime is a setting Interlock cannot set.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“Our repo is Go, Rust or Java. The graph won't index it.”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\">Structural indexing covers JavaScript/TypeScript, Python and shell. Everything else gets docs and spec indexing, spec-to-file links, prose retrieval, and the complete workflow. Nothing in the loop requires the graph; agents fall back to grep, and the run says <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">GRAPH UNAVAILABLE<\u002Fcode> rather than pretending. Bootstrap phrases its explorers in your stack's vocabulary; verification runs whatever your profile names.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> you lose the structural half of the invariant sweep, the one gate that catches a value canonicalised in one place and still read raw in three others. The grep half still runs.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“Another spec format.”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\">Interlock writes nothing Interlock-shaped. It drives the <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec<\u002Fcode> CLI directly. The artifacts are plain markdown readable by any OpenSpec tool or a human with an editor. A change proposed by the stock skill can be shipped by Interlock; ship does not care who wrote the markdown.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> one file is an Interlock addition, the decision ledger. It is plain markdown, committed with the change.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“Autonomy is scary.”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\">Then do not skip the read, and the default is that you don't. One flag removes you, it is opt-in permanently, spec never suggests it, and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--force-checkpoint<\u002Fcode> beats it unconditionally. Its gate fails closed without exception: a check that could not run is a blocker, not a pass. Risk never averages; a docs change bundled with a payment change is a payment change, and high or critical risk may not continue at all.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> the documentation argues against its own feature: continuity cannot catch a wrong idea. Only a person reading the proposal catches that.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“What if it commits garbage?”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\">Six things stand between a wave and a commit, each an exit code. Validation refuses an unimplementable change. Inter-wave verify halts the next wave on a red typecheck or suite. Final verify halts on a red suite and repairs by root cause, bounded. The shrink check catches a suite that went green by getting smaller. More than the tolerated task failures halts. A hook denies <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">git commit<\u002Fcode> outside the commit stage, and the commit is one feature-level commit that never adds everything, never amends, never pushes.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> e2e failure is reported and never repaired, and the commit happens anyway with a banner. You have to look at that one. And lean ship never reviews the diff; it trusts your unit suite.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“How do I know what it did?”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\">The summary names every default applied and carries the run id. The receipt records the host, the billing path, the spend, the paths touched and the paths predicted. The trajectory is one line per action and can be queried. The report renders indicators with their denominators as an offline HTML file.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> the report gates nothing and is barred from ever doing so. Under roughly twenty observations it tells you to say “too few to read”.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“Reviews are noise.”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\">That is the diagnosis. Every blocker and warning is attacked by two skeptics before you see it, a dismissal must cite a line in the diff, the report prints how many were dismissed and how many refutations were refused, and a quality band drops what is too vague to act on. You can own the scope with a <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">REVIEW.md<\u002Fcode>.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> opt-in and priced accordingly. Diff review is structurally blind to a value read in more than one place, which is why the invariant sweep exists as the one licensed exception to the diff leash.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“Does this work on our monorepo?”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">bootstrap --scope<\u002Fcode> restricts onboarding to a subdirectory. The planner schedules from <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">tasks.md<\u002Fcode> and predicted paths, not a directory layout. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">REVIEW.md<\u002Fcode> at the root declares out-of-scope paths. Verification runs the commands your profile names.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> no monorepo-specific feature exists: no per-package specs, no package-scoped run state. Two teams shipping concurrently in one repo both append to one outcomes file, which is a merge-conflict site. This is the weakest answer on the page.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“We don't have dynamic workflows enabled.”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0 0 10px;\">Then there is no ship, and the trampoline halts rather than implementing the loop in conversation. Claude Code v2.1.154 or newer with workflows enabled; on a Pro plan, enable it in <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/config<\u002Fcode>. Everything else still works: spec, both reviews, commit, mr, the graph, the full CLI.<\u002Fp><p style=\"margin: 0; color: color-mix(in srgb, var(--color-text) 62%, transparent);\"><strong>Limit:<\u002Fstrong> the runner is experimental, weaker on zero-touch, and on the Claude binary it is a metered billing path.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"border-bottom: 2px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleAccordion }}\" style=\"width: 100%; display: flex; gap: 16px; align-items: baseline; background: none; border: 0; padding: 16px 0; font: inherit; text-align: left; cursor: pointer; color: var(--color-text);\"><span data-acc-mark=\"1\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--color-accent); font-size: 18px; width: 14px;\">+<\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">“Show me the benchmark.”<\u002Fspan><\u002Fbutton><div data-reveal=\"1\" hidden=\"hidden\" style=\"padding: 0 0 20px 30px; max-width: 78ch;\"><p style=\"margin: 0;\">There isn't one. The unit suite proves the policy engine behaves as specified. It does not prove the workflow produces better outcomes than a simpler loop. That comparison has not been run, and until it has, everything on this page is an argument from mechanism rather than from measurement. The outcome corpus exists to close that gap and currently has no control group.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px;\">\n<div>\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(24px, 3vw, 34px); line-height: 1.05; margin: 0 0 16px;\">For<\u002Fh2>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 15.5px;\">\n<li>Teams already on Claude Code v2.1.154 or newer with dynamic workflows enabled, who have watched an agent do something confident and wrong.<\u002Fli>\n<li>Teams who want one place a human is required to look, and no places a human is required to babysit.<\u002Fli>\n<li>Repos where being wrong is expensive: auth, money, migrations, tenancy, public API surface.<\u002Fli>\n<li>Engineers who will read a spec for ten minutes to buy an uninterrupted implementation run.<\u002Fli>\n<li>JavaScript/TypeScript, Python and shell repos, which get the full structural graph. Everything else gets the full workflow minus import and symbol edges.<\u002Fli>\n<li>Teams who want the audit trail in git: the trajectory, the outcome record and the review metrics as the record of how the code got written.<\u002Fli>\n<li>People who want the CLIs alone: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock<\u002Fcode> gating a CI job, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock-graph<\u002Fcode> indexing a repo for whatever agent they run.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div>\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(24px, 3vw, 34px); line-height: 1.05; margin: 0 0 16px;\">Not for<\u002Fh2>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 15.5px;\">\n<li>Cursor, Copilot, or any non-Claude-Code host as the primary path. Not supported in 0.x.<\u002Fli>\n<li>Teams who want an IDE. Kiro exists.<\u002Fli>\n<li>Teams who want portability across thirty agents. Spec Kit exists.<\u002Fli>\n<li>Anyone who wants a self-improving agent. Interlock's answer to “the agent learned something” is a proposal a human applies.<\u002Fli>\n<li>Anyone who wants configurable gates. The remediation round cap is not pluggable, on purpose. A cap you can mount a plugin over is not a cap.<\u002Fli>\n<li>A one-line change with an obvious implementation. Propose it with the stock skill and do it yourself.<\u002Fli>\n<li>Teams who need a published benchmark before adopting anything.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 20px;\">Stated limits.<\u002Fh2>\n<ul style=\"margin: 0; padding-left: 20px; max-width: 80ch; display: flex; flex-direction: column; gap: 10px; font-size: 16px;\">\n<li>Claude Code only in 0.x. The supported path requires v2.1.154 or newer with dynamic workflows enabled.<\u002Fli>\n<li>Adversarial review, handoff artifacts and conformance are opt-in (<code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--strict<\u002Fcode>), not the default.<\u002Fli>\n<li>Structural graph indexing covers JavaScript/TypeScript, Python and shell.<\u002Fli>\n<li>The experimental runner over <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">claude -p<\u002Fcode> is a metered billing path; the interactive Workflow runtime is not.<\u002Fli>\n<li>On Codex and Qwen hosts the guard hooks do not exist; only the shrink check stands between a repair and a weakened test.<\u002Fli>\n<li>E2E failures are reported and never repaired; the commit proceeds with a banner.<\u002Fli>\n<li>Drift and conformance never block.<\u002Fli>\n<li>The corpora are recorded and nothing reads them to change a run.<\u002Fli>\n<li>No monorepo-specific features.<\u002Fli>\n<li>No published benchmark. Version 1.0.0.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top: 2px solid var(--color-divider); margin-top: 24px;\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 40px 16px 56px;\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 32px; margin-bottom: 40px;\">\n<div>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 12px;\">Project<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 15px;\">\n<a href=\"https://github.com/renzrollon/interlock\">github.com/renzrollon/interlock<\u002Fa>\n<a href=\"https://www.npmjs.com/package/@renzrollon/interlock\">npm: @renzrollon/interlock<\u002Fa>\n<a href=\"https://github.com/Fission-AI/OpenSpec\">OpenSpec<\u002Fa>\n<a href=\"https://code.claude.com/docs/en/workflows\">Claude Code workflows<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 12px;\">Docs<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 4px 24px; font-size: 14px;\">\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/01-first-hour.md\">01 — The first hour<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/02-the-checkpoint.md\">02 — The checkpoint<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/03-openspec-vs-interlock.md\">03 — OpenSpec vs Interlock<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/04-when-it-stops.md\">04 — When it stops<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/05-continuity.md\">05 — Continuity<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/06-why-it-works.md\">06 — Why it works<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/08-harness-landscape.md\">08 — The harness landscape<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/09-from-prompt-to-workflow.md\">09 — From prompt to workflow<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/10-agentic-workflow-ship-and-spec.md\">10 — Ship and spec for prompt-only engineers<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/11-the-indicators.md\">11 — The indicators<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/12-repository-review-policy.md\">12 — Repository review policy<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/13-the-guards.md\">13 — The guards<\u002Fa>\n<a href=\"https://github.com/renzrollon/interlock/blob/main/docs/14-evals.md\">14 — Evals and the consumer posture<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top: 2px solid var(--color-divider); padding-top: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end;\">\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.8; margin-right: auto;\">\n<p style=\"margin: 0;\">The script holds the loop<\u002Fp>\n<p style=\"margin: 0;\">the CLI holds the rules<\u002Fp>\n<p style=\"margin: 0;\">the agents do the work<\u002Fp>\n<\u002Fdiv>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; margin: 0; color: color-mix(in srgb, var(--color-text) 60%, transparent);\">MIT licence · v1.0.0<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;defaultTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;why&quot;,&quot;harness&quot;,&quot;run&quot;,&quot;first-hour&quot;,&quot;deep-dive&quot;,&quot;compare&quot;],&quot;default&quot;:&quot;why&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;defaultStrict&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;stepInterval&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1200,&quot;min&quot;:400,&quot;max&quot;:3000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    tab: 'why', theme: 'light', tip: '',\n    lens: false, drawer: null,\n    step: 0, strict: false, isolate: false, solo: false,\n    haltStage: 'all', adj: 0\n  };\n\n  TABS = ['why', 'harness', 'run', 'first-hour', 'deep-dive', 'compare'];\n\n  TIPS = {\n    bootstrap: 'bootstrap — Once per repo. Reads the code, writes an architecture doc and one spec per existing feature. Never modifies source.',\n    spec: 'spec — Explore, then OpenSpec artifacts, then an artifact review. Stops having written specs and no code.',\n    checkpoint: 'You read the spec — Ten minutes. Four files, one question each. The only required stop. A spec is the cheapest place to catch a wrong idea.',\n    ship: 'ship — Waves → verify → commit. A dynamic workflow: the runtime takes no mid-run input, so it cannot ask you anything.',\n    mr: 'mr — The merge request, when you want it. Ends by reminding you to archive the change.'\n  };\n\n  LAYERS = {\n    'cc-host': { label: 'Claude Code', lens: '', owns: 'The Skill tool, the slash namespace, hook dispatch, the agent ceilings (16 concurrent, 1000 per run)', no: '—', path: 'external, v2.1.154+' },\n    'slash': { label: '/interlock:bootstrap · spec · ship · mr', lens: '', owns: 'The four commands that are the product', no: '—', path: '.claude-plugin/plugin.json' },\n    'workflow-rt': { label: 'Workflow runtime', lens: 'code', owns: 'Zero-touch: it accepts no mid-run user input', no: 'import(), the filesystem, a shell', path: 'external' },\n    'subagents': { label: 'interlock:worker · interlock:ping', lens: 'model', owns: 'Isolated context per lane; reading, writing, running commands', no: 'Skill, Agent, mcp__*', path: 'agents/worker.md, agents/ping.md' },\n    'path-inject': { label: 'plugin bin/ on the PATH', lens: 'code', owns: 'Making interlock and interlock-graph bare commands', no: '—', path: 'host behaviour' },\n    'hooks': { label: 'four hooks: one preflight, three guards', lens: 'code', owns: 'Denying a test edit during repair, a checkbox flip, an out-of-stage commit', no: 'Blocking on anything it cannot establish', path: 'hooks/*.mjs' },\n    'skills': { label: 'sixteen SKILL.md', lens: 'model', owns: 'Judgement framing; model-facing instruction', no: 'Restating any numeric threshold', path: 'skills/' },\n    'ship-js': { label: 'workflows/ship.js', lens: 'code', owns: 'Spawning what a step names, the CLI relay, briefing by reference, the token counter', no: 'Branching on a flag, a mode, a count or a verdict', path: 'workflows/ship.js' },\n    'runner': { label: 'bin/interlock-run (experimental)', lens: 'code', owns: 'The same loop over a vendor CLI; lane worktrees; banners', no: 'The same, plus holding any rule', path: 'bin/interlock-run' },\n    'run-mjs': { label: 'lib/run.mjs, the run program', lens: 'code', owns: 'Emitting every step; taking every branch', no: 'Spawning, printing, importing a transport', path: 'lib/run.mjs' },\n    'lib': { label: 'thirty-six pure decision modules', lens: 'code', owns: 'One concern each: waves, verify, findings, remediate, risk, ready, ledger, drift, receipt', no: \"I/O beyond what the module's name implies\", path: 'lib/*.mjs' },\n    'prompts': { label: 'lib/prompts/', lens: 'code', owns: 'Every briefing an agent receives', no: 'Being unregistered; the suite fails', path: 'lib/prompts/' },\n    'limits': { label: 'lib/limits.mjs', lens: 'code', owns: 'Every cap, once', no: 'A cap with no reader', path: 'lib/limits.mjs' },\n    'cli': { label: 'bin/interlock', lens: 'code', owns: 'Twenty-eight subcommands; exit codes are the contract', no: 'A model or the network, except notify', path: 'bin/interlock' },\n    'graph-cli': { label: 'interlock-graph', lens: 'code', owns: 'A deterministic import, symbol and spec graph with token-budgeted retrieval', no: 'Embeddings, a vector store, the network', path: 'bin/interlock-graph, lib/graph/' },\n    'report': { label: 'interlock report', lens: 'code', owns: 'Indicators over the corpora, each with its denominator', no: 'Any verdict; any write', path: 'lib/report.mjs' },\n    'hostport': { label: 'lib/host.mjs', lens: 'code', owns: 'Three operations: spawn, mapPipeline, runCli', no: 'A fourth operation', path: 'lib/host.mjs' },\n    'registry': { label: 'lib/host/registry.mjs', lens: 'code', owns: 'Seven capability declarations per adapter', no: 'An adapter missing a key', path: 'lib/host/registry.mjs' },\n    'adapters': { label: 'claude · acp · codex · qwen', lens: 'code', owns: 'A transport plus a declaration of what the host cannot do', no: 'Wave order, verify judgement, limits, the gate', path: 'lib/host/*.mjs' },\n    'openspec': { label: 'the openspec CLI and openspec/', lens: 'code', owns: 'Artifact formats, templates, validation, the change lifecycle, archive', no: '—', path: 'openspec/' },\n    'stage': { label: 'the stage marker', lens: '', owns: 'The only channel from a run to a hook', no: 'Being written by a driver', path: '.claude/ship/<change>/stage.json' },\n    'runstate': { label: 'run state, briefings, worktrees, spill', lens: '', owns: 'The manifest, the cursor, every briefing with its hash, lane trees', no: '—', path: '.claude/ship/' },\n    'corpora': { label: 'trajectory · outcomes · review metrics · receipt · ledger', lens: '', owns: 'The audit trail', no: 'Deciding anything', path: '.claude/ship/runs/, .claude/learning/, .claude/metrics/' }\n  };\n\n  EDGES = [\n    ['cc-host', 'slash', 'exposes'], ['cc-host', 'path-inject', 'injects'], ['cc-host', 'hooks', 'runs, one process per tool call'],\n    ['slash', 'skills', 'invokes'], ['skills', 'workflow-rt', 'ship launches, once'], ['workflow-rt', 'ship-js', 'executes'],\n    ['ship-js', 'subagents', 'spawns what a step names'], ['ship-js', 'cli', 'shells out, through a ping'],\n    ['runner', 'adapters', 'spawns through'], ['runner', 'cli', 'shells out'],\n    ['cli', 'run-mjs', 'dispatches run *'], ['cli', 'lib', 'dispatches every other subcommand'],\n    ['run-mjs', 'ship-js', 'emits step'], ['run-mjs', 'runner', 'emits step, the same program'], ['run-mjs', 'lib', 'calls'],\n    ['run-mjs', 'prompts', 'assembles briefings'], ['run-mjs', 'runstate', 'writes manifest, state, briefings with sha256'],\n    ['run-mjs', 'corpora', 'writes trajectory, receipt, outcome'], ['run-mjs', 'stage', 'clears on every terminal path'],\n    ['subagents', 'stage', 'publishes; the agent holds the live pid'], ['hooks', 'stage', 'reads'], ['hooks', 'subagents', 'denies'],\n    ['hooks', 'cli', 'session start runs interlock doctor'], ['lib', 'limits', 'reads every cap'],\n    ['skills', 'cli', 'cites interlock limits, never restates a number'],\n    ['runner', 'registry', 'creates the host, reads its capabilities'], ['registry', 'adapters', 'declares what each cannot do'],\n    ['adapters', 'hostport', 'implement'], ['skills', 'openspec', 'drives: new change, status --json, instructions'],\n    ['run-mjs', 'openspec', \"reads the change's artifacts\"], ['skills', 'graph-cli', 'queries, token-budgeted'],\n    ['report', 'corpora', 'reads'], ['path-inject', 'cli', 'makes it a bare command'], ['runner', 'runstate', 'creates lane worktrees']\n  ];\n\n  componentDidMount() {\n    this._onHash = () => this.syncHash();\n    window.addEventListener('hashchange', this._onHash);\n    if (!location.hash && this.props.defaultTab) this.setState({ tab: this.props.defaultTab });\n    if (this.props.defaultStrict) this.setState({ strict: true });\n    this.syncHash();\n    let saved = null;\n    try { saved = localStorage.getItem('interlock-theme'); } catch (e) { saved = null; }\n    const dark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);\n    this.setState({ theme: dark ? 'dark' : 'light' });\n    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');\n    this.restoreChecks();\n    this.paint();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this._onHash);\n    clearInterval(this._timer);\n  }\n\n  componentDidUpdate() { this.paint(); }\n\n  syncHash() {\n    const h = (location.hash || '').replace('#', '');\n    if (this.TABS.indexOf(h) >= 0 && h !== this.state.tab) this.setState({ tab: h });\n  }\n\n  root() { return this._root; }\n\n  paint() {\n    const r = this._root;\n    if (!r) return;\n    r.querySelectorAll('[data-tab]').forEach((b) => {\n      const on = b.dataset.tab === this.state.tab;\n      b.style.borderBottomColor = on ? 'var(--color-accent)' : 'transparent';\n      b.style.opacity = on ? '1' : '0.6';\n      b.style.fontWeight = on ? '700' : '400';\n    });\n    r.querySelectorAll('[data-layer-node]').forEach((n) => {\n      const id = n.dataset.layerNode;\n      const meta = this.LAYERS[id] || {};\n      const sel = this.state.drawer === id;\n      if (this.state.lens && meta.lens) {\n        n.style.outline = '2px ' + (meta.lens === 'model' ? 'dotted' : 'solid') + ' var(--color-accent)';\n        n.style.outlineOffset = '-2px';\n      } else {\n        n.style.outline = 'none';\n      }\n      n.style.background = sel ? 'var(--color-accent)' : 'var(--color-surface)';\n      n.style.color = sel ? '#ffffff' : 'var(--color-text)';\n    });\n    const sc = this.script();\n    const cur = sc[Math.min(this.state.step, sc.length - 1)];\n    const visited = new Set(sc.slice(0, this.state.step + 1).map((s) => s.node));\n    r.querySelectorAll('[data-sm]').forEach((g) => {\n      const id = g.dataset.sm;\n      const strictOnly = g.dataset.strictOnly === '1';\n      const isolateOnly = g.dataset.isolateOnly === '1';\n      let op = 1;\n      if (strictOnly && !this.state.strict) op = 0.3;\n      if (isolateOnly && !this.state.isolate) op = 0.3;\n      g.setAttribute('opacity', String(op));\n      const box = g.querySelector('rect');\n      if (!box) return;\n      const halt = g.dataset.kind === 'halt';\n      const isCur = this.state.step > 0 && cur && cur.node === id;\n      const seen = this.state.step > 0 && visited.has(id);\n      box.setAttribute('fill', isCur ? 'var(--color-accent)' : (halt ? 'transparent' : 'var(--color-surface)'));\n      box.setAttribute('stroke', isCur || halt ? 'var(--color-accent)' : 'var(--color-divider)');\n      box.setAttribute('stroke-width', isCur || halt ? '2' : '1.5');\n      const t = g.querySelectorAll('text');\n      t.forEach((tx) => {\n        tx.setAttribute('fill', isCur ? '#ffffff' : (halt ? 'var(--color-accent)' : 'var(--color-text)'));\n        tx.setAttribute('opacity', !isCur && this.state.step > 0 && !seen ? '0.55' : '1');\n      });\n      if (this.state.haltNode === id) {\n        box.setAttribute('fill', 'var(--color-accent)');\n        box.setAttribute('stroke', 'var(--color-accent)');\n        g.querySelectorAll('text').forEach((tx) => tx.setAttribute('fill', '#ffffff'));\n      }\n    });\n    r.querySelectorAll('[data-state-row]').forEach((row) => {\n      const on = row.dataset.stateRow === this.state.selState;\n      row.style.background = on ? 'var(--color-accent-100)' : 'transparent';\n      row.style.boxShadow = on ? 'inset 3px 0 0 var(--color-accent)' : 'none';\n    });\n  }\n\n  selectTab = (e) => {\n    const id = e.currentTarget.dataset.tab;\n    location.hash = id;\n    this.setState({ tab: id }, () => {\n      const el = this._root && this._root.querySelector('#panel-' + id);\n      if (el) this.scrollTo(el); else window.scrollTo({ top: 0 });\n    });\n  };\n\n  onTabKey = (e) => {\n    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;\n    e.preventDefault();\n    const i = this.TABS.indexOf(this.state.tab);\n    const n = (i + (e.key === 'ArrowRight' ? 1 : this.TABS.length - 1)) % this.TABS.length;\n    const id = this.TABS[n];\n    location.hash = id;\n    this.setState({ tab: id });\n    const b = this._root && this._root.querySelector('[data-tab=\"' + id + '\"]');\n    if (b) b.focus();\n  };\n\n  goTab(id, anchorRef) {\n    location.hash = id;\n    this.setState({ tab: id }, () => {\n      if (anchorRef && this[anchorRef]) this.scrollTo(this[anchorRef]);\n      else { const el = this._root && this._root.querySelector('#panel-' + id); if (el) this.scrollTo(el); else window.scrollTo({ top: 0 }); }\n    });\n  }\n\n  scrollTo(el) {\n    if (!el) return;\n    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' });\n  }\n\n  tipOn = (e) => this.setState({ tip: this.TIPS[e.currentTarget.dataset.flow] || '' });\n  tipOff = () => this.setState({ tip: '' });\n  flowClick = (e) => {\n    const f = e.currentTarget.dataset.flow;\n    if (f === 'ship') this.goTab('run');\n    else this.goTab('first-hour', '_checkpointEl');\n  };\n\n  goInstall = () => this.scrollTo(this._install);\n\n  toggleTheme = () => {\n    const next = this.state.theme === 'dark' ? 'light' : 'dark';\n    this.setState({ theme: next });\n    document.documentElement.setAttribute('data-theme', next);\n    try { localStorage.setItem('interlock-theme', next); } catch (e) { /* ignore */ }\n  };\n\n  copy = (e) => {\n    const panel = e.currentTarget.closest('[data-copy]');\n    const pre = panel && panel.querySelector('pre');\n    if (!pre) return;\n    const btn = e.currentTarget;\n    const done = () => { btn.textContent = 'COPIED'; setTimeout(() => { btn.textContent = 'COPY'; }, 1400); };\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(pre.textContent).then(done, () => this.selectText(pre));\n    } else this.selectText(pre);\n  };\n\n  selectText(el) {\n    const rng = document.createRange();\n    rng.selectNodeContents(el);\n    const sel = window.getSelection();\n    sel.removeAllRanges();\n    sel.addRange(rng);\n  }\n\n  toggleLens = () => this.setState({ lens: !this.state.lens });\n  pickNode = (e) => this.setState({ drawer: e.currentTarget.dataset.layerNode });\n  closeDrawer = () => this.setState({ drawer: null });\n\n  restoreChecks() {\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem('interlock-first-hour') || '{}'); } catch (e) { saved = {}; }\n    const r = this._root;\n    if (!r) return;\n    r.querySelectorAll('[data-check]').forEach((c) => { c.checked = !!saved[c.dataset.check]; });\n  }\n\n  onCheck = (e) => {\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem('interlock-first-hour') || '{}'); } catch (err) { saved = {}; }\n    saved[e.currentTarget.dataset.check] = e.currentTarget.checked;\n    try { localStorage.setItem('interlock-first-hour', JSON.stringify(saved)); } catch (err) { /* ignore */ }\n  };\n\n  toggleReveal = (e) => {\n    const t = e.currentTarget.parentNode.querySelector('[data-reveal]');\n    if (t) t.hidden = !t.hidden;\n  };\n\n  toggleAccordion = (e) => {\n    const item = e.currentTarget.parentNode;\n    const body = item.querySelector('[data-reveal]');\n    const open = body.hidden;\n    const li
