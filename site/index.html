5px; line-height: 1.7; overflow-x: auto;\">npm install -g @fission-ai/openspec@latest\ncd your-project &amp;&amp; openspec init\n/plugin marketplace add renzrollon/interlock\n/plugin install interlock@interlock<\u002Fpre>\n<\u002Fdiv>\n<p style=\"margin: 0; max-width: 70ch;\">Interlock drives the <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec<\u002Fcode> CLI; it does not replace it. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec init<\u002Fcode> creates <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec/<\u002Fcode> and installs OpenSpec's own skills, which stay available beside Interlock's.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 20px 24px; padding: 24px 0; border-top: 1px solid var(--color-divider);\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; color: var(--color-accent); margin: 0;\">min 2–5<\u002Fp>\n<div>\n<label class=\"radio\" style=\"align-items: flex-start; margin-bottom: 12px;\"><input type=\"checkbox\" data-check=\"s2\" sc-camel-on-change=\"{{ onCheck }}\"><span class=\"dot\" style=\"margin-top: 4px;\"><\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.2;\">Allowlist the commands<\u002Fspan><\u002Flabel>\n<div data-copy=\"t2\" style=\"background: var(--color-surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;\">\n<button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ copy }}\" style=\"align-self: flex-start; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em;\">COPY<\u002Fbutton>\n<pre style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto;\">interlock doctor<\u002Fpre>\n<\u002Fdiv>\n<p style=\"margin: 0 0 14px; max-width: 74ch;\">Workflow agents inherit your permission settings, so a command that is not allowlisted stops the run on an approval prompt, possibly while you are away. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">doctor<\u002Fcode> derives the required list from what the flow shells out to plus whatever your own test profile runs, exits 1 when something would stop an unattended run, prints the settings snippet that fixes it, and changes nothing itself. The same check runs at every session start as an advisory hook.<\u002Fp>\n<pre style=\"margin: 0; background: var(--color-surface); padding: 16px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.65; overflow-x: auto;\">PREFLIGHT OK — 8 passed\n  [ok  ] node: Node v24.16.0 (plugin requires &gt;=18, OpenSpec requires 20.19.0+)\n  [ok  ] plugin: plugin 1.0.0 complete: workflow, both agent types, both binaries\n  [ok  ] binaries: interlock and interlock-graph resolve on PATH\n  [ok  ] openspec: openspec CLI available and this project is initialised\n  [ok  ] git: git version 2.54.0 in a work tree\n  [ok  ] test-profile: unit suite: npm test\n  [ok  ] permissions: all 9 required commands are allowed\n  [ok  ] state-dirs: every run-state directory is writable or creatable\n  [skip] notify: INTERLOCK_NTFY_TOPIC is not set — optional; an unattended run that stops will not reach you\n  [skip] prompt-cache: a prompt-cache lifetime is unset, so its bucket runs on the host default\n  [skip] evals-harness: CLAUDE_CODE_WALNUT_SPIRE is not set<\u002Fpre>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 20px 24px; padding: 24px 0; border-top: 1px solid var(--color-divider);\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; color: var(--color-accent); margin: 0;\">min 5–20<\u002Fp>\n<div>\n<label class=\"radio\" style=\"align-items: flex-start; margin-bottom: 12px;\"><input type=\"checkbox\" data-check=\"s3\" sc-camel-on-change=\"{{ onCheck }}\"><span class=\"dot\" style=\"margin-top: 4px;\"><\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.2;\">Onboard the repo, once<\u002Fspan><\u002Flabel>\n<div data-copy=\"t3\" style=\"background: var(--color-surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;\">\n<button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ copy }}\" style=\"align-self: flex-start; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em;\">COPY<\u002Fbutton>\n<pre style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto;\">/interlock:bootstrap<\u002Fpre>\n<\u002Fdiv>\n<p style=\"margin: 0; max-width: 74ch;\">Initialises OpenSpec if the repo never was, builds the code graph, fans out five read-only explorers phrased in your stack's vocabulary, and writes <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec/initial-architecture.md<\u002Fcode> plus one spec per feature that already exists. It confirms the feature list with you first, never overwrites an existing spec, and never modifies source. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--quick<\u002Fcode> on a small repo, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--scope packages/api<\u002Fcode> on a monorepo. If the repo is Go, Rust, Java or Ruby, expect <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">GRAPH UNAVAILABLE: nothing indexable found<\u002Fcode>; that is the ordinary case, not a defect. Structural indexing covers JavaScript/TypeScript, Python and shell. Nothing in the loop requires the graph.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 20px 24px; padding: 24px 0; border-top: 1px solid var(--color-divider);\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; color: var(--color-accent); margin: 0;\">min 20–30<\u002Fp>\n<div>\n<label class=\"radio\" style=\"align-items: flex-start; margin-bottom: 12px;\"><input type=\"checkbox\" data-check=\"s4\" sc-camel-on-change=\"{{ onCheck }}\"><span class=\"dot\" style=\"margin-top: 4px;\"><\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.2;\">Spec one small change<\u002Fspan><\u002Flabel>\n<div data-copy=\"t4\" style=\"background: var(--color-surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;\">\n<button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ copy }}\" style=\"align-self: flex-start; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em;\">COPY<\u002Fbutton>\n<pre style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto;\">/interlock:spec add a --json flag to the report command<\u002Fpre>\n<\u002Fdiv>\n<p style=\"margin: 0 0 14px; max-width: 74ch;\">Pick something genuinely small: one endpoint, one flag, one bug with a known repro. It explores first, drives the OpenSpec CLI to produce the artifacts, then reviews them. It writes:<\u002Fp>\n<pre style=\"margin: 0 0 14px; background: var(--color-surface); padding: 16px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto;\">openspec/changes/&lt;change-name&gt;/\n├── proposal.md      what and why\n├── design.md        how, and the decisions taken\n├── tasks.md         ordered checkbox tasks — this is the wave plan\n├── decisions.md     the decision ledger (Interlock's addition)\n└── specs/**         delta specs, Given/When/Then<\u002Fpre>\n<p style=\"margin: 0; max-width: 74ch;\">Then it stops, having written no code. If you asked for a bug fix, it refuses to create anything until you give it real error output and a reproduction. That gate is deliberate.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 20px 24px; padding: 24px 0; border-top: 1px solid var(--color-divider);\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; color: var(--color-accent); margin: 0;\">min 30–40<\u002Fp>\n<div>\n<label class=\"radio\" style=\"align-items: flex-start; margin-bottom: 12px;\"><input type=\"checkbox\" data-check=\"s5\" sc-camel-on-change=\"{{ onCheck }}\"><span class=\"dot\" style=\"margin-top: 4px;\"><\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.2;\">Read the spec<\u002Fspan><\u002Flabel>\n<p style=\"margin: 0; max-width: 74ch;\">The checkpoint. See the table below. Two cheap machine checks that do not replace reading: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec validate<\u002Fcode> and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock validate &lt;change-name&gt;<\u002Fcode>. Ship runs the second one first and refuses to start on a failure.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 20px 24px; padding: 24px 0; border-top: 1px solid var(--color-divider);\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; color: var(--color-accent); margin: 0;\">min 40–55<\u002Fp>\n<div>\n<label class=\"radio\" style=\"align-items: flex-start; margin-bottom: 12px;\"><input type=\"checkbox\" data-check=\"s6\" sc-camel-on-change=\"{{ onCheck }}\"><span class=\"dot\" style=\"margin-top: 4px;\"><\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.2;\">Ship it<\u002Fspan><\u002Flabel>\n<div data-copy=\"t6\" style=\"background: var(--color-surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;\">\n<button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ copy }}\" style=\"align-self: flex-start; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em;\">COPY<\u002Fbutton>\n<pre style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto;\">/interlock:ship<\u002Fpre>\n<\u002Fdiv>\n<p style=\"margin: 0 0 14px; max-width: 74ch;\">Runs start-to-commit without asking anything. Before a single implementer spawns it prints the plan: waves, lanes, the model per task, every clamp and every fold. At the end it prints one summary, always ending in a degradation block. Useful flags for a first run: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--no-commit<\u002Fcode> to see the diff before git touches it, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--apply-only<\u002Fcode> to stop after the waves, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--strict<\u002Fcode> to see what the review and the bill look like.<\u002Fp>\n<pre style=\"margin: 0; background: var(--color-surface); padding: 16px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.65; overflow-x: auto;\">SHIP COMPLETE — add-json-flag\n  PLAN REBUILT (no-plan): no stored plan at .claude/ship/plan.json\n  wave 1 (run-batch): 3 ok, 0 failed\n  wave 2 (run-batch): 2 ok, 0 failed\n  wave ? (test-wave): 2 ok, 0 failed\n  commit: 4a91c0e\n  run: 7f2c1b8e-3d4a-4c11-9e02-5b6a7c8d9e01\n  project: -Users-you-src-yourrepo\n  cwd: /Users/you/src/yourrepo\nARCHIVE PENDING — add-json-flag: after merge, run openspec archive add-json-flag\nDo not start another ship run unless the user asks.\n\nLEAN SHIP: skipped review, handoff, conformance — pass --review / --handoff / --strict to enable\nNo degradation banners — graph, test profile, model routing, verification and e2e were all clean.\nGOAL MET: interlock ship returned a terminal summary.<\u002Fpre>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 20px 24px; padding: 24px 0; border-top: 1px solid var(--color-divider); border-bottom: 2px solid var(--color-divider);\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.1em; color: var(--color-accent); margin: 0;\">min 55–60<\u002Fp>\n<div>\n<label class=\"radio\" style=\"align-items: flex-start; margin-bottom: 12px;\"><input type=\"checkbox\" data-check=\"s7\" sc-camel-on-change=\"{{ onCheck }}\"><span class=\"dot\" style=\"margin-top: 4px;\"><\u002Fspan><span style=\"font-family: var(--font-heading); font-weight: 800; font-size: 22px; line-height: 1.2;\">Merge request, then archive<\u002Fspan><\u002Flabel>\n<div data-copy=\"t7\" style=\"background: var(--color-surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;\">\n<button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ copy }}\" style=\"align-self: flex-start; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em;\">COPY<\u002Fbutton>\n<pre style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; overflow-x: auto;\">/interlock:mr --create              # detects GitLab or GitHub from the remote\nopenspec archive &lt;change-name&gt;      # after it merges. Stock OpenSpec; Interlock does not wrap it.<\u002Fpre>\n<\u002Fdiv>\n<p style=\"margin: 0; max-width: 74ch;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec archive<\u002Fcode> folds the change's delta specs into the living specs, so the next <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec<\u002Fcode> plans against what is now true. Interlock never archives for you. It prints <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">ARCHIVE PENDING<\u002Fcode> and counts the backlog in <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock drift<\u002Fcode>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<p style=\"margin: 20px 0 0; font-size: 14px; color: color-mix(in srgb, var(--color-text) 62%, transparent); max-width: 84ch;\"><strong>Do not run these yet:<\u002Fstrong> <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">dispatch, graph, docs-digest, explore, review-artifacts, review-code, fix-tests, manual-test-plan, explain-code, commit, spec --continue<\u002Fspan>. Every one is either called by the four commands above or is a recovery tool. “Skipping the read before you have done it once is skipping the part of the loop that earns the rest.”<\u002Fp>\n<\u002Fdiv>\n\n<div ref=\"{{ checkpointRef }}\" style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 16px;\">You read the spec. That is the whole ask.<\u002Fh2>\n<p style=\"max-width: 68ch; margin: 0 0 24px;\">A wrong idea costs a paragraph here and a day after shipping. Read cheapest-to-reject first.<\u002Fp>\n<div style=\"overflow-x: auto;\">\n<sc-raw-table class=\"table\" style=\"min-width: 780px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 90px;\">Minutes<\u002Fsc-raw-th><sc-raw-th style=\"width: 130px;\">File<\u002Fsc-raw-th><sc-raw-th>The one question you are answering<\u002Fsc-raw-th><sc-raw-th>Red flags<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">0–2<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">proposal.md<\u002Fsc-raw-td><sc-raw-td>Is this the change I asked for?<\u002Fsc-raw-td><sc-raw-td>A change name broader than the request. Work nobody asked for. A bug fix that grew a refactor.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">2–5<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">design.md<\u002Fsc-raw-td><sc-raw-td>Would I have made these decisions?<\u002Fsc-raw-td><sc-raw-td>An abstraction for a single caller. A decision with no rationale. A dependency named without a version. “We'll handle X later” where X is the hard part.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">5–8<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">tasks.md<\u002Fsc-raw-td><sc-raw-td>Could someone else do this without asking me anything?<\u002Fsc-raw-td><sc-raw-td>“update accordingly”, “handle edge cases”, “refactor as needed”, “etc.” Consecutive checkboxes naming the same file.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">8–10<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">specs/**<\u002Fsc-raw-td><sc-raw-td>Does this describe behaviour I can verify?<\u002Fsc-raw-td><sc-raw-td>“should work correctly”. Missing empty, error, loading, boundary and permission-denied cases.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2px; margin-top: 24px;\">\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Wrong idea:<\u002Fstrong> re-run <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec<\u002Fcode> with a sharper intent and an explicit out-of-scope boundary.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Right idea, wrong approach:<\u002Fstrong> say what you want instead and re-spec. The explore brief is reused, so the second pass is fast.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Right idea, small gaps:<\u002Fstrong> edit <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">design.md<\u002Fcode> or <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">tasks.md<\u002Fcode> by hand. Plain markdown; ship reads whatever is on disk.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 18px; margin: 0; font-size: 14.5px;\"><strong>Looks right:<\u002Fstrong> <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship<\u002Fcode>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px;\">\n<div>\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(24px, 3vw, 34px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 12px;\">Every question the loop can ask you.<\u002Fh2>\n<p style=\"margin: 0 0 20px; font-size: 15px;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec<\u002Fcode> is conversational where it has to be. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">ship<\u002Fcode> is not, and cannot be.<\u002Fp>\n<sc-raw-table class=\"table\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 96px;\">When<\u002Fsc-raw-th><sc-raw-th>The question<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec<\u002Fsc-raw-td><sc-raw-td>What change do you want to work on? <span style=\"opacity: 0.6;\">— the request is not clear enough to name a change.<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec<\u002Fsc-raw-td><sc-raw-td>Real log output or the error message, <strong>and<\u002Fstrong> a reproduction. <span style=\"opacity: 0.6;\">— the request is a bug fix. No artifact is created until both exist. “A repro is required so the fix has a pass/fail signal; without it we are fixing a symptom.”<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec<\u002Fsc-raw-td><sc-raw-td>Which version of this dependency? <span style=\"opacity: 0.6;\">— the design names one without a version. A plausible-looking wrong pin is worse than an open question.<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec<\u002Fsc-raw-td><sc-raw-td>Test-first or implementation-first? <span style=\"opacity: 0.6;\">— <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--tdd<\u002Fcode> and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--no-tdd<\u002Fcode> were both passed.<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec<\u002Fsc-raw-td><sc-raw-td>Continue the existing change or start a new one? <span style=\"opacity: 0.6;\">— a change with that name already exists.<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec --continue<\u002Fsc-raw-td><sc-raw-td>“Continuity paused — N decisions need you”, listing only the ledger rows and blockers. <span style=\"opacity: 0.6;\">— <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock ready<\u002Fcode> exited 1. The last place a question is possible.<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">bootstrap<\u002Fsc-raw-td><sc-raw-td>Generate specs for all discovered features, or select some? <span style=\"opacity: 0.6;\">— always, before generating.<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">bootstrap<\u002Fsc-raw-td><sc-raw-td>This project already has N specs; add specs for undocumented features without overwriting any? <span style=\"opacity: 0.6;\">— <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec/specs/<\u002Fcode> is non-empty.<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">fix-tests<\u002Fsc-raw-td><sc-raw-td>At most four questions, once: the unit command, the single-file filter syntax, required environment, the e2e command. <span style=\"opacity: 0.6;\">— first run or <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--reconfigure<\u002Fcode>. The only skill permitted to interview you about tests.<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">mr<\u002Fsc-raw-td><sc-raw-td>GitLab or GitHub? <span style=\"opacity: 0.6;\">— only when both or neither of <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">glab<\u002Fcode> and <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">gh<\u002Fcode> resolve.<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">mr<\u002Fsc-raw-td><sc-raw-td>Overwrite this description? <span style=\"opacity: 0.6;\">— it contains hand-written prose.<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div>\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(24px, 3vw, 34px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 12px;\">Never asked, because a CLI already decided.<\u002Fh2>\n<p style=\"margin: 0 0 20px; font-size: 15px;\">Read the values from <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock limits<\u002Fcode>. The page does not restate a threshold as its own rule.<\u002Fp>\n<sc-raw-table class=\"table\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Never asked<\u002Fsc-raw-th><sc-raw-th style=\"width: 220px;\">Decided by<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>How many agents run in parallel<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock waves<\u002Fcode>, from the published cap<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>How many tasks one agent's lane may hold<\u002Fsc-raw-td><sc-raw-td>the lane-cap table, keyed by the lane's hardest task tier<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Which model and reasoning effort each task earns<\u002Fsc-raw-td><sc-raw-td>the tier ladder; opus is clamped to sonnet below tier 5 and every clamp is printed<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Whether two tasks may share a batch<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock waves<\u002Fcode>, on canonical-path collision<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>How many remediation rounds, root-cause repairs, replans, inter-wave fix attempts, task failures<\u002Fsc-raw-td><sc-raw-td>the caps, each with one reader in the loop<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Whether a review finding survives<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock review<\u002Fcode>: a dismissal needs a <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">file:line<\u002Fcode> inside the diff<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Which findings are too weak to report<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock gate<\u002Fcode>'s quality band, in the CLI, never in the review prose<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Whether a review blocks<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock gate<\u002Fcode>: the exit status is the verdict<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Whether a diff needs a manual test plan<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock surface<\u002Fcode><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Whether a change may skip the checkpoint<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock ready<\u002Fcode>, fail-closed: a check that could not run is a blocker<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>The blast radius of a change<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock risk<\u002Fcode>: the maximum over every signal, never an average<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Which checkboxes may be ticked<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock tasks tick<\u002Fcode>, keyed off recorded outcomes; a hand edit is denied by a hook<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Whether the plan dropped a checkbox<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock tasks coverage<\u002Fcode>; an omitted box halts<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Whether a run can be reconstructed<\u002Fsc-raw-td><sc-raw-td><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock run-log check<\u002Fcode>; an unreplayable trajectory halts a clean run<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Whether a <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">REVIEW.md<\u002Fcode> may move the bar<\u002Fsc-raw-td><sc-raw-td>it may change scope and advice; a threshold-shaped key is reported and ignored<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 16px;\">From prompt to workflow.<\u002Fh2>\n<p style=\"max-width: 70ch; margin: 0 0 28px;\">You type instructions into a chat box and get code back. That is your whole model of working with an LLM, and it works. This section assumes exactly that and nothing more. By the end you will know why <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship<\u002Fcode> is a JavaScript file instead of a prompt, and why that is the entire point.<\u002Fp>\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 12px;\">Fifteen terms — click one for its definition<\u002Fp>\n<ol style=\"margin: 0 0 36px; padding-left: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2px 24px;\">\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">prompt<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">Text you send the model, hoping for the right thing back.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">harness<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">The program that gathers files, sends them with your prompt, and applies what comes back. Claude Code itself.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">context window<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">The fixed amount of text a model can see at one time.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">tool-use loop<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">The model asking the harness to act, reading the result, and going again.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">skill<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">Instructions in a markdown file that the model reads and follows.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">subagent<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">A fresh model instance with an empty context window and one task.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">orchestrator<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">Whatever spawns the subagents and decides what happens next.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">workflow<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">A script a runtime executes, which calls the model as a step inside itself.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">workflow runtime<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">The part of Claude Code that runs that script and accepts no user input while it does.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">CLI<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">A terminal program that prints an answer and exits with a number.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">exit code<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">That number. Zero means fine; anything else means stop.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">wave<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">A set of tasks that must finish before the next set starts.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">batch<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">A slice of one wave that runs simultaneously, capped.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">tier<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">How much spec context and which model a task earns, one to five.<\u002Fp><\u002Fli>\n<li style=\"padding: 8px 0; border-bottom: 1px solid var(--color-divider);\"><button type=\"button\" sc-camel-on-click=\"{{ toggleReveal }}\" style=\"background: none; border: 0; padding: 0; font: inherit; font-weight: 700; color: var(--color-accent); cursor: pointer;\">checkpoint<\u002Fbutton><p data-reveal=\"1\" hidden=\"hidden\" style=\"margin: 6px 0 0; font-size: 15px;\">The single deliberate stop, between spec and ship.<\u002Fp><\u002Fli>\n<\u002Fol>\n\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 24px; margin: 0 0 16px;\">The three failures prompting hits, in order.<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2px; margin-bottom: 36px;\">\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 15px;\"><strong>1. The clipboard runs out.<\u002Fstrong> A forty-file change plus its plan plus its test output does not fit in one context window, and it degrades before it overflows. The model does not warn you when it starts skimming.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 15px;\"><strong>2. The plan gets forgotten while it is being carried out.<\u002Fstrong> Forty minutes in, the plan is thirty turns back, competing with stack traces. An agent that was tracking three constraints is now tracking one, and it will not tell you which two it dropped. It does not know either.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 15px;\"><strong>3. A rule written in a prompt is a suggestion.<\u002Fstrong> Write “cap remediation at two rounds” into a prompt. Now imagine the situation the cap exists for: forty minutes in, two rounds have not fixed it, and it is close. Ask the model whether it has earned a third round. It will say yes. It will be articulate about why. It is not lying to you; it is reasoning from inside the situation the cap exists to constrain.<\u002Fp>\n<\u002Fdiv>\n<ul style=\"margin: 0 0 28px; padding-left: 20px; max-width: 78ch; display: flex; flex-direction: column; gap: 10px; font-size: 16px;\">\n<li>A <strong>skill<\u002Fstrong> answers none of them. Instructions the model follows are instructions it can also decide not to follow, for reasons that will sound good at the time.<\u002Fli>\n<li>A <strong>subagent<\u002Fstrong> answers the first. Instead of walking every room yourself with one clipboard, you hire one contractor per room.<\u002Fli>\n<li>A <strong>workflow<\u002Fstrong> answers the second and third at once. The plan cannot be forgotten because it is not in anyone's memory; it is the control flow. A cap cannot be argued past because there is nothing there to argue with.<\u002Fli>\n<\u002Ful>\n<p style=\"max-width: 74ch; margin: 0 0 32px;\">The fourth piece, why a rule goes in a CLI: a CLI prints an answer and exits with a number, and the number is the part that matters. The script branches on the exit code and on named fields, never on a sentence the model composed. Two payoffs: you can run the same command yourself, no model, no network, and see the same decision the run made; and the rule cannot be quietly re-argued next run, because it is not written anywhere a model can read and reinterpret, only somewhere a model can call.<\u002Fp>\n<blockquote style=\"margin: 0; border-left: 4px solid var(--color-accent); padding-left: 24px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(19px, 2.4vw, 26px); line-height: 1.3; letter-spacing: -0.02em; max-width: 34ch;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:spec<\u002Fcode> is a skill. It can ask you questions, because a skill runs inside a conversation and there is a person on the other end of it. Then you read the spec. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship<\u002Fcode> is a workflow. It cannot ask you anything. Every tool in this category promises autonomy in a prompt; this one gets it from the shape of the thing it runs on.<\u002Fblockquote>\n<\u002Fdiv>\n\n<div style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(26px, 3.6vw, 40px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 24px;\">The order for four kinds of work.<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2px;\">\n<div style=\"background: var(--color-surface); padding: 22px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px; margin: 0 0 12px;\">A feature<\u002Fh3>\n<ol style=\"margin: 0; padding-left: 20px; font-size: 15px; display: flex; flex-direction: column; gap: 6px;\">\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:spec add a --json flag to the report command<\u002Fcode><\u002Fli>\n<li>Read the spec. Ten minutes.<\u002Fli>\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship<\u002Fcode><\u002Fli>\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:mr --create<\u002Fcode><\u002Fli>\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec archive &lt;change-name&gt;<\u002Fcode> after it merges.<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 22px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px; margin: 0 0 12px;\">A bug fix<\u002Fh3>\n<ol style=\"margin: 0; padding-left: 20px; font-size: 15px; display: flex; flex-direction: column; gap: 6px;\">\n<li>Collect the evidence first: real log output or the error, and a reproduction. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">spec<\u002Fcode> refuses to create anything without both.<\u002Fli>\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:spec fix the 500 on /api/export when the tenant has no rows<\u002Fcode>. Task 1 of <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">tasks.md<\u002Fcode> is the failing repro test. Later tasks are constrained to the root cause, plus every consumer of a shared value the sweep found.<\u002Fli>\n<li>Read the spec. Is task 1 the repro? Did a refactor sneak in?<\u002Fli>\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship<\u002Fcode><\u002Fli>\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:mr --create<\u002Fcode>, then archive after merge.<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 22px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px; margin: 0 0 12px;\">A change that touches UI<\u002Fh3>\n<ol style=\"margin: 0; padding-left: 20px; font-size: 15px; display: flex; flex-direction: column; gap: 6px;\">\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:spec &lt;the UI change&gt;<\u002Fcode><\u002Fli>\n<li>Read <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">specs/**<\u002Fcode> especially: empty, error, loading, boundary and permission-denied states.<\u002Fli>\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship --handoff<\u002Fcode> emits the manual test plan and a code walkthrough.<\u002Fli>\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:mr --create --test-plan --explain<\u002Fcode>. Both land as comments, never in the description.<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 22px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 19px; margin: 0 0 12px;\">After a halt<\u002Fh3>\n<ol style=\"margin: 0; padding-left: 20px; font-size: 15px; display: flex; flex-direction: column; gap: 6px;\">\n<li>Read the summary before re-running anything. It names every default that was applied.<\u002Fli>\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock run-log query --run &lt;id&gt; --halted<\u002Fcode> shows only the events that explain the halt.<\u002Fli>\n<li>Fix the cause. A red suite: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:fix-tests<\u002Fcode>. More than two task failures: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">tasks.md<\u002Fcode> was underspecified there; re-spec that slice. Blockers after two rounds: re-spec. “Two failed rounds usually means the design was wrong, not the code.”<\u002Fli>\n<li><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship --apply-only<\u002Fcode>, so review and commit are not paid twice.<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 20px 0 0; font-size: 15px; color: color-mix(in srgb, var(--color-text) 68%, transparent);\">Never auto-retrigger. Leftover unchecked boxes after a run are a report, not authorisation for a second run.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section role=\"tabpanel\" id=\"panel-deep-dive\" aria-labelledby=\"tab-deep-dive\" hidden=\"{{ hideDeep }}\" data-screen-label=\"Deep dive\" style=\"max-width: 1120px; margin: 0 auto; padding: 0 16px 72px;\">\n<div style=\"border-top: 2px solid var(--color-divider); padding-top: 24px; position: sticky; top: 56px; background: var(--color-bg); z-index: 20; border-bottom: 1px solid var(--color-divider); margin-bottom: 32px;\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 12px;\">\n<button type=\"button\" data-goto=\"dd-review\" sc-camel-on-click=\"{{ ddGo }}\" class=\"btn btn-ghost\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em;\">Review<\u002Fbutton>\n<button type=\"button\" data-goto=\"dd-caps\" sc-camel-on-click=\"{{ ddGo }}\" class=\"btn btn-ghost\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em;\">Caps<\u002Fbutton>\n<button type=\"button\" data-goto=\"dd-verify\" sc-camel-on-click=\"{{ ddGo }}\" class=\"btn btn-ghost\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em;\">Verify<\u002Fbutton>\n<button type=\"button\" data-goto=\"dd-drift\" sc-camel-on-click=\"{{ ddGo }}\" class=\"btn btn-ghost\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em;\">Drift<\u002Fbutton>\n<button type=\"button\" data-goto=\"dd-review-md\" sc-camel-on-click=\"{{ ddGo }}\" class=\"btn btn-ghost\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em;\">REVIEW.md<\u002Fbutton>\n<button type=\"button\" data-goto=\"dd-evals\" sc-camel-on-click=\"{{ ddGo }}\" class=\"btn btn-ghost\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em;\">Evals<\u002Fbutton>\n<button type=\"button\" data-goto=\"dd-cost\" sc-camel-on-click=\"{{ ddGo }}\" class=\"btn btn-ghost\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em;\">Cost<\u002Fbutton>\n<button type=\"button\" data-goto=\"dd-receipts\" sc-camel-on-click=\"{{ ddGo }}\" class=\"btn btn-ghost\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em;\">Receipts<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-dd=\"dd-review\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(28px, 4vw, 46px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 20px;\">A dismissal needs a citation. A report doesn't.<\u002Fh2>\n<p style=\"max-width: 70ch; margin: 0 0 20px;\">An unverified review reports everything it notices, so you learn to skim it. A review where every blocker survived two adversaries is one you read line by line. Review is opt-in: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:ship --review<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">--strict<\u002Fcode>, or <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">/interlock:review-code<\u002Fcode> on its own. Default ship does not pay for it.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 2px; margin-bottom: 32px;\">\n<div style=\"background: var(--color-surface); padding: 20px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 18px; margin: 0 0 10px;\">Dimensions<\u002Fh3>\n<p style=\"margin: 0; font-size: 14.5px;\">Four always run: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">language<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">architecture<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">qa<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">technical-lead<\u002Fcode>. Two are added by a deterministic rule over the run's observed changed paths, never by a reviewer's judgement: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">devops<\u002Fcode> when a path suggests deploy, CI, config or infrastructure impact; <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">security<\u002Fcode> when a path matches the authentication, permissions or tenancy signal. A dimension name that resolves to no rubric file is an error that names the six, never a silent partial review.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 20px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 18px; margin: 0 0 10px;\">Two skeptics per finding<\u002Fh3>\n<p style=\"margin: 0 0 8px; font-size: 14.5px;\">Every blocker and warning gets two independent skeptics, in parallel. Suggestions pass through unverified; they are cheap to ignore and not worth the tokens.<\u002Fp>\n<p style=\"margin: 0 0 8px; font-size: 14.5px;\"><strong>Skeptic one is told to refute.<\u002Fstrong> Read the actual file and its surrounding context. Try to prove the finding is a false positive, overstated, or missing context. Default to real when genuinely uncertain.<\u002Fp>\n<p style=\"margin: 0; font-size: 14.5px;\"><strong>Skeptic two gives a second opinion.<\u002Fstrong> Read the file. Is this real? Is the severity right? Is the fix appropriate?<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 20px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 18px; margin: 0 0 10px;\">The citation rule<\u002Fh3>\n<p style=\"margin: 0 0 8px; font-size: 14.5px;\">Voting a finding real needs nothing but the vote. Voting a finding not real needs a citation, checked mechanically in two halves, because either alone is defeated: a <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">path:line<\u002Fcode> token, and a path that canonicalises to one actually present in the reviewed diff. Non-emptiness alone was once satisfied by a thumbs-up emoji; shape alone is satisfied by inventing a file that does not exist.<\u002Fp>\n<p style=\"margin: 0; font-size: 14.5px;\">An uncited refutation is a non-vote, never a deleted verdict. Its quality score still counts. Every refused refutation is counted and printed. A high count means the skeptics are asserting rather than reading, which is itself the signal you want.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 20px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 18px; margin: 0 0 10px;\">The vote<\u002Fh3>\n<ol style=\"margin: 0; padding-left: 18px; font-size: 14.5px; display: flex; flex-direction: column; gap: 6px;\">\n<li>A finding survives when at least as many skeptics voted it real as voted it not real, counting only cited not-real votes.<\u002Fli>\n<li>A tie keeps the finding. With two skeptics a one-to-one split is the common case, so this is the rule that matters most.<\u002Fli>\n<li>No verdicts means survival. Absence of adjudication is not dismissal.<\u002Fli>\n<li>Severity is refined to the most severe opinion among skeptics who thought the finding real. A blocker demoted to a warning by verification is a feature.<\u002Fli>\n<li>The quality band runs after survival.<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 6px;\">Adjudication simulator<\u002Fp>\n<p style=\"margin: 0 0 16px; font-size: 15px; max-width: 74ch;\">The diff under review touched <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">app/api/export/route.ts<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">lib/report.mjs<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">lib/cache.mjs<\u002Fcode>. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">src/utils.ts<\u002Fcode> is <strong>not<\u002Fstrong> in the diff.<\u002Fp>\n<div style=\"overflow-x: auto; margin-bottom: 16px;\">\n<sc-raw-table class=\"table\" style=\"min-width: 860px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 34px;\">#<\u002Fsc-raw-th><sc-raw-th style=\"width: 84px;\">Severity<\u002Fsc-raw-th><sc-raw-th style=\"width: 200px;\">File<\u002Fsc-raw-th><sc-raw-th>Title<\u002Fsc-raw-th><sc-raw-th>Skeptic one<\u002Fsc-raw-th><sc-raw-th>Skeptic two<\u002Fsc-raw-th><sc-raw-th>Outcome<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{ findings }}\" as=\"f\" hint-placeholder-count=\"4\">\n<sc-raw-tr>\n<sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">{{ f.n }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">{{ f.sev }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px;\">{{ f.file }}<\u002Fsc-raw-td>\n<sc-raw-td>{{ f.title }}<\u002Fsc-raw-td>\n<sc-raw-td hidden=\"{{ f.hide }}\" style=\"font-size: 13px;\">{{ f.s1 }}<\u002Fsc-raw-td>\n<sc-raw-td hidden=\"{{ f.hide }}\" style=\"font-size: 13px;\">{{ f.s2 }}<\u002Fsc-raw-td>\n<sc-raw-td hidden=\"{{ f.hide }}\" style=\"font-size: 13px;\">{{ f.out }}<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px;\">\n<button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ adjudicate }}\">Adjudicate<\u002Fbutton>\n<button type=\"button\" hidden=\"{{ hideCite }}\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ citeIt }}\">Cite it — give skeptic one a real file:line<\u002Fbutton>\n<button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ resetAdj }}\">Reset<\u002Fbutton>\n<\u002Fdiv>\n<pre hidden=\"{{ hideCounts }}\" style=\"margin: 0 0 32px; background: var(--color-surface); padding: 18px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.7; white-space: pre-wrap;\">{{ adjCounts }}<\u002Fpre>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2px; margin-bottom: 12px;\">\n<div style=\"background: var(--color-surface); padding: 20px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 18px; margin: 0 0 10px;\">The quality band and the gate<\u002Fh3>\n<p style=\"margin: 0 0 8px; font-size: 14.5px;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock gate<\u002Fcode> applies a band before counting blockers, so a vague blocker cannot hold up a change. Unscored findings are kept: absence of a score is not evidence of low quality. A scored finding below the floor is dropped, unless the two skeptics disagree by more than the tolerated drift, in which case the disagreement is itself signal and the finding is kept. Dropped-by-quality is reported separately from dismissed. The floor lives in the CLI and nowhere else; a repository cannot move it.<\u002Fp>\n<p style=\"margin: 0; font-size: 14.5px;\">A severity outside <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">blocker<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">warning<\u002Fcode>, <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">suggestion<\u002Fcode> is a rejection, not a bucket. A reviewer once emitted <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">critical<\u002Fcode>, a more alarming word than the enum's maximum, and it landed in a bucket the gate did not block on, so the scarier word passed more easily than <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">blocker<\u002Fcode> did. The gate now refuses to pass while a malformed severity is outstanding. The verdict is a count, not a judgement.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: var(--color-surface); padding: 20px;\">\n<h3 style=\"font-family: var(--font-heading); font-weight: 800; font-size: 18px; margin: 0 0 10px;\">How the fixing partitions<\u002Fh3>\n<p style=\"margin: 0 0 8px; font-size: 14.5px;\">Findings partition into fixers by file. One group per file is the parallel-safe partition; findings with no owning file are applied last, sequentially. Blockers are always fixed. Warnings are fixed alongside them but never halt. Suggestions are always deferred by policy, because a model asked to triage its own review will negotiate with itself.<\u002Fp>\n<p style=\"margin: 0; font-size: 14.5px;\">Nothing is dropped silently: every deferred finding carries its reason, and the receipt prints how many were fixed and how many deferred. The counts always sum back to the number raised: dropped by policy, dismissed by skeptics, dropped as too weak, surviving. Hiding them makes a verified review look identical to an unverified one.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0 0 8px; font-size: 15px; color: color-mix(in srgb, var(--color-text) 68%, transparent); max-width: 78ch;\">The precedent: <a href=\"https://arxiv.org/pdf/2604.19049\">Refute-or-Promote (arXiv 2604.19049)<\u002Fa> documents eighty-plus agents, dedicated adversarial reviewers among them, unanimously endorsing a padding oracle in OpenSSL's CMS module that did not exist.<\u002Fp>\n<\u002Fdiv>\n\n<div data-dd=\"dd-caps\" style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(28px, 4vw, 46px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 16px;\">Read from <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.8em;\">interlock limits<\u002Fcode>. Never restated.<\u002Fh2>\n<p style=\"max-width: 72ch; margin: 0 0 20px;\">Every value below lives in one file and is printed by one command. A threshold restated in a skill or a reviewer prompt is a blocker-severity finding in this repository's own review policy. A published cap that nothing reads fails a test; two were deleted on that rule rather than documented.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px;\">\n<p style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.06em; color: var(--color-accent); margin: 0; margin-right: auto;\">read from <span style=\"text-decoration: underline;\">interlock limits<\u002Fspan> at v1.0.0<\u002Fp>\n<input class=\"input\" type=\"search\" placeholder=\"Filter caps…\" aria-label=\"Filter caps\" sc-camel-on-input=\"{{ filterCaps }}\" style=\"width: 220px;\">\n<\u002Fdiv>\n<div style=\"overflow-x: auto;\">\n<sc-raw-table class=\"table\" style=\"min-width: 780px;\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 300px;\">Cap<\u002Fsc-raw-th><sc-raw-th style=\"width: 130px;\">Value at v1.0.0<\u002Fsc-raw-th><sc-raw-th>Why it exists<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>max parallel agents per batch<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">8<\u002Fsc-raw-td><sc-raw-td>The original implementation put thirty classifier-grouped tasks into thirty concurrent agents. Waves wider than this split into batches.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>inter-wave fix attempts (per wave)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">2<\u002Fsc-raw-td><sc-raw-td>A failed check buys bounded targeted repair; after that the run halts if the errors block the next wave, or warns and continues.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>replans (per run)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">2<\u002Fsc-raw-td><sc-raw-td>A plan revision is legitimate; an unbounded re-planning loop is a run that never converges.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>remediation rounds<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">2<\u002Fsc-raw-td><sc-raw-td>Blockers surviving the verdict round after this halt. Two failed rounds usually means the design was wrong, not the code.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>root-cause iterations (per run)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">5<\u002Fsc-raw-td><sc-raw-td>Repairing by root cause is slow by design; this bounds it before a ship becomes an open-ended debugging session.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>task failures tolerated<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">2<\u002Fsc-raw-td><sc-raw-td>Strictly more halts. A run losing three tasks is not producing a coherent change.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>run steps (per run)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">200<\u002Fsc-raw-td><sc-raw-td>A run that has taken this many CLI steps without a terminal state is not converging.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>inter-wave verify budget<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">60s<\u002Fsc-raw-td><sc-raw-td>Past this, drop to typecheck only, rather than letting the checks outweigh the work they guard.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>inter-wave verifications (per run)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">3<\u002Fsc-raw-td><sc-raw-td>A wave boundary is ordering; a checkpoint is an agent. Ordering is free, so the cap is on checkpoints. Docs-only and red waves skip without consuming one.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>verify spill threshold (bytes)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">8192<\u002Fsc-raw-td><sc-raw-td>Above this a step's output goes to disk instead of into an agent's context.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>verify preview budget (chars)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">4096<\u002Fsc-raw-td><sc-raw-td>The head-and-tail preview of a spilled log, and the ceiling every verify result field must stay under; a field over budget is rejected as a leak.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>wave handoff budget (chars, per task)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">2000<\u002Fsc-raw-td><sc-raw-td>Over budget fails the task rather than truncating: a next wave reading half a sentence is worse off than one told the report was rejected.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>review policy scan cap (bytes)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">65536<\u002Fsc-raw-td><sc-raw-td>Bounds the <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">REVIEW.md<\u002Fcode> read, so a committed build log with that name cannot make the reader do unbounded work.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>push timeout (ms)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">5000<\u002Fsc-raw-td><sc-raw-td>A hanging notification must not stall the close.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>lane caps by tier<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">T1 8 · T2 8 · T3 6 · T4 4 · T5 8<\u002Fsc-raw-td><sc-raw-td>Keyed by the lane's hardest task. Tier 4 stays small because cross-file pattern-following is where a fresh context per task still pays. Tier 5 is larger because the point of an opus worker is that it can hold more of one design in its head.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>cohesion tier ceiling (packs at or below)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">3<\u002Fsc-raw-td><sc-raw-td>Path-disjoint siblings pack into one lane only at or below this tier.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>solo envelope (max tasks in one lane)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">20<\u002Fsc-raw-td><sc-raw-td>The classifier supplies the shape judgement; this supplies the ceiling. The planner prompt is forbidden from naming it.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>eval smoke cost ceiling (per PR)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">$2<\u002Fsc-raw-td><sc-raw-td>The eval harness is metered; the ceilings are published so a run cannot quietly grow.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>eval full-run cost ceiling (scheduled)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">$15<\u002Fsc-raw-td><sc-raw-td>As above.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>eval outcome-run cost ceiling (scheduled)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">$20<\u002Fsc-raw-td><sc-raw-td>As above.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>eval runs per case<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">3<\u002Fsc-raw-td><sc-raw-td>Model-facing cases are sampled rather than trusted once.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>eval promotion: consecutive qualifying runs<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">3<\u002Fsc-raw-td><sc-raw-td>Promotion is earned across runs, not within one.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>eval promotion: trials per qualifying run<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">3<\u002Fsc-raw-td><sc-raw-td>As above.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>eval promotion: judge agreement floor<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">80%<\u002Fsc-raw-td><sc-raw-td>As above.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>price table id<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">anthropic-list-2026-09b<\u002Fsc-raw-td><sc-raw-td>A revised price is a new id rather than an edit, so old rows keep meaning what they meant.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>price: claude-haiku-4-5 ($/Mtok)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">in 1, out 5<\u002Fsc-raw-td><sc-raw-td>Recorded so a dollar figure becomes computable.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>price: claude-sonnet-5 ($/Mtok)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">in 3, out 15<\u002Fsc-raw-td><sc-raw-td>Recorded so a dollar figure becomes computable.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>price: claude-opus-5 ($/Mtok)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">in 15, out 75<\u002Fsc-raw-td><sc-raw-td>Recorded so a dollar figure becomes computable.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>cache write multiplier: ephemeral_1h (× input)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">2<\u002Fsc-raw-td><sc-raw-td>Writing a prefix to cache costs more than not caching; reading one back costs 0.1×.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>cache write multiplier: ephemeral_5m (× input)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">1.25<\u002Fsc-raw-td><sc-raw-td>As above.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>cache read multiplier (× input)<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">0.1<\u002Fsc-raw-td><sc-raw-td>A prefix that survives to be read is a large saving; one that expires before the next wave is a surcharge.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>report trajectory scan cap<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">2000<\u002Fsc-raw-td><sc-raw-td>Bounds what the report reads over the corpora.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>reasoning effort<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">T1 low · T2 low · T3 inherit · T4 inherit · T5 xhigh · inter-wave verify xhigh · review skeptics xhigh<\u002Fsc-raw-td><sc-raw-td>The two steps whose whole job is catching what an implementer missed get the most reasoning.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr data-cap-row=\"1\"><sc-raw-td>runtime ceilings<\u002Fsc-raw-td><sc-raw-td style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">16 concurrent, 1000 agents per run<\u002Fsc-raw-td><sc-raw-td>The host's, not policy. The planner clamps below them rather than discovering them the hard way.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-dd=\"dd-verify\" style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(28px, 4vw, 46px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 16px;\">A suite that went green by shrinking is not green.<\u002Fh2>\n<p style=\"max-width: 72ch; margin: 0 0 24px;\"><code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">lib/verify.mjs<\u002Fcode> decides and never verifies. It spawns nothing, reads nothing, executes nothing. The CLI plans which commands should run, an agent runs them and reports exit codes and counts, and the CLI judges what the results mean. The agent is never told a threshold and never renders a verdict.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 2px;\">\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>Every command comes from your test profile, verbatim.<\u002Fstrong> Five kinds in a fixed order: typecheck, unit, lint, coverage, e2e. There is no branch where a command gets guessed. “Use the test profile” became “run <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">npm test<\u002Fcode>” the moment a model could not find the profile quickly, which is why the profile is a file and the plan reports <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">hasProfile: false<\u002Fcode> with a skip reason instead of inventing one.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>Two contexts, two halting sets.<\u002Fstrong> Between waves, a red typecheck or unit suite halts, because a type error must not let the next wave build on top of it. At the final gate only the unit suite halts; a red typecheck is reported, because the published halt list is exhaustive and a fourth halt must not appear silently. Coverage is advisory by construction. E2E is run and never repaired.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>Red has five meanings, in priority order.<\u002Fstrong> The suite did not run (halt). The suite was weakened (halt, and it outranks a green exit). Green. Red but pre-existing (a warning, not a halt). Red (halt).<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>Failures cluster by root cause.<\u002Fstrong> A failure line is reduced to a signature by erasing what differs between two occurrences of one cause: paths, line numbers, addresses, hashes, timings. The error class, the message and the expected-versus-actual survive. Clusters sort by size, so the repair budget goes to the biggest cause first.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>The shrink check.<\u002Fstrong> Given a baseline, a test count that fell means tests were removed, not fixed; a skipped count that rose means failures were silenced, not fixed. Without a baseline the check says it is unavailable rather than pretending. This is the only thing standing between a repair step and a weakened test on a host with no hooks.<\u002Fp>\n<p style=\"background: var(--color-surface); padding: 20px; margin: 0; font-size: 14.5px;\"><strong>The guard.<\u002Fstrong> The final verification publishes the <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">fix-tests<\u002Fcode> stage marker, so the test-file guard is in deny exactly when the hazard is live. The retry briefing flips from “do not repair unless you can fix the root cause without weakening a test” to “repair the root cause of each listed failure, then re-run”. Both end the same way: never weaken a test, loosen an assertion or narrow the suite.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div data-dd=\"dd-drift\" style=\"border-top: 2px solid var(--color-divider); margin-top: 48px; padding-top: 40px;\">\n<h2 style=\"font-family: var(--font-heading); font-weight: 800; font-size: clamp(28px, 4vw, 46px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 16px;\">Measured at three confidence levels. Never averaged.<\u002Fh2>\n<p style=\"max-width: 72ch; margin: 0 0 24px;\">OpenSpec is spec-anchored: <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec archive<\u002Fcode> merges a completed change's deltas into the living specs. Interlock never archives for you. It stops the step being forgotten.<\u002Fp>\n<div style=\"border-top: 2px solid var(--color-divider);\">\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 150px minmax(0, 2fr); gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--color-divider); align-items: baseline;\">\n<p style=\"margin: 0; font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">Unarchived changes<\u002Fp>\n<p style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent);\">certain<\u002Fp>\n<p style=\"margin: 0; font-size: 15px;\">Every task ticked, the change still in <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">openspec/changes/<\u002Fcode>. Read off the filesystem.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 150px minmax(0, 2fr); gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--color-divider); align-items: baseline;\">\n<p style=\"margin: 0; font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">Broken references<\u002Fp>\n<p style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent);\">evidence<\u002Fp>\n<p style=\"margin: 0; font-size: 15px;\">A living spec cites a file that is not there. The file existed when the graph was built.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 150px minmax(0, 2fr); gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--color-divider); align-items: baseline;\">\n<p style=\"margin: 0; font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">Orphan code<\u002Fp>\n<p style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent);\">evidence, scoped<\u002Fp>\n<p style=\"margin: 0; font-size: 15px;\">Changed source files no spec describes. Always reported with a repo-wide coverage figure: “2 files have no spec” is alarming, “2 of 6, in a repo where 34% of source files have one” is informative.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 150px minmax(0, 2fr); gap: 16px; padding: 18px 0; border-bottom: 2px solid var(--color-divider); align-items: baseline;\">\n<p style=\"margin: 0; font-family: var(--font-heading); font-weight: 800; font-size: 19px;\">Aging specs<\u002Fp>\n<p style=\"margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent);\">inference<\u002Fp>\n<p style=\"margin: 0; font-size: 15px;\">A spec older than a file it cites. Dates, not behaviour. Printed last for that reason.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"max-width: 74ch; margin: 20px 0 0;\">A deleted file appears under broken references only, never also under aging. Absence is never reported as cleanliness: no graph, no living specs and no changed files are three distinct messages, not a pass. <code style=\"font-family: 'JetBrains Mono', ui-monospace, monospace;\">interlock conformance<\u002Fcode> is the other half: it lists the scenarios a change's delta specs promised, so each can be checked against what was built. It emits questions, never verdicts. Neither blocks — a g
