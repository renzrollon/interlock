# Eval gate — runs Interlock's model-facing surface against a real model.
#
# Separate from ci.yml on purpose (gate spec): ci.yml fires on a bare
# `pull_request:` with no path filter, and narrowing THAT to a path would stop
# the unit, validation and smoke jobs from running on every change. This
# workflow carries its own trigger surface so the two never entangle.
#
# Advisory or blocking is a DECISION, not an edit in this file (gate spec,
# "Posture is derived, not hand-edited"). Each job runs `interlock evals promote
# --history evals/history` and the triage step's continue-on-error is an
# expression over its result. Promotion therefore happens by the history changing,
# not by a reviewer arguing for it in a pull request, and no threshold or blocking
# flag is written here.
#
# VERIFIED by reading the two steps below, with evals/history/ holding no records:
# `promote` reports insufficient history and exits 2, the resolve step sets
# blocking=false, and `continue-on-error` evaluates to true — the advisory
# posture. That is today's behaviour reached by decision rather than by default,
# which is what the gate spec's "No history yields the advisory posture" scenario
# asks for. Nothing here special-cases the empty directory.
#
# NOTE: .github/workflows/ is gitignored (.gitignore:38), so this file was
# force-added (`git add -f`). If it ever shows as untracked, `git ls-files
# .github/workflows/` will not list it and it never runs on the remote.
# test/evals.test.mjs asserts that tracking, so losing this file fails npm test.
name: Evals

on:
  # Same-repo pull requests that touch a model-facing surface run the fast smoke
  # subset. The trigger surface is every file that steers a model — skills, the
  # shared contracts skills load at runtime, agent definitions, the ship
  # workflow, and the plugin manifest. It excludes vendored host copies under
  # host-integration/, which are untracked and cannot appear in a diff anyway.
  pull_request:
    paths:
      - 'skills/**'
      - 'shared/**'
      - 'agents/**'
      - 'workflows/**'
      - '.claude-plugin/plugin.json'
  # The full suite — every case, with the baseline ablation arm and judged
  # graders — runs on a schedule, off the per-change critical path.
  schedule:
    - cron: '17 7 * * 1' # Mondays, 07:17 UTC
  workflow_dispatch:

# Supersede an in-flight run on the same ref rather than stacking metered runs.
concurrency:
  group: evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke evals (pull request)
    # Fork pull requests cannot see repository secrets, so the run would abort on
    # a rejected credential. Skip them cleanly (gate spec, design D4). The job is
    # never a required check, so a skipped fork PR stays mergeable.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # Early-access enablement lives in the CI environment, never in committed
      # settings (gate spec, design D8). A committed value would produce a suite
      # that looks configured and does not run.
      CLAUDE_CODE_WALNUT_SPIRE: '1'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Copied from ci.yml validate-plugin: the CLI is the harness.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      # The job is mergeable before a credential is provisioned (gate spec,
      # design D12): with no key present it skips the metered steps and reports
      # why, rather than failing or reporting a score regression.
      - name: Check for model credential
        id: cred
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No model credential provisioned — skipping the eval run." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # Cost ceiling read from `interlock limits` — nothing restates it here.
      - name: Resolve cost ceiling
        if: steps.cred.outputs.present == 'true'
        id: caps
        run: |
          CEIL=$(./bin/interlock limits --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).evals.smokeCostUsd))')
          echo "ceiling=$CEIL" >> "$GITHUB_OUTPUT"
      - name: Run smoke evals
        if: steps.cred.outputs.present == 'true'
        run: |
          # One run, no ablation arm — the fast per-change signal. Report kept
          # local (--no-publish, design D10); an unattended job has nobody to
          # consent to publishing to an external account.
          claude plugin eval . \
            --tag smoke \
            --runs 1 \
            --ablation none \
            --no-publish \
            --max-cost-usd "${{ steps.caps.outputs.ceiling }}" \
            --report evals-report.html \
            --json evals-results.json
      # Whether a failing verdict may fail this job. Read from the promotion
      # decision, never set by hand — `promote` exits 0 only when every case in
      # the recorded history has earned blocking status. Its own non-zero exit is
      # the answer, not a failure, which is why it is consumed by `if` rather
      # than allowed to fail the step.
      - name: Resolve promotion posture
        if: steps.cred.outputs.present == 'true'
        id: promotion
        run: |
          if ./bin/interlock evals promote --history evals/history --json > promotion.json; then
            echo "blocking=true" >> "$GITHUB_OUTPUT"
            echo "Eval promotion: every case is promoted — a failing verdict fails this job." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "blocking=false" >> "$GITHUB_OUTPUT"
            echo "Eval promotion: advisory. \`interlock evals promote\` did not report every case promotable:" >> "$GITHUB_STEP_SUMMARY"
          fi
          ./bin/interlock evals promote --history evals/history >> "$GITHUB_STEP_SUMMARY" || true
      - name: Triage the results
        if: steps.cred.outputs.present == 'true'
        # Derived, not fixed: advisory unless the promotion decision says every
        # case has earned blocking status. With no history committed this
        # resolves to true, which is the advisory posture by decision.
        continue-on-error: ${{ steps.promotion.outputs.blocking != 'true' }}
        run: ./bin/interlock evals triage --results evals-results.json
      - name: Upload report
        if: steps.cred.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evals-smoke-report
          path: |
            evals-report.html
            evals-results.json
          if-no-files-found: ignore

  full:
    name: Full eval suite (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_WALNUT_SPIRE: '1'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Check for model credential
        id: cred
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No model credential provisioned — skipping the eval run." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # Both caps read from `interlock limits` — nothing restates them here.
      - name: Resolve cost ceiling
        if: steps.cred.outputs.present == 'true'
        id: caps
        run: |
          CEIL=$(./bin/interlock limits --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).evals.fullRunCostUsd))')
          echo "ceiling=$CEIL" >> "$GITHUB_OUTPUT"
          RUNS=$(./bin/interlock limits --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).evals.runsPerCase))')
          echo "runs=$RUNS" >> "$GITHUB_OUTPUT"
      - name: Run full eval suite
        if: steps.cred.outputs.present == 'true'
        run: |
          # Every case, with the no-plugin baseline ablation arm and judged
          # graders. runs-per-case comes from the published limits rather than
          # each case's own `runs` value: the per-case values were chosen for
          # the fast per-change subset, and the scheduled arm is the one off the
          # critical path that can afford repetition (design D3).
          claude plugin eval . \
            --ablation with-without \
            --runs "${{ steps.caps.outputs.runs }}" \
            --no-publish \
            --max-cost-usd "${{ steps.caps.outputs.ceiling }}" \
            --report evals-report.html \
            --json evals-results.json
      # Same derivation as the smoke job — the posture is one decision, read in
      # both places rather than restated differently in each.
      - name: Resolve promotion posture
        if: steps.cred.outputs.present == 'true'
        id: promotion
        run: |
          if ./bin/interlock evals promote --history evals/history --json > promotion.json; then
            echo "blocking=true" >> "$GITHUB_OUTPUT"
            echo "Eval promotion: every case is promoted — a failing verdict fails this job." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "blocking=false" >> "$GITHUB_OUTPUT"
            echo "Eval promotion: advisory. \`interlock evals promote\` did not report every case promotable:" >> "$GITHUB_STEP_SUMMARY"
          fi
          ./bin/interlock evals promote --history evals/history >> "$GITHUB_STEP_SUMMARY" || true
      - name: Triage the results
        if: steps.cred.outputs.present == 'true'
        continue-on-error: ${{ steps.promotion.outputs.blocking != 'true' }}
        run: ./bin/interlock evals triage --results evals-results.json
      - name: Upload report
        if: steps.cred.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evals-full-report
          path: |
            evals-report.html
            evals-results.json
          if-no-files-found: ignore
