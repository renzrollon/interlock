name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install — the whole toolchain is stdlib Node.
      - name: Test
        run: npm test

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The bin/ scripts are what land on a user's PATH, so exercise them as
      # executables rather than importing the libraries they wrap.
      - name: interlock surface
        run: |
          ./bin/interlock surface --changed src/Button.tsx docs/readme.md --json \
            | grep -q '"needsManualTestPlan": true'
      - name: interlock gate blocks on a blocker
        run: |
          echo '[{"dimension":"qa","findings":[{"severity":"blocker","file":"a.ts","title":"t","description":"d"}]}]' > /tmp/f.json
          if ./bin/interlock gate --findings /tmp/f.json; then
            echo "gate should have exited non-zero on a blocker"; exit 1
          fi
      - name: interlock waves caps fan-out
        run: |
          node -e '
            const tasks = Array.from({length: 20}, (_, i) => ({
              id: `1.${i+1}`, group: 1, description: "t",
              tier: 2, model: "sonnet", isTestTask: false
            }));
            require("fs").writeFileSync("/tmp/c.json", JSON.stringify({tasks}));
          '
          ./bin/interlock waves --classified /tmp/c.json --max-parallel 8 --json \
            | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const p = JSON.parse(s);
                const widest = Math.max(...p.waves.flatMap(w => w.batches.map(b => b.length)));
                if (widest > 8) { console.error("fan-out cap breached:", widest); process.exit(1); }
                console.log("max batch size:", widest);
              });
            '
      - name: interlock-graph builds a graph
        run: |
          ./bin/interlock-graph build . >/dev/null
          test -f .claude/graph/graph.json
          test -f .claude/graph/GRAPH_REPORT.md

      # The tarball is what a user who never installs the plugin gets. `npm pack`
      # succeeding proves only that a whitelist exists — a `files` list missing a
      # reachable lib/ file packs and installs cleanly and dies at first use. So
      # install the tarball into a throwaway prefix and run the real binaries
      # from it. The bin map is read from package.json so a renamed binary
      # cannot fall out of this smoke silently.
      - name: pack the tarball and run every installed binary
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/*.tgz)
          npm install -g "$tgz" --prefix "$RUNNER_TEMP/prefix"
          for name in $(node -e 'process.stdout.write(Object.keys(require("./package.json").bin).join("\n"))'); do
            echo "--- $name --help"
            "$RUNNER_TEMP/prefix/bin/$name" --help >/dev/null
          done
          echo "--- interlock limits"
          "$RUNNER_TEMP/prefix/bin/interlock" limits >/dev/null

  # The outcome eval's model-free prepare path. Ordinary CI runs it so a broken
  # fixture, a failed copy or an isolation refusal fails the build here, on every
  # pull request, instead of waiting for the metered Wednesday sweep in
  # `.github/workflows/ship-outcome-eval.yml` to notice.
  #
  # NO CREDENTIAL, AND NO SKIP. This job never reads `secrets.ANTHROPIC_API_KEY`
  # and must never grow the metered job's "no credential → skip" step: that skip
  # is correct for a sweep that produces no signal without a model, and here it
  # would hide exactly the broken fixture this job exists to catch. The empty
  # `env` below keeps a repository-level secret out of the step.
  #
  # NOT THE METERED EVAL. `--prepare-only` copies, git-inits and discards each
  # fixture outside this repository. It invokes no model, records no spend and
  # appends no row to `evals/history/ship-outcomes.jsonl`. A non-zero exit here
  # fails this workflow; it is not a graded outcome-eval result, and no gate,
  # readiness check or promotion decision reads it.
  #
  # ONE JOB, NOT A MATRIX STEP. The unit suite already spawns this flag as an
  # assertion on every Node version; the named contract runs once, on Node 22.
  outcome-prepare:
    name: Outcome eval prepare (model-free)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # No install step: the repository has no dependencies.
      - name: Prepare every outcome fixture without a model
        run: node evals/ship/run.mjs --prepare-only
