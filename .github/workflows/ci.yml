name: CI

on:
  push:
    branches: [main]
  pull_request:

# Written down rather than inherited from the repository default, so a change to
# that setting cannot widen what these jobs can do.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install — the whole toolchain is stdlib Node.
      - name: Test
        run: npm test

  # The release job upgrades npm before its own `npm test` (release.yml,
  # "Upgrade npm for trusted publishing"), so a tag could fail on an npm no pull
  # request ever ran. v1.15.0 did: npm 12 prints `npm pack --json` as an object,
  # not an array, and the scan-pack tests only met it at tag time. This leg runs
  # the suite under that same npm, READ from release.yml and spelled nowhere in
  # this file, so moving the release pin moves this leg with no edit here.
  # Advisory until the main ruleset requires it.
  test-release-npm:
    name: test (release npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install the npm the release job installs
        run: |
          pin=$(grep -oE 'npm install -g npm@[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/release.yml | sed 's/.*npm@//' | sort -u)
          if [ -z "$pin" ] || [ "$(printf '%s\n' "$pin" | wc -l)" -ne 1 ]; then
            echo "::error::release.yml must install exactly one exact npm version; found: ${pin:-none}"
            exit 1
          fi
          npm install -g "npm@$pin"
          echo "npm $(npm --version), the release job's pin"
      # No dependencies to install — the whole toolchain is stdlib Node.
      - name: Test
        run: npm test

  # The plugin is validated under the newest engine and under the oldest one the
  # CLI declares support for. The floor is READ from MODS_MIN_HOST_VERSION in
  # lib/host/claude-env.mjs and spelled nowhere in this file, so raising the
  # constant moves this leg with no edit here (test/spine/github-workflows.test.mjs
  # pins that this file names no engine version).
  #
  # The floor leg blocks merges on purpose. Its engine is pinned, so it moves
  # only when the constant is raised; a red floor validate means the manifest no
  # longer loads on an engine the plugin says it supports. Fix the manifest, or
  # raise MODS_MIN_HOST_VERSION in a change that says why. Never make the leg
  # advisory: a floor nobody checks is a support claim nobody keeps.
  validate-plugin:
    name: validate-plugin (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [latest, floor]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Claude Code
        id: engine
        run: |
          set -euo pipefail
          if [ "${{ matrix.engine }}" = floor ]; then
            floor=$(node -e 'import("./lib/host/claude-env.mjs").then(m => process.stdout.write(m.MODS_MIN_HOST_VERSION))')
            echo "floor=$floor" >> "$GITHUB_OUTPUT"
            echo "Floor engine, read from MODS_MIN_HOST_VERSION: $floor" >> "$GITHUB_STEP_SUMMARY"
            npm install -g "@anthropic-ai/claude-code@$floor"
          else
            npm install -g @anthropic-ai/claude-code
          fi
          claude --version
      - name: Validate plugin and marketplace manifests
        run: claude plugin validate . --strict
      # The hooks module's own tests (test/mod/*.test.ts), run by the engine's
      # kit; `npm test` never collects them. A host that cannot load mods
      # fails this step rather than skipping it. It runs even when the strict
      # validate above is red, so its own result stays visible in the same log.
      # At the floor engine a `plugin test` command the engine does not know is
      # said in the summary and as an annotation instead of passing silently;
      # any other failure of the probe fails the step. On latest it is a failure.
      - name: Hooks module tests
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ matrix.engine }}" = floor ]; then
            if ! probe=$(claude plugin test --help 2>&1); then
              if printf '%s\n' "$probe" | grep -qiE 'unknown (command|argument|option)'; then
                message="plugin test is not available at the floor engine ${{ steps.engine.outputs.floor }}; mod tests are covered on latest only"
                echo "::notice title=floor engine::$message"
                echo "$message" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              printf '%s\n' "$probe"
              echo "claude plugin test --help failed at the floor engine for a reason other than an unknown command" >&2
              exit 1
            fi
          fi
          claude plugin test .

  # The `main: required CI` ruleset requires a check named `validate-plugin`; it
  # lives on GitHub, not here. The matrix above reports as
  # `validate-plugin (latest)` and so on, and nothing reports the bare name, so
  # this gate does: it passes only when every leg of the matrix passed. `always()` keeps a failed or cancelled
  # leg from skipping the gate, because a skipped required check reads as
  # passing. Renaming a job or a leg leaves the gate's name alone;
  # test/spine/github-workflows.test.mjs pins that every required name is
  # reported.
  validate-plugin-gate:
    name: validate-plugin
    needs: validate-plugin
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every engine leg passed
        run: |
          echo "validate-plugin legs: ${{ needs.validate-plugin.result }}"
          test "${{ needs.validate-plugin.result }}" = success

  # The release installed OVER the previous one. A user who runs `npm i -g` on
  # top of last month's install gets whatever the two leave together, which no
  # fresh-prefix smoke sees. Install the previous release first, prove it runs,
  # install the packed tarball over the same prefix, then smoke the new one: the
  # current smoke before the over-install would fail by design on every command
  # this release adds. A second prefix holds only the previous release for the
  # skew harness case, which needs an old CLI to drive the current ship.js
  # against. Read-only token, so the write-token install rule does not apply.
  upgrade-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install the previous release
        run: |
          set -euo pipefail
          prev=$(npm view @renzrollon/interlock version)
          echo "previous release: $prev"
          echo "Over-install from previous release $prev" >> "$GITHUB_STEP_SUMMARY"
          npm install -g "@renzrollon/interlock@$prev" --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/interlock" --help >/dev/null
          npm install -g "@renzrollon/interlock@$prev" --prefix "$RUNNER_TEMP/previous"
      - name: Install the packed tarball over it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          npm install -g "$RUNNER_TEMP"/pack/*.tgz --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/interlock" --help >/dev/null
      - name: Smoke and doctor from the over-installed prefix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          node scripts/postinstall-smoke.mjs "$RUNNER_TEMP/prefix/bin" . "$RUNNER_TEMP/smoke"
          # The doctor's other rows depend on what the runner has installed, so
          # only the one this job is about can fail it: the CLI on PATH must be
          # the version of the plugin it came with, this checkout. The plugin
          # root is given as a plugin session gives it; by name alone the row has
          # no plugin to compare with and skips, which proves nothing here.
          PATH="$RUNNER_TEMP/prefix/bin:$PATH" CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" interlock doctor --json > "$RUNNER_TEMP/doctor.json" || true
          node -e '
            const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const row = d.checks.find(c => c.id === "cli-version");
            console.log("cli-version:", row ? row.status + " - " + row.detail : "no row");
            if (!row || row.status !== "ok") process.exit(1);
          ' "$RUNNER_TEMP/doctor.json"
      # The case branches on what the previous CLI reports, so it holds before
      # and after the release that began reporting versions. A name pattern that
      # matches nothing still exits 0, so the step also requires the case's own
      # `ok` line, without a SKIP: renaming the case fails here, not silently.
      - name: Skew harness against the previous release's CLI
        env:
          INTERLOCK_HARNESS_BIN: ${{ runner.temp }}/previous/bin/interlock
          SKEW_CASE: the current ship.js against the previous release CLI closes, and names how that CLI differs from the plugin
        run: |
          set -euo pipefail
          node --test --test-reporter=tap --test-name-pattern "$SKEW_CASE" test/workflows.test.mjs | tee "$RUNNER_TEMP/skew.tap"
          if ! sed -n 's/^ok [0-9]* - //p' "$RUNNER_TEMP/skew.tap" | grep -Fxq "$SKEW_CASE"; then
            echo "the skew case did not run and pass: $SKEW_CASE"; exit 1
          fi

  # The outcome eval's model-free prepare path. Ordinary CI runs it so a broken
  # fixture, a failed copy or an isolation refusal fails the build here, on every
  # pull request, instead of waiting for a manually started metered sweep (see
  # `.github/workflows/ship-outcome-eval.yml`, which carries no schedule) to notice.
  #
  # NO CREDENTIAL, AND NO SKIP. This job never reads `secrets.ANTHROPIC_API_KEY`
  # and must never grow the metered job's "no credential → skip" step: that skip
  # is correct for a sweep that produces no signal without a model, and here it
  # would hide exactly the broken fixture this job exists to catch. The empty
  # `env` below keeps a repository-level secret out of the step.
  #
  # NOT THE METERED EVAL. `--prepare-only` copies, git-inits and discards each
  # fixture outside this repository. It invokes no model, records no spend and
  # appends no row to `evals/history/ship-outcomes.jsonl`. A non-zero exit here
  # fails this workflow; it is not a graded outcome-eval result, and no gate,
  # readiness check or promotion decision reads it.
  #
  # ONE JOB, NOT A MATRIX STEP. The unit suite already spawns this flag as an
  # assertion on every Node version; the named contract runs once, on Node 22.
  outcome-prepare:
    name: Outcome eval prepare (model-free)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # No install step: the repository has no dependencies.
      - name: Prepare every outcome fixture without a model
        run: node evals/ship/run.mjs --prepare-only
