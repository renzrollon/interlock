name: Pages

# Deploys site/ to GitHub Pages. The page itself is a single hand-authored
# index.html (see site/README.md) — no build step, nothing to install.
#
# One-time setup, in the repository settings: Pages → Source → "GitHub Actions".
# Until that is set this workflow's deploy step fails with a Pages error rather
# than skipping, so a misconfiguration is visible, not silent.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
