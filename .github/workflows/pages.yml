name: Pages

# Deploys site/ to GitHub Pages. The page is a Claude Design export installed
# as it came (see site/README.md) — no build step, nothing to install.
#
# One-time setup, in the repository settings: Pages → Source → "GitHub Actions".
# Until that is set this workflow's deploy step fails with a Pages error rather
# than skipping, so a misconfiguration is visible, not silent.
#
# Every deploy also writes badges/downloads.json, the all-time npm downloads
# the README's badge reads (scripts/npm-downloads.mjs). A deploy rebuilds the
# whole site, so the file is regenerated each time or it disappears. It runs
# after each successful Release too, so the figure moves with every version.
# `workflow_run`, not a tag trigger: it runs on the default branch, which the
# github-pages environment allows; a tag ref would be refused.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/npm-downloads.mjs'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # `workflow_run` names its upstream by `name:` alone, and a fork's pull
    # request can add a workflow called Release. Only a tag push in this
    # repository, from release.yml, is a release.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.path == '.github/workflows/release.yml')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Never fails the deploy: an unreadable npm carries the live count
      # forward, and a warning annotation on the run says so.
      - name: Downloads badge
        run: node scripts/npm-downloads.mjs --out site/badges/downloads.json
      - uses: actions/configure-pages@v6
      # Leaves dotfiles out of the artifact since v4. site/.nojekyll is one, and
      # nothing reads it: a deploy from Actions never runs Jekyll.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
