# Mirror each published npm tarball onto the `release` branch, unchanged.
#
# Plugin installs read that branch: the marketplace entry in
# `.claude-plugin/marketplace.json` names it as its `ref`, and Anthropic's
# directory tracks it. So a plugin user receives exactly the files npm users
# receive, at exactly the version npm carries — never an untagged commit on
# main, and never the repository-only directories (openspec, docs, test, site).
#
# The tarball is fetched back FROM THE REGISTRY rather than packed again here,
# so the branch is what was published, not a second build that could differ.
# A version that never becomes fetchable is a failed job, not a skipped one.
#
# Separate from release.yml on purpose: the release workflow triggers on a
# version tag only (spec: distribution/npm-package). This one follows a
# successful Release run, and can be dispatched by hand with a version that is
# already on npm — which is how the branch is first created, and how plugin
# users are rolled back to an earlier release.
#
# A Release run is followed only when it is a tag push in this repository, from
# release.yml. `workflow_run` names its upstream by `name:` alone, so a fork's
# pull request can add a workflow called Release, and its branch name would
# otherwise choose which published version this branch rolls back to.
#
# Two jobs, so nothing installed at a floating version runs where the write
# token lives. `validate` fetches the tarball and runs `claude plugin validate`
# with a read-only token; `bundle` holds `contents: write` and runs only git, tar
# and node. The tarball crosses as a run artifact, and `bundle` checks it against
# the integrity `validate` recorded before the Claude Code CLI was installed, so
# the bytes pushed are the bytes the registry served.
#
# `.github/workflows/` is gitignored: this file is tracked only because it was
# force-added, and `test/spine/package.test.mjs` fails if that stops being true.

name: Plugin bundle

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: A version already published to npm (MAJOR.MINOR.PATCH) to mirror onto the release branch
        required: true
        type: string

concurrency:
  group: plugin-bundle
  cancel-in-progress: false

env:
  PACKAGE: '@renzrollon/interlock'

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.path == '.github/workflows/release.yml')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Every output is set before the Claude Code CLI is installed.
    outputs:
      version: ${{ steps.version.outputs.value }}
      file: ${{ steps.tarball.outputs.file }}
      integrity: ${{ steps.tarball.outputs.integrity }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # A Release run's head_branch is the tag that triggered it (v1.2.0).
      - name: Resolve the version
        id: version
        env:
          DISPATCHED: ${{ inputs.version }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then v="$DISPATCHED"; else v="${TAG#v}"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$v' is not a MAJOR.MINOR.PATCH version; there is nothing to mirror"
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Fetch the published tarball from the registry
        id: tarball
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          spec="$PACKAGE@$VERSION"
          # The registry serves a new version minutes after `npm publish`
          # returns, not seconds: 1.3.0 through 1.4.1 each appeared 1.5 to 4
          # minutes after Release finished, and the packument's edge cache
          # (max-age=300) can serve the old version list for longer still. Ten
          # tries 15 seconds apart gave up before every one of them, so wait up
          # to 15 minutes.
          for attempt in $(seq 1 60); do
            if npm pack "$spec" --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"; then break; fi
            if [ "$attempt" = 60 ]; then
              echo "::error::$spec is not fetchable from the registry after 15 minutes; the release branch is unchanged. Dispatch this workflow with version $VERSION once npm serves it"
              exit 1
            fi
            sleep 15
          done
          file=$(node -p 'require(process.argv[1])[0].filename' "$RUNNER_TEMP/pack.json")
          integrity=$(node -p 'require(process.argv[1])[0].integrity' "$RUNNER_TEMP/pack.json")
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/unpacked"
          root="$RUNNER_TEMP/unpacked/package"
          declared=$(node -p 'require(process.argv[1]).version' "$root/.claude-plugin/plugin.json")
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::$spec carries plugin.json version $declared; the bundle would install as the wrong version"
            exit 1
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      # Before the CLI install, so what `bundle` receives was handed over while
      # nothing installed at a floating version had run.
      - name: Hand the tarball to the bundle job
        uses: actions/upload-artifact@v4
        with:
          name: plugin-bundle-tarball
          path: ${{ runner.temp }}/${{ steps.tarball.outputs.file }}
          if-no-files-found: error

      # What the directory scans is the bundle, not the repository, so the
      # bundle is what gets validated.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the bundle as a plugin
        env:
          ROOT: ${{ steps.tarball.outputs.root }}
        run: claude plugin validate "$ROOT" --strict

  bundle:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: plugin-bundle-tarball
          path: ${{ runner.temp }}/handed

      # The artifact is reachable by every step of `validate`, the CLI install
      # included; the integrity was recorded before it ran. A mismatch fails
      # here and the branch is unchanged.
      - name: Check the tarball is the one the registry served
        id: tarball
        env:
          FILE: ${{ needs.validate.outputs.file }}
          INTEGRITY: ${{ needs.validate.outputs.integrity }}
        run: |
          tgz="$RUNNER_TEMP/handed/$FILE"
          actual=$(node -e 'const { createHash } = require("node:crypto"); process.stdout.write("sha512-" + createHash("sha512").update(require("node:fs").readFileSync(process.argv[1])).digest("base64"))' "$tgz")
          if [ "$actual" != "$INTEGRITY" ]; then
            echo "::error::$FILE does not match the integrity the registry reported ($INTEGRITY, got $actual); the release branch is unchanged"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/unpacked"
          echo "root=$RUNNER_TEMP/unpacked/package" >> "$GITHUB_OUTPUT"

      - name: Commit the bundle to the release branch
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ROOT: ${{ steps.tarball.outputs.root }}
          INTEGRITY: ${{ needs.validate.outputs.integrity }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bundle="$RUNNER_TEMP/bundle"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git fetch --depth 1 origin "$BRANCH"
            git worktree add -B "$BRANCH" "$bundle" FETCH_HEAD
          else
            git worktree add --detach "$bundle"
            git -C "$bundle" checkout --orphan "$BRANCH"
          fi
          # The branch holds the tarball and nothing else: clear it, then unpack.
          find "$bundle" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$ROOT/." "$bundle/"
          git -C "$bundle" add -A
          if git -C "$bundle" diff --cached --quiet; then
            echo "$BRANCH already holds $PACKAGE@$VERSION; nothing to commit"
          else
            git -C "$bundle" commit -q \
              -m "release: interlock $VERSION" \
              -m "The published npm tarball $PACKAGE@$VERSION, unpacked unchanged. Integrity: $INTEGRITY"
          fi
          git -C "$bundle" push origin "HEAD:refs/heads/$BRANCH"
          echo "Plugin bundle: \`$BRANCH\` now holds $PACKAGE@$VERSION ($INTEGRITY)." >> "$GITHUB_STEP_SUMMARY"
