schema: spec-driven
githubCopilot:
  cloudAgent: true

# `tasks.md` is the wave plan that `/interlock:ship` executes, so its shape is a
# contract, not a style preference. Mirrored in skills/spec/SKILL.md so a
# consumer repo with an empty config still gets the rules.
rules:
  tasks:
    - Default grouping is the numbered section — a `## N.` section is one wave (`1.x` share a wave, `2.x` share the next).
    - Sequential same-file work is one checkbox — not one checkbox per TDD beat, comment move, or trap on the same production path.
    - Start a new numbered section only when a later set of tasks needs the previous section's output to already exist. Independent files that do not need each other belong in the same section so they can share a batch.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
